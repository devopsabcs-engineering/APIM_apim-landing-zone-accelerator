# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
- name: internalVnetName
  value: vnet-apim-cs-ApimESLZ-dev-canadacentral-002
- name: domainName
  value: MngEnv019702.onmicrosoft.com
- name: zoneName
  value: MngEnv019702.onmicrosoft.com
- name: ResourceGroupNameApim 
  value: rg-apim-ApimESLZ-dev-canadacentral-002
- name: apimServiceName
  value: apim-ApimESLZ-dev-canadacentral-002
- group: APIM_apim-landing-zone-accelerator_common
- name: appGatewayName
  value: appgw-ApimESLZ-dev-canadacentral-002
- name: Location
  value: canadacentral
- name: apimOrganization
  value: "Contoso MngEnv019702"
- name: apimAdminEmail
  value: "admin@MngEnv019702.onmicrosoft.com" # Administrator's email address
- group: APIM_apim-landing-zone-accelerator_common

stages :
- stage: get_and_set_version
  dependsOn: []
  jobs:
  - job: Set_tag_for_version
    displayName: set version once
    steps:
    - checkout: self
      persistCredentials: true
    - task: gitversion/setup@0
      enabled: true
      displayName: 'Install GitTools'
      inputs:
        versionSpec: '5.x'
    - task: gitversion/execute@0
      enabled: true
      displayName: 'Calculate SemVer'
    - script: echo current version is $(GitVersion.SemVer)
      displayName: 'Display calculated version'
    - task: CmdLine@2
      enabled: true
      displayName: Init git global config
      inputs:
        script: |
          git config --global user.email $(Build.RequestedForEmail)
          git config --global user.name $(Build.RequestedFor)
    - task: CmdLine@2
      enabled: true
      displayName: Create Git tag for current version
      inputs:
        script: |
          git tag -a $(GitVersion.SemVer) -m "Main version $(GitVersion.SemVer)"
          git push origin $(GitVersion.SemVer)       
- stage: appGateway
  dependsOn: get_and_set_version
  jobs:
  - job: appGatewayJob
    steps:
    - checkout: self
      persistCredentials: true
    - task: gitversion/setup@0
      enabled: true
      displayName: 'Install GitTools'
      inputs:
        versionSpec: '5.x'
    - task: gitversion/execute@0
      enabled: true
      displayName: 'Calculate SemVer'
    - script: echo current version is $(GitVersion.SemVer)
      displayName: 'Display calculated version'
    - task: DownloadSecureFile@1
      name: pfxApiTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_api.pfx'
    - task: DownloadSecureFile@1
      name: pfxManagementTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_management.pfx'
    - task: DownloadSecureFile@1
      name: pfxPortalTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_portal.pfx'
    - task: DownloadSecureFile@1
      name: trustedrootcert
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_cacert.pem'
    
    - task: AzureCLI@2
      displayName: Do the Dew
      inputs:
        azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
        scriptType: 'pscore'
        scriptLocation: 'scriptPath'
        scriptPath: '$(System.DefaultWorkingDirectory)/infra/scripts/main.ps1'
        arguments: '-Location $(Location) -ResourceGroupNameApim $(ResourceGroupNameApim) -zoneName $(zoneName) -appGatewayName $(appGatewayName) -GitVersionSemVer $(GitVersion.SemVer) -apimServiceName $(apimServiceName) -domainName $(domainName) -apimOrganization "$(apimOrganization)" -apimAdminEmail $(apimAdminEmail) -pfxPassword $(pfxPassword) -trustedrootcertsecureFIlePath $(trustedrootcert.secureFIlePath) -pfxApiTasksecureFIlePath $(pfxApiTask.secureFIlePath) -pfxPortalTasksecureFIlePath $(pfxPortalTask.secureFIlePath) -pfxManagementTasksecureFIlePath $(pfxManagementTask.secureFIlePath) -azureApplicationId $(azureApplicationId) -azureTenantId $(azureTenantId) -azureClientSecret $(azureClientSecret)'      
    - task: AzurePowerShell@5
      enabled: false
      displayName: Configure listeners and health probes for app gateway
      inputs:
        azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
        ScriptType: 'InlineScript'
        Inline: |
          # You can write your azure powershell scripts inline here. 
          # You can also pass predefined and custom variables to this script using arguments
          
          Write-Host create rg
          New-AzResourceGroup -Name $(ResourceGroupNameApim) -Location $(Location) -Tag @{"infraVersionFromPipeline"="v $(GitVersion.SemVer)"} -Force

          Write-Host Create a virtual network and a subnet for the application gateway
          $appGwRule1 = New-AzNetworkSecurityRuleConfig -Name appgw-in -Description "AppGw inbound" `
              -Access Allow -Protocol * -Direction Inbound -Priority 100 -SourceAddressPrefix `
              GatewayManager -SourcePortRange * -DestinationAddressPrefix * -DestinationPortRange 65200-65535
          $appGwRule2 = New-AzNetworkSecurityRuleConfig -Name appgw-in-internet -Description "AppGw inbound Internet" `
              -Access Allow -Protocol "TCP" -Direction Inbound -Priority 110 -SourceAddressPrefix `
              Internet -SourcePortRange * -DestinationAddressPrefix * -DestinationPortRange 443
          $appGwNsg = New-AzNetworkSecurityGroup -ResourceGroupName $(ResourceGroupNameApim) -Location $(Location) -Name `
              "NSG-APPGW" -SecurityRules $appGwRule1, $appGwRule2 -Force

          $apimRule1 = New-AzNetworkSecurityRuleConfig -Name apim-in -Description "APIM inbound" `
              -Access Allow -Protocol Tcp -Direction Inbound -Priority 100 -SourceAddressPrefix `
              ApiManagement -SourcePortRange * -DestinationAddressPrefix VirtualNetwork -DestinationPortRange 3443 
          $apimNsg = New-AzNetworkSecurityGroup -ResourceGroupName $(ResourceGroupNameApim) -Location $(Location) -Name `
              "NSG-APIM" -SecurityRules $apimRule1 -Force

          Write-Host new onward
          $appGatewaySubnet = New-AzVirtualNetworkSubnetConfig -Name "appGatewaySubnet" -NetworkSecurityGroup $appGwNsg -AddressPrefix "10.0.0.0/24"
          $apimSubnet = New-AzVirtualNetworkSubnetConfig -Name "apimSubnet" -NetworkSecurityGroup $apimNsg -AddressPrefix "10.0.1.0/24"
          $vnet = New-AzVirtualNetwork -Name "appgwvnet" -ResourceGroupName $(ResourceGroupNameApim) `
            -Location $(Location) -AddressPrefix "10.0.0.0/16" -Subnet $appGatewaySubnet,$apimSubnet -Force
          $appGatewaySubnetData = $vnet.Subnets[0]
          $apimSubnetData = $vnet.Subnets[1]

          Write-Host Create an API Management instance inside a virtual network

          $apimVirtualNetwork = New-AzApiManagementVirtualNetwork -SubnetResourceId $apimSubnetData.Id          
          $apimService = New-AzApiManagement -ResourceGroupName $(ResourceGroupNameApim) -Location $(Location) -Name $(apimServiceName) `
           -Organization "$(apimOrganization)" -AdminEmail $(apimAdminEmail) -VirtualNetwork $apimVirtualNetwork `
           -VpnType "Internal" -Sku "Developer"

          Write-Host "let us configure an app gateway for external access"

          $gatewayHostname = "api.$(domainName)"                 # API gateway host
          $portalHostname = "portal.$(domainName)"               # API developer portal host
          $managementHostname = "management.$(domainName)"               # API management endpoint host

          $gatewayCertPfxPath = "$(pfxApiTask.secureFIlePath)"
          $portalCertPfxPath = "$(pfxPortalTask.secureFIlePath)"
          $managementCertPfxPath = "$(pfxManagementTask.secureFIlePath)"
          
          # should use seperate pws
          $pw = "$(pfxPassword)"
          $certGatewayPwd = ConvertTo-SecureString -String $pw  -AsPlainText -Force
          $certPortalPwd = ConvertTo-SecureString -String $pw -AsPlainText -Force
          $certManagementPwd = ConvertTo-SecureString -String $pw -AsPlainText -Force
          
          # Path to trusted root CER file used in Application Gateway HTTP settings           
          $trustedRootCertCerPath =  "$(trustedrootcert.secureFIlePath)" # Full path to contoso.net trusted root .cer file
          cat $trustedRootCertCerPath

          $gatewayHostnameConfig = New-AzApiManagementCustomHostnameConfiguration -Hostname $gatewayHostname `
            -HostnameType Proxy -PfxPath $gatewayCertPfxPath -PfxPassword $certGatewayPwd
          $portalHostnameConfig = New-AzApiManagementCustomHostnameConfiguration -Hostname $portalHostname `
            -HostnameType DeveloperPortal -PfxPath $portalCertPfxPath -PfxPassword $certPortalPwd
          $managementHostnameConfig = New-AzApiManagementCustomHostnameConfiguration -Hostname $managementHostname `
            -HostnameType Management -PfxPath $managementCertPfxPath -PfxPassword $certManagementPwd

          $apimService.ProxyCustomHostnameConfiguration = $gatewayHostnameConfig
          $apimService.PortalCustomHostnameConfiguration = $portalHostnameConfig
          $apimService.ManagementCustomHostnameConfiguration = $managementHostnameConfig

          Set-AzApiManagement -InputObject $apimService

          Write-Host Configure a private zone for DNS resolution in the virtual network
          $existingZonesJson = az network private-dns zone list -g $(ResourceGroupNameApim)
          $existingZones = $existingZonesJson | ConvertFrom-Json
          if ( $existingZones.count -eq 0) {
            $myZone = New-AzPrivateDnsZone -Name "$(zoneName)" -ResourceGroupName $(ResourceGroupNameApim) 
            $link = New-AzPrivateDnsVirtualNetworkLink -ZoneName $(zoneName) `
            -ResourceGroupName $(ResourceGroupNameApim) -Name "mylink" `
            -VirtualNetworkId $vnet.id

            Write-Host Create A records for the custom domain host names that map to the private IP address of API Management.

            $apimIP = $apimService.PrivateIPAddresses[0]

            New-AzPrivateDnsRecordSet -Name api -RecordType A -ZoneName $(zoneName) `
              -ResourceGroupName $(ResourceGroupNameApim) -Ttl 3600 `
              -PrivateDnsRecords (New-AzPrivateDnsRecordConfig -IPv4Address $apimIP)
            New-AzPrivateDnsRecordSet -Name portal -RecordType A -ZoneName $(zoneName) `
              -ResourceGroupName $(ResourceGroupNameApim) -Ttl 3600 `
              -PrivateDnsRecords (New-AzPrivateDnsRecordConfig -IPv4Address $apimIP)
            New-AzPrivateDnsRecordSet -Name management -RecordType A -ZoneName $(zoneName) `
              -ResourceGroupName $(ResourceGroupNameApim) -Ttl 3600 `
              -PrivateDnsRecords (New-AzPrivateDnsRecordConfig -IPv4Address $apimIP)
          } else {
            Write-Host skipping creation of private zones
          }

          

          Write-Host Create a public IP address for the front-end configuration
          #Create a Standard public IP resource publicIP01 in the resource group.

          $publicip = New-AzPublicIpAddress -ResourceGroupName $(ResourceGroupNameApim) `
            -name "publicIP01" -location $(Location) -AllocationMethod Static -Sku Standard -Force
          #An IP address is assigned to the application gateway when the service starts.

          Write-Host Create application gateway configuration

          $gipconfig = New-AzApplicationGatewayIPConfiguration -Name "gatewayIP01" -Subnet $appGatewaySubnetData
          $fp01 = New-AzApplicationGatewayFrontendPort -Name "port01"  -Port 443
          $fipconfig01 = New-AzApplicationGatewayFrontendIPConfig -Name "frontend1" -PublicIPAddress $publicip

          $certGateway = New-AzApplicationGatewaySslCertificate -Name "gatewaycert" `
            -CertificateFile $gatewayCertPfxPath -Password $certGatewayPwd
          $certPortal = New-AzApplicationGatewaySslCertificate -Name "portalcert" `
            -CertificateFile $portalCertPfxPath -Password $certPortalPwd
          $certManagement = New-AzApplicationGatewaySslCertificate -Name "managementcert" `
            -CertificateFile $managementCertPfxPath -Password $certManagementPwd

          $gatewayListener = New-AzApplicationGatewayHttpListener -Name "gatewaylistener" `
            -Protocol "Https" -FrontendIPConfiguration $fipconfig01 -FrontendPort $fp01 `
            -SslCertificate $certGateway -HostName $gatewayHostname -RequireServerNameIndication true
          $portalListener = New-AzApplicationGatewayHttpListener -Name "portallistener" `
            -Protocol "Https" -FrontendIPConfiguration $fipconfig01 -FrontendPort $fp01 `
            -SslCertificate $certPortal -HostName $portalHostname -RequireServerNameIndication true
          $managementListener = New-AzApplicationGatewayHttpListener -Name "managementlistener" `
            -Protocol "Https" -FrontendIPConfiguration $fipconfig01 -FrontendPort $fp01 `
            -SslCertificate $certManagement -HostName $managementHostname -RequireServerNameIndication true

          $apimGatewayProbe = New-AzApplicationGatewayProbeConfig -Name "apimgatewayprobe" `
            -Protocol "Https" -HostName $gatewayHostname -Path "/status-0123456789abcdef" `
            -Interval 30 -Timeout 120 -UnhealthyThreshold 8
          $apimPortalProbe = New-AzApplicationGatewayProbeConfig -Name "apimportalprobe" `
            -Protocol "Https" -HostName $portalHostname -Path "/signin" `
            -Interval 60 -Timeout 300 -UnhealthyThreshold 8
          $apimManagementProbe = New-AzApplicationGatewayProbeConfig -Name "apimmanagementprobe" `
            -Protocol "Https" -HostName $managementHostname -Path "/ServiceStatus" `
            -Interval 60 -Timeout 300 -UnhealthyThreshold 8

          $trustedRootCert = New-AzApplicationGatewayTrustedRootCertificate -Name "whitelistcert1" -CertificateFile $trustedRootCertCerPath

          $apimPoolGatewaySetting = New-AzApplicationGatewayBackendHttpSettings -Name "apimPoolGatewaySetting" `
            -Port 443 -Protocol "Https" -CookieBasedAffinity "Disabled" -Probe $apimGatewayProbe `
            -TrustedRootCertificate $trustedRootCert -PickHostNameFromBackendAddress -RequestTimeout 180
          $apimPoolPortalSetting = New-AzApplicationGatewayBackendHttpSettings -Name "apimPoolPortalSetting" `
            -Port 443 -Protocol "Https" -CookieBasedAffinity "Disabled" -Probe $apimPortalProbe `
            -TrustedRootCertificate $trustedRootCert -PickHostNameFromBackendAddress -RequestTimeout 180
          $apimPoolManagementSetting = New-AzApplicationGatewayBackendHttpSettings -Name "apimPoolManagementSetting" `
            -Port 443 -Protocol "Https" -CookieBasedAffinity "Disabled" -Probe $apimManagementProbe `
            -TrustedRootCertificate $trustedRootCert -PickHostNameFromBackendAddress -RequestTimeout 180

          $apimGatewayBackendPool = New-AzApplicationGatewayBackendAddressPool -Name "gatewaybackend" `
            -BackendFqdns $gatewayHostname
          $apimPortalBackendPool = New-AzApplicationGatewayBackendAddressPool -Name "portalbackend" `
            -BackendFqdns $portalHostname
          $apimManagementBackendPool = New-AzApplicationGatewayBackendAddressPool -Name "managementbackend" `
            -BackendFqdns $managementHostname

          $gatewayRule = New-AzApplicationGatewayRequestRoutingRule -Name "gatewayrule" `
            -RuleType Basic -HttpListener $gatewayListener -BackendAddressPool $apimGatewayBackendPool `
            -BackendHttpSettings $apimPoolGatewaySetting
          $portalRule = New-AzApplicationGatewayRequestRoutingRule -Name "portalrule" `
            -RuleType Basic -HttpListener $portalListener -BackendAddressPool $apimPortalBackendPool `
            -BackendHttpSettings $apimPoolPortalSetting
          $managementRule = New-AzApplicationGatewayRequestRoutingRule -Name "managementrule" `
            -RuleType Basic -HttpListener $managementListener -BackendAddressPool $apimManagementBackendPool `
            -BackendHttpSettings $apimPoolManagementSetting

          $sku = New-AzApplicationGatewaySku -Name "WAF_v2" -Tier "WAF_v2" -Capacity 2

          $config = New-AzApplicationGatewayWebApplicationFirewallConfiguration -Enabled $true -FirewallMode "Prevention"

          $policy = New-AzApplicationGatewaySslPolicy -PolicyType Predefined -PolicyName AppGwSslPolicy20220101

          Write-Host Create an application gateway

          $appgwName = "apim-app-gw"
          $appgw = New-AzApplicationGateway -Name $(appGatewayName) -ResourceGroupName $(ResourceGroupNameApim) -Location $(Location) `
            -BackendAddressPools $apimGatewayBackendPool,$apimPortalBackendPool,$apimManagementBackendPool `
            -BackendHttpSettingsCollection $apimPoolGatewaySetting, $apimPoolPortalSetting, $apimPoolManagementSetting `
            -FrontendIpConfigurations $fipconfig01 -GatewayIpConfigurations $gipconfig -FrontendPorts $fp01 `
            -HttpListeners $gatewayListener,$portalListener,$managementListener `
            -RequestRoutingRules $gatewayRule,$portalRule,$managementRule `
            -Sku $sku -WebApplicationFirewallConfig $config -SslCertificates $certGateway,$certPortal,$certManagement `
            -TrustedRootCertificate $trustedRootCert -Probes $apimGatewayProbe,$apimPortalProbe,$apimManagementProbe `
            -SslPolicy $policy

          Write-Host After the application gateway deploys, confirm the health status of the API Management back ends in the portal or by running the following command

          Get-AzApplicationGatewayBackendHealth -Name $(appGatewayName) -ResourceGroupName $(ResourceGroupNameApim)

        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
    - task: AzurePowerShell@5
      enabled: false
      displayName: Configure listeners and health probes for app gateway
      inputs:
        azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
        ScriptType: 'InlineScript'
        Inline: |
          # You can write your azure powershell scripts inline here. 
          # You can also pass predefined and custom variables to this script using arguments
          
          Write-Host "let us configure an app gateway for external access"

          $gatewayCertPfxPath = "$(pfxApiTask.secureFIlePath)"
          $portalCertPfxPath = "$(pfxPortalTask.secureFIlePath)"
          $managementCertPfxPath = "$(pfxManagementTask.secureFIlePath)"
          
          # should use seperate pws
          $pw = "$(pfxPassword)"
          $certGatewayPwd = ConvertTo-SecureString -String $pw  -AsPlainText -Force
          $certPortalPwd = ConvertTo-SecureString -String $pw -AsPlainText -Force
          $certManagementPwd = ConvertTo-SecureString -String $pw -AsPlainText -Force
          
          $certGateway = New-AzApplicationGatewaySslCertificate -Name "gatewaycert" -CertificateFile "$gatewayCertPfxPath" -Password $certGatewayPwd
          
          Write-Host $certGateway
          
          $certPortal = New-AzApplicationGatewaySslCertificate -Name "portalcert" -CertificateFile "$portalCertPfxPath" -Password $certPortalPwd
          $certManagement = New-AzApplicationGatewaySslCertificate -Name "managementcert" -CertificateFile "$managementCertPfxPath" -Password $certManagementPwd

          $appGw = Get-AzApplicationGateway -Name $(appGatewayName)
          Get-AzApplicationGateway -Name $(appGatewayName)

          $vnet = Get-AzVirtualNetwork -Name $(internalVnetName) -ResourceGroupName $(resGroupNameNetworking)

          Write-Host ----------------------------------------------------------------
          $vnet.Subnets | Where-Object { $_.Name -eq "snet-apgw-ApimESLZ-dev-canadacentral-001"}
          $appGatewaySubnetData = $vnet.Subnets | Where-Object { $_.Name -eq "snet-apgw-ApimESLZ-dev-canadacentral-001"}
          
          Write-Host ----------------------------------------------------------------
          $vnet.Subnets | Where-Object { $_.Name -eq "snet-apim-ApimESLZ-dev-canadacentral-001"}
          $apimSubnetData =  $vnet.Subnets | Where-Object { $_.Name -eq "snet-apim-ApimESLZ-dev-canadacentral-001"}
          Write-Host ----------------------------------------------------------------
          
          $gipconfig = Get-AzApplicationGatewayIPConfiguration -ApplicationGateway $appGw -Name "appGatewayIpConfig"

          $fipconfig01 = Get-AzApplicationGatewayFrontendIPConfig -ApplicationGateway $appGw
          Get-AzApplicationGatewayFrontendIPConfig -ApplicationGateway $appGw

          $gatewayHostname = "api.MngEnv019702.onmicrosoft.com"                 # API gateway host
          $portalHostname = "portal.MngEnv019702.onmicrosoft.com"               # API developer portal host
          $managementHostname = "management.MngEnv019702.onmicrosoft.com"               # API management endpoint host

          Get-AzApplicationGatewayFrontendPort -ApplicationGateway $appGw

          $fp01 = Get-AzApplicationGatewayFrontendPort -ApplicationGateway $appGw -Name port_443

          Write-Host create http listeners...      
          $gatewayListener = New-AzApplicationGatewayHttpListener -Name "gatewaylistener" `
            -Protocol "Https" -FrontendIPConfiguration $fipconfig01 -FrontendPort $fp01 `
            -SslCertificate $certGateway -HostName $gatewayHostname -RequireServerNameIndication true
          $portalListener = New-AzApplicationGatewayHttpListener -Name "portallistener" `
            -Protocol "Https" -FrontendIPConfiguration $fipconfig01 -FrontendPort $fp01 `
            -SslCertificate $certPortal -HostName $portalHostname -RequireServerNameIndication true
          $managementListener = New-AzApplicationGatewayHttpListener -Name "managementlistener" `
            -Protocol "Https" -FrontendIPConfiguration $fipconfig01 -FrontendPort $fp01 `
            -SslCertificate $certManagement -HostName $managementHostname -RequireServerNameIndication true
          
          Write-Host create health probes...
          $apimGatewayProbe = New-AzApplicationGatewayProbeConfig -Name "apimgatewayprobe" `
            -Protocol "Https" -HostName $gatewayHostname -Path "/status-0123456789abcdef" `
            -Interval 30 -Timeout 120 -UnhealthyThreshold 8
          $apimPortalProbe = New-AzApplicationGatewayProbeConfig -Name "apimportalprobe" `
            -Protocol "Https" -HostName $portalHostname -Path "/signin" `
            -Interval 60 -Timeout 300 -UnhealthyThreshold 8
          $apimManagementProbe = New-AzApplicationGatewayProbeConfig -Name "apimmanagementprobe" `
            -Protocol "Https" -HostName $managementHostname -Path "/ServiceStatus" `
            -Interval 60 -Timeout 300 -UnhealthyThreshold 8

          Write-Host upload trusted root cert
          $trustedRootCertCerPath =  "$(trustedrootcert.secureFIlePath)"
          cat $trustedRootCertCerPath
          $trustedRootCert = New-AzApplicationGatewayTrustedRootCertificate -Name "whitelistcert1" -CertificateFile $trustedRootCertCerPath

          Write-Host Configure HTTP back-end settings for the application gateway, including a timeout limit for back-end requests, after which they are canceled. This value is different from the probe timeout
          $apimPoolGatewaySetting = New-AzApplicationGatewayBackendHttpSettings -Name "apimPoolGatewaySetting" `
            -Port 443 -Protocol "Https" -CookieBasedAffinity "Disabled" -Probe $apimGatewayProbe `
            -TrustedRootCertificate $trustedRootCert -PickHostNameFromBackendAddress -RequestTimeout 180
          $apimPoolPortalSetting = New-AzApplicationGatewayBackendHttpSettings -Name "apimPoolPortalSetting" `
            -Port 443 -Protocol "Https" -CookieBasedAffinity "Disabled" -Probe $apimPortalProbe `
            -TrustedRootCertificate $trustedRootCert -PickHostNameFromBackendAddress -RequestTimeout 180
          $apimPoolManagementSetting = New-AzApplicationGatewayBackendHttpSettings -Name "apimPoolManagementSetting" `
            -Port 443 -Protocol "Https" -CookieBasedAffinity "Disabled" -Probe $apimManagementProbe `
            -TrustedRootCertificate $trustedRootCert -PickHostNameFromBackendAddress -RequestTimeout 180

          Write-Host Configure a back-end IP address pool for each API Management endpoint by using its respective domain name
          $apimGatewayBackendPool = New-AzApplicationGatewayBackendAddressPool -Name "gatewaybackend" `
            -BackendFqdns $gatewayHostname
          $apimPortalBackendPool = New-AzApplicationGatewayBackendAddressPool -Name "portalbackend" `
            -BackendFqdns $portalHostname
          $apimManagementBackendPool = New-AzApplicationGatewayBackendAddressPool -Name "managementbackend" `
            -BackendFqdns $managementHostname
          
          Write-Host Create rules for the application gateway to use basic routing.
          $gatewayRule = New-AzApplicationGatewayRequestRoutingRule -Name "gatewayrule" `
            -RuleType Basic -HttpListener $gatewayListener -BackendAddressPool $apimGatewayBackendPool `
            -BackendHttpSettings $apimPoolGatewaySetting
          $portalRule = New-AzApplicationGatewayRequestRoutingRule -Name "portalrule" `
            -RuleType Basic -HttpListener $portalListener -BackendAddressPool $apimPortalBackendPool `
            -BackendHttpSettings $apimPoolPortalSetting
          $managementRule = New-AzApplicationGatewayRequestRoutingRule -Name "managementrule" `
            -RuleType Basic -HttpListener $managementListener -BackendAddressPool $apimManagementBackendPool `
            -BackendHttpSettings $apimPoolManagementSetting

          Write-Host get current waf 
          Get-AzApplicationGatewaySku -ApplicationGateway $appGw
          $sku = Get-AzApplicationGatewaySku -ApplicationGateway $appGw
          
          Write-Host get current waf config v2
          Get-AzApplicationGatewayWebApplicationFirewallConfiguration -ApplicationGateway $appGw
          $config = Get-AzApplicationGatewayWebApplicationFirewallConfiguration -ApplicationGateway $appGw

          Write-Host verify ssl policy
          Get-AzApplicationGatewaySslPolicy -ApplicationGateway $appGw
          $policy = Get-AzApplicationGatewaySslPolicy -ApplicationGateway $appGw
          
          Write-Host ----------------------------------------------------------------
          Write-Host confirm the health status of the API Management back ends BEFORE updating gateway
          Get-AzApplicationGatewayBackendHealth -Name $(appGatewayName) -ResourceGroupName $(ResourceGroupNameApim)

          Write-Host ----------------------------------------------------------------
          $appGatewayName = "$(appGatewayName)"
          Write-Host UPDATE APP GATEWAY!!!
          $originalAppGw = Get-AzApplicationGateway -Name $appGatewayName
          $originalAppGw.Tag = @{"infraVersionFromPipeline"="v $(GitVersion.SemVer)"}
          # fix issue All request routing rules should have a priority defined starting from api-version 2021-08-01
          $Rules = Get-AzApplicationGatewayRequestRoutingRule -Name "apim" -ApplicationGateway $originalAppGw
          $Rules.Priority = 10011 #Rule is still a pointer
          $originalAppGw = Set-AzApplicationGateway -ApplicationGateway $originalAppGw

          Write-Host round 2
          #backendpools -- need to append 3 ONLY ONCE
          $BackEndPools = Get-AzApplicationGatewayBackendAddressPool -ApplicationGateway $originalAppGw
          echo $BackEndPools
          $MoreBackEndPools = $apimGatewayBackendPool,$apimPortalBackendPool,$apimManagementBackendPool
          echo $MoreBackEndPools
          
          Write-Host ------backend address pool-------  add one at a time          
          
          $originalAppGw = Get-AzApplicationGateway -Name $appGatewayName
          echo $apimGatewayBackendPool
          echo $apimGatewayBackendPool.Name
          echo $apimGatewayBackendPool.BackendAddresses.Fqdn
          #$originalAppGw = Add-AzApplicationGatewayBackendAddressPool -ApplicationGateway $originalAppGw -Name $apimGatewayBackendPool.Name -BackendFqdns $apimGatewayBackendPool.BackendAddresses.Fqdn
          #$originalAppGw = Add-AzApplicationGatewayBackendAddressPool -ApplicationGateway $originalAppGw -Name $apimPortalBackendPool.Name -BackendFqdns $apimPortalBackendPool.BackendAddresses.Fqdn
          #$originalAppGw = Add-AzApplicationGatewayBackendAddressPool -ApplicationGateway $originalAppGw -Name $apimManagementBackendPool.Name -BackendFqdns $apimManagementBackendPool.BackendAddresses.Fqdn

          Write-Host -------- add gateway probes  -- do once
          #$Probe1 = Add-AzApplicationGatewayProbeConfig -ApplicationGateway $originalAppGw -Name "apimgatewayprobe" `
