                  --parameters baseName=$(baseName) imageName=$(imageName) addAzureAdAppSettings=true addStorageAccount=true azureAdClientId=$(azureAdClientId) azureAdClientSecret=$(azureAdClientSecret) azureAdDomain=$(azureAdDomain)
          - task: AzureCLI@2
            displayName: 'Build and Push Docker Image'
            name: build_push
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                containerRegistry=$(az deployment group show \
                  --name $(deploymentName) --resource-group $(resourceGroupName) \
                  --query properties.outputs.containerRegistryName.value -o tsv)
                SEMVER="${GITVERSION_SEMVER:-0.0.$(Build.BuildId)}"
                FILEVERSION="${GITVERSION_ASSEMBLYSEMFILEVER:-0.0.0.0}"
                ASMVERSION="${GITVERSION_ASSEMBLYSEMVER:-0.0.0}"
                set +e
                for attempt in 1 2 3; do
                  az acr build --registry "$containerRegistry" \
                  --image $(imageName):$(Build.BuildId) --image $(imageName):latest \
                  --file $(dockerfilePath) \
                  --build-arg GitVersion_SemVer="$SEMVER" \
                  --build-arg GitVersion_AssemblySemFileVer="$FILEVERSION" \
                  --build-arg GitVersion_AssemblySemVer="$ASMVERSION" \
                  $(dockerContext)
