              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                FLASK_URL="https://$(deploy_infra.resolvedAppName).azurewebsites.net"
                echo "Adding redirect URI: ${FLASK_URL}/getAToken"
                az ad app update --id "$(flaskClientId)" \
                  --web-redirect-uris \
                    "http://localhost:5000/getAToken" \
                    "${FLASK_URL}/getAToken" \
                  2>/dev/null || echo "Redirect URI update failed (non-fatal)"

