          - task: gitversion/setup@3
            displayName: 'Install GitVersion'
            inputs:
              versionSpec: '5.x'
          - task: gitversion/execute@3
            displayName: 'Calculate SemVer'
          - task: AzureCLI@2
            displayName: 'Deploy Infrastructure'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                if az group exists --name $(resourceGroupName) | grep -q true; then
                  echo "Deleting stale resource group $(resourceGroupName)..."
                  az group delete --name $(resourceGroupName) --yes
                fi
                az group create --name $(resourceGroupName) --location $(fastApiLocation)
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file $(bicepFile) \
                  --parameters appName=$(fastApiAppName) \
                              location=$(fastApiLocation) \
                              skuName=B1 skuTier=Basic skuCapacity=1 \
                              deploymentEnvironment=production
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              mkdir -p $(Build.ArtifactStagingDirectory)/$(packageFolder)
              pip install \
                --target $(Build.ArtifactStagingDirectory)/$(packageFolder) \
                --no-cache-dir \
                -r requirements.txt
              cp main.py telemetry_v2.py $(Build.ArtifactStagingDirectory)/$(packageFolder)/
              cp requirements.txt $(Build.ArtifactStagingDirectory)/$(packageFolder)/
            displayName: 'Install dependencies and copy sources'
            workingDirectory: $(System.DefaultWorkingDirectory)/src/fast-api-app-insights
          - task: ArchiveFiles@2
            displayName: 'Create deployment archive'
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/$(packageFolder)
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(packageArchive)
              replaceExistingArchive: true
          - task: AzureCLI@2
            displayName: 'Configure and deploy Fast API'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) --name $(fastApiAppName) \
                  --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false WEBSITES_PORT=8000 \
                  --output none
                az webapp config set \
                  --resource-group $(resourceGroupName) --name $(fastApiAppName) \
                  --startup-file "python -m uvicorn main:app --host 0.0.0.0 --port 8000" \
                  --output none
          - task: AzureWebApp@1
            displayName: 'Deploy Fast API package'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(fastApiAppName)
              package: $(Build.ArtifactStagingDirectory)/$(packageArchive)
              deploymentMethod: zipDeploy
          - task: AzureCLI@2
            displayName: 'Restart Fast API'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp restart --name $(fastApiAppName) --resource-group $(resourceGroupName)

      # ----------------------------------------------------------
      # Job 9: Appointments API (Function App Docker)
      # ----------------------------------------------------------
      - job: deploy_appointments_api
        displayName: 'Deploy Appointments API'
        variables:
          resourceGroupName: 'rg-appointments-fnapp-linux-003'
          apptLocation: 'canadacentral'
          baseName: 'appointments-api'
          imageName: 'appointmentsapi'
          instanceNumber: '003'
          dockerfilePath: '$(System.DefaultWorkingDirectory)/src/power-platform-custom-connector-api/Appointment/Appointment/Dockerfile'
          dockerContext: '$(System.DefaultWorkingDirectory)/src/power-platform-custom-connector-api/Appointment'
        steps:
          - checkout: self
            fetchDepth: 0
          - task: gitversion/setup@3
            displayName: 'Install GitVersion'
            inputs:
              versionSpec: '5.x'
          - task: gitversion/execute@3
            displayName: 'Calculate SemVer'
          - task: AzureCLI@2
            displayName: 'Deploy Infrastructure'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                if az group exists --name $(resourceGroupName) | grep -q true; then
                  echo "Deleting stale resource group $(resourceGroupName)..."
                  az group delete --name $(resourceGroupName) --yes
                fi
                az group create --name $(resourceGroupName) --location $(apptLocation)
                az deployment group create \
                  --name $(deploymentName) \
                  --resource-group $(resourceGroupName) \
                  --template-file $(fnappTemplateFile) \
                  --parameters instanceNumber=$(instanceNumber)
          - task: AzureCLI@2
            displayName: 'Build and Push Docker Image'
            name: build_push
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                containerRegistry=$(az deployment group show \
                  --name $(deploymentName) --resource-group $(resourceGroupName) \
                  --query properties.outputs.containerRegistryName.value -o tsv)
                SEMVER="${GITVERSION_SEMVER:-0.0.$(Build.BuildId)}"
                FILEVERSION="${GITVERSION_ASSEMBLYSEMFILEVER:-0.0.0.0}"
                ASMVERSION="${GITVERSION_ASSEMBLYSEMVER:-0.0.0}"
                set +e
                for attempt in 1 2 3; do
                  az acr build --registry "$containerRegistry" \
                  --image $(imageName):$(Build.BuildId) --image $(imageName):latest \
                  --file $(dockerfilePath) \
                  --build-arg GitVersion_SemVer="$SEMVER" \
                  --build-arg GitVersion_AssemblySemFileVer="$FILEVERSION" \
                  --build-arg GitVersion_AssemblySemVer="$ASMVERSION" \
                  $(dockerContext)
                  acr_exit=$?
                  [ $acr_exit -eq 0 ] && break
                  echo "ACR build attempt $attempt failed, retrying in 30s..."
                  sleep 30
                done
                set -e
                [ $acr_exit -ne 0 ] && exit $acr_exit
                appName=$(az deployment group show \
                  --name $(deploymentName) --resource-group $(resourceGroupName) \
                  --query properties.outputs.functionAppName.value -o tsv)
                echo "##vso[task.setvariable variable=appName;isOutput=true]$appName"
          - task: AzureCLI@2
            displayName: 'Restart Function App'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az functionapp restart --name "$(build_push.appName)" --resource-group $(resourceGroupName)

  # ================================================================
  # Stage 4: Screenshots and Wiki Report
  # ================================================================
  - stage: screenshots_and_report
    displayName: 'Screenshots and Wiki Report'
    dependsOn:
      - deploy_apim
      - deploy_apis
    condition: not(canceled())
    jobs:
      - job: capture_screenshots
        displayName: 'Capture Screenshots and Publish Wiki'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: 'Use Node.js 20.x'
            inputs:
              versionSpec: '20.x'

          - script: |
              npm init -y
              npm install puppeteer
            displayName: 'Install Puppeteer'
            workingDirectory: $(Build.ArtifactStagingDirectory)

          - task: AzureCLI@2
            displayName: 'Resolve App URLs and Capture Screenshots'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                SCREENSHOT_DIR="$(Build.ArtifactStagingDirectory)/screenshots"
                mkdir -p "$SCREENSHOT_DIR"

                resolve_app_url() {
                  local rg="$1"
                  local output_key="${2:-appName}"
                  local app_name
                  app_name=$(az deployment group show \
                    --name infra-deployment \
                    --resource-group "$rg" \
                    --query "properties.outputs.${output_key}.value" -o tsv 2>/dev/null || echo "")
                  if [ -n "$app_name" ]; then
                    echo "https://${app_name}.azurewebsites.net"
                  fi
                }

                resolve_func_url() {
                  local rg="$1"
                  local app_name
                  app_name=$(az deployment group show \
                    --name infra-deployment \
                    --resource-group "$rg" \
                    --query "properties.outputs.functionAppName.value" -o tsv 2>/dev/null || echo "")
                  if [ -n "$app_name" ]; then
                    echo "https://${app_name}.azurewebsites.net"
                  fi
                }

                WEB_APP_URL=$(resolve_app_url "rg-web-appservice-linux-005")
                WEATHER_API_URL=$(resolve_app_url "rg-weather-appservice-linux-005")
                STAR_WARS_API_URL=$(resolve_app_url "rg-star-wars-appservice-linux-003")
                SOAP_API_URL=$(resolve_app_url "rg-soap-appservice-linux-007")
                ODATA_API_URL=$(resolve_app_url "rg-odata-appservice-linux-002")
                MOVIE_API_URL=$(resolve_app_url "rg-movies-appservice-linux-006")
                FLASK_APP_URL="https://app-flask-iru5pc6fcyhre.azurewebsites.net"
                FAST_API_URL="https://fast-api-app-insights-001.azurewebsites.net"
                APPOINTMENTS_API_URL=$(resolve_func_url "rg-appointments-fnapp-linux-003")

                echo "Resolved URLs:"
                echo "  Web App:          $WEB_APP_URL"
                echo "  Weather API:      $WEATHER_API_URL"
                echo "  Star Wars API:    $STAR_WARS_API_URL"
                echo "  SOAP API:         $SOAP_API_URL"
                echo "  OData API:        $ODATA_API_URL"
                echo "  Movie API:        $MOVIE_API_URL"
                echo "  Flask App:        $FLASK_APP_URL"
                echo "  Fast API:         $FAST_API_URL"
                echo "  Appointments API: $APPOINTMENTS_API_URL"

                cat > "$(Build.ArtifactStagingDirectory)/screenshot.js" << 'PUPPETEER_SCRIPT'
                const puppeteer = require('puppeteer');
                const path = require('path');

                const apps = JSON.parse(process.env.APPS_JSON);
                const outputDir = process.env.SCREENSHOT_DIR;

                (async () => {
                  const browser = await puppeteer.launch({
                    headless: 'new',
                    args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
                  });

                  for (const app of apps) {
                    const filename = path.join(outputDir, `${app.slug}.png`);
                    let success = false;
                    for (let attempt = 1; attempt <= 2 && !success; attempt++) {
                      const page = await browser.newPage();
                      await page.setViewport({ width: 1280, height: 900 });
                      try {
                        console.log(`Capturing: ${app.name} -> ${app.url} (attempt ${attempt})`);
                        await page.goto(app.url, { waitUntil: 'networkidle2', timeout: 60000 });
                        if (app.url.includes('/swagger/')) {
                          await page.waitForSelector('.swagger-ui .opblock', { timeout: 30000 }).catch(() => {});
                        }
                        await new Promise(r => setTimeout(r, 2000));
                        await page.screenshot({ path: filename, fullPage: false });
                        console.log(`  Saved: ${filename}`);
                        success = true;
                      } catch (err) {
                        console.error(`  Attempt ${attempt} failed for ${app.name}: ${err.message}`);
                      } finally {
                        await page.close();
                      }
                    }
                    if (!success) {
                      console.error(`  SKIPPED: ${app.name} after 2 attempts`);
                    }
                  }

                  await browser.close();
                })();
                PUPPETEER_SCRIPT

                APPS_JSON=$(cat <<EOF
                [
                  {"name":"Web App","slug":"web-app","url":"${WEB_APP_URL}/"},
                  {"name":"Weather API","slug":"weather-api","url":"${WEATHER_API_URL}/swagger/index.html"},
                  {"name":"Star Wars API","slug":"star-wars-api","url":"${STAR_WARS_API_URL}/swagger/index.html"},
                  {"name":"SOAP API","slug":"soap-api","url":"${SOAP_API_URL}/PersonProfileService.asmx?wsdl"},
                  {"name":"OData API","slug":"odata-api","url":"${ODATA_API_URL}/odata/\$metadata"},
                  {"name":"Movie API","slug":"movie-api","url":"${MOVIE_API_URL}/swagger/index.html"},
                  {"name":"Flask App","slug":"flask-app","url":"${FLASK_APP_URL}/"},
                  {"name":"Fast API","slug":"fast-api","url":"${FAST_API_URL}/docs"},
                  {"name":"Appointments API","slug":"appointments-api","url":"${APPOINTMENTS_API_URL}/api/Appointment"}
                ]
                EOF
                )

                export APPS_JSON
                export SCREENSHOT_DIR

                echo "Warming up all apps before screenshot capture..."
                echo "$APPS_JSON" | grep -oP '"url"\s*:\s*"\K[^"]+' | while read -r URL; do
                  curl -s -o /dev/null --max-time 30 "$URL" 2>/dev/null &
                done
                wait
                echo "Warmup complete."

                node "$(Build.ArtifactStagingDirectory)/screenshot.js" || echo "Screenshot capture completed with warnings"

                echo ""
                echo "=== Screenshot capture results ==="
                TOTAL=$(find "$SCREENSHOT_DIR" -name "*.png" 2>/dev/null | wc -l)
                echo "Total screenshots captured: $TOTAL / 9"
                for SLUG in web-app weather-api star-wars-api soap-api odata-api movie-api flask-app fast-api appointments-api; do
                  if [ -f "$SCREENSHOT_DIR/${SLUG}.png" ]; then
                    SIZE=$(stat -c%s "$SCREENSHOT_DIR/${SLUG}.png" 2>/dev/null || echo "?")
                    echo "  ✅ ${SLUG}.png ($SIZE bytes)"
                  else
                    echo "  ❌ ${SLUG}.png MISSING"
                  fi
                done

          - task: AzureCLI@2
            displayName: 'Generate Deployment Report'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
                WIKI_FILE="$(Build.ArtifactStagingDirectory)/wiki-report.md"
                PIPELINE_URL="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

                resolve_app_url() {
                  local rg="$1"
                  local output_key="${2:-appName}"
                  az deployment group show --name infra-deployment --resource-group "$rg" \
                    --query "properties.outputs.${output_key}.value" -o tsv 2>/dev/null || echo ""
                }
                resolve_func_url() {
                  local rg="$1"
                  az deployment group show --name infra-deployment --resource-group "$rg" \
                    --query "properties.outputs.functionAppName.value" -o tsv 2>/dev/null || echo ""
                }

                WEB_APP_NAME=$(resolve_app_url "rg-web-appservice-linux-005")
                WEATHER_API_NAME=$(resolve_app_url "rg-weather-appservice-linux-005")
                STAR_WARS_API_NAME=$(resolve_app_url "rg-star-wars-appservice-linux-003")
                SOAP_API_NAME=$(resolve_app_url "rg-soap-appservice-linux-007")
                ODATA_API_NAME=$(resolve_app_url "rg-odata-appservice-linux-002")
                MOVIE_API_NAME=$(resolve_app_url "rg-movies-appservice-linux-006")
                FLASK_APP_NAME="app-flask-iru5pc6fcyhre"
                FAST_API_NAME="fast-api-app-insights-001"
                APPOINTMENTS_API_NAME=$(resolve_func_url "rg-appointments-fnapp-linux-003")

                declare -a APP_NAMES=("Web App" "Weather API" "Star Wars API" "SOAP API" "OData API" "Movie API" "Flask App" "Fast API" "Appointments API")
                declare -a APP_HOSTS=("$WEB_APP_NAME" "$WEATHER_API_NAME" "$STAR_WARS_API_NAME" "$SOAP_API_NAME" "$ODATA_API_NAME" "$MOVIE_API_NAME" "$FLASK_APP_NAME" "$FAST_API_NAME" "$APPOINTMENTS_API_NAME")
                declare -a VERSION_PATHS=("/api/version" "/api/version" "/api/version" "/api/version" "/api/version" "/api/version" "/version" "/version" "/api/version")
                declare -a SMOKE_PATHS=("/api/version" "/swagger" "/swagger" "/PersonProfileService.asmx?wsdl" '/odata/$metadata' "/swagger" "/" "/healthz" "/api/Appointment")
                declare -a SLUGS=("web-app" "weather-api" "star-wars-api" "soap-api" "odata-api" "movie-api" "flask-app" "fast-api" "appointments-api")

                {
                  echo "# Lab Deployment Report"
                  echo ""
                  echo "_Generated: ${TIMESTAMP}_"
                  echo ""
                  echo "**Pipeline Run:** [#$(Build.BuildNumber)](${PIPELINE_URL})"
                  echo "**Branch:** \`$(Build.SourceBranchName)\`"
                  echo "**Triggered by:** $(Build.RequestedFor)"
                  echo "**Instance:** ${{ parameters.instanceNumber }}"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Application Status"
                  echo ""
                  echo "| Application | URL | Version | Smoke Test |"
                  echo "|-------------|-----|---------|------------|"
                } > "$WIKI_FILE"

                for i in "${!APP_NAMES[@]}"; do
                  NAME="${APP_NAMES[$i]}"
                  HOST="${APP_HOSTS[$i]}"
                  VPATH="${VERSION_PATHS[$i]}"
                  SPATH="${SMOKE_PATHS[$i]}"

                  if [ -z "$HOST" ]; then
                    echo "| ${NAME} | _not deployed_ | N/A | N/A |" >> "$WIKI_FILE"
                    continue
                  fi

                  BASE_URL="https://${HOST}.azurewebsites.net"
                  VERSION=$(curl -s --max-time 15 "${BASE_URL}${VPATH}" 2>/dev/null || echo "N/A")
                  SMOKE_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "${BASE_URL}${SPATH}" 2>/dev/null || echo "000")

                  if [[ "${SMOKE_STATUS}" -ge 200 && "${SMOKE_STATUS}" -lt 400 ]]; then
                    SMOKE_ICON="Pass (HTTP ${SMOKE_STATUS})"
                  elif [[ "${SMOKE_STATUS}" -ge 400 && "${SMOKE_STATUS}" -lt 500 ]]; then
                    SMOKE_ICON="Warning (HTTP ${SMOKE_STATUS})"
                  else
                    SMOKE_ICON="Fail (HTTP ${SMOKE_STATUS})"
                  fi

                  echo "| ${NAME} | [${BASE_URL}](${BASE_URL}) | \`${VERSION}\` | ${SMOKE_ICON} |" >> "$WIKI_FILE"
                done

                {
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Screenshots"
                  echo ""
                } >> "$WIKI_FILE"

                SCREENSHOT_DIR="$(Build.ArtifactStagingDirectory)/screenshots"
                FOUND=false
                for SLUG in "${SLUGS[@]}"; do
                  IMG="${SCREENSHOT_DIR}/${SLUG}.png"
                  if [ -f "$IMG" ]; then
                    FOUND=true
                    LABEL=$(echo "$SLUG" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')
                    echo "### ${LABEL}" >> "$WIKI_FILE"
                    echo "" >> "$WIKI_FILE"
                    echo "![${LABEL}](/.attachments/screenshots-${SLUG}.png)" >> "$WIKI_FILE"
                    echo "" >> "$WIKI_FILE"
                  fi
                done

                if [ "$FOUND" = "false" ]; then
                  echo "_No screenshots captured in this run._" >> "$WIKI_FILE"
                fi

                {
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Deployment Details"
                  echo ""
                  echo "| Property | Value |"
                  echo "|----------|-------|"
                  echo "| Build ID | $(Build.BuildId) |"
                  echo "| Build Number | $(Build.BuildNumber) |"
                  echo "| Commit | \`$(Build.SourceVersion)\` |"
                  echo "| Timestamp | ${TIMESTAMP} |"
                } >> "$WIKI_FILE"

                echo "Wiki report generated at: $WIKI_FILE"

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Screenshots Artifact'
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/screenshots
              artifactName: screenshots
            condition: always()
            continueOnError: true

          - task: AzureCLI@2
            displayName: 'Publish Report to ADO Wiki'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name azure-devops --allow-preview true 2>/dev/null || true
                export AZURE_DEVOPS_EXT_PAT=$(AZDO_PAT)
                az devops configure --defaults organization=https://dev.azure.com/devopsabcs project=OneProject

                WIKI_NAME="OneProject.wiki"
                WIKI_FILE="$(Build.ArtifactStagingDirectory)/wiki-report.md"
                SCREENSHOT_DIR="$(Build.ArtifactStagingDirectory)/screenshots"
                ORG_URL="https://dev.azure.com/devopsabcs"
                PROJECT="OneProject"
                WIKI_CLONE_DIR="/tmp/wiki-repo"

                # --- Clone the wiki git repo ---
                rm -rf "$WIKI_CLONE_DIR"
                git clone "https://:${AZURE_DEVOPS_EXT_PAT}@dev.azure.com/devopsabcs/${PROJECT}/_git/${PROJECT}.wiki" "$WIKI_CLONE_DIR" 2>/dev/null || {
                  echo "Failed to clone wiki repo. Skipping wiki publish."
                  exit 0
                }

                cd "$WIKI_CLONE_DIR"
                git config user.email "pipeline@devopsabcs.com"
                git config user.name "ADO Pipeline"

                # --- Upload screenshots to .attachments ---
                mkdir -p ".attachments"
                if [ -d "$SCREENSHOT_DIR" ]; then
                  echo "Copying screenshots to wiki .attachments..."
                  for IMG in "$SCREENSHOT_DIR"/*.png; do
                    [ -f "$IMG" ] || continue
                    DEST=".attachments/screenshots-$(basename "$IMG")"
                    cp "$IMG" "$DEST"
                    echo "  Copied: $DEST"
                  done
                fi

                # --- Write wiki pages ---
                mkdir -p "Deployment-Reports"

                # Ensure parent page exists
                if [ ! -f "Deployment-Reports.md" ]; then
                  echo "# Deployment Reports" > "Deployment-Reports.md"
                fi

                # Copy report as Latest only — no historical copies
                rm -f Deployment-Reports/Lab-*.md
                cp "$WIKI_FILE" "Deployment-Reports/Latest-Lab-Report.md"

                # --- Commit and push ---
                git add -A
                if git diff --cached --quiet; then
                  echo "No wiki changes to commit."
                else
                  git commit -m "Lab deployment report for build $(Build.BuildNumber)"
                  git push origin wikiMaster 2>/dev/null || git push origin main 2>/dev/null || echo "Wiki push failed"
                  echo "Wiki updated successfully."
                fi
            env:
              AZURE_DEVOPS_EXT_PAT: $(AZDO_PAT)

  # ================================================================
  # Stage 5: Publish APIops to Dev
  # ================================================================
  - stage: publish_apiops_dev
    displayName: 'Publish APIops to Dev'
    dependsOn:
      - deploy_apim
      - deploy_apis
      - screenshots_and_report
    condition: |
      and(
        not(canceled()),
        in(dependencies.deploy_apim.result, 'Succeeded', 'Skipped')
      )
    pool:
      name: KubernetesPoolOnPremLinux002
    jobs:
      - job: publish_dev
        displayName: 'Run APIops Publisher (Dev)'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              set -euo pipefail
              echo "Downloading publisher $(publisherVersion)..."
              curl -L -o publisher.zip \
                "https://github.com/Azure/apiops/releases/download/$(publisherVersion)/publisher-linux-x64.zip"
              unzip -o publisher.zip -d publisher
              chmod +x publisher/publisher
              echo "Publisher ready."
            displayName: 'Download APIops publisher'

          - task: AzureCLI@2
            displayName: 'Ensure demo-admin user exists (Dev)'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                RG="rg-apim-basicv2-dev-${{ parameters.instanceNumber }}"
                APIM_NAME=$(az apim list --resource-group "$RG" --query "[0].name" -o tsv)
                SUB_ID=$(az account show --query id -o tsv)
                API_VERSION="2024-06-01-preview"
                USER_URL="https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM_NAME/users/demo-admin?api-version=$API_VERSION"
                echo "Ensuring demo-admin user exists on $APIM_NAME..."
                az rest --method put --url "$USER_URL" \
                  --body '{"properties":{"firstName":"Demo","lastName":"Admin","email":"demo-admin@'"$APIM_NAME"'.apim.net","state":"active"}}' \
                  --headers 'Content-Type=application/json' -o none 2>/dev/null || true
                echo "demo-admin user ready."

          - task: AzureCLI@2
            displayName: 'Run publisher for dev-${{ parameters.instanceNumber }}'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              failOnStandardError: false
              inlineScript: |
                set -euo pipefail

                export AZURE_CLIENT_ID="$servicePrincipalId"
                export AZURE_CLIENT_SECRET="$servicePrincipalKey"
                export AZURE_TENANT_ID="$tenantId"
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export AZURE_RESOURCE_GROUP_NAME="rg-apim-basicv2-dev-${{ parameters.instanceNumber }}"
                export API_MANAGEMENT_SERVICE_NAME=$(az apim list \
                  --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
                  --query "[0].name" -o tsv)
                export API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH="$(System.DefaultWorkingDirectory)/artifacts.dev-${{ parameters.instanceNumber }}"
                export Logging__LogLevel__Default="Debug"

                echo "Resource Group : $AZURE_RESOURCE_GROUP_NAME"
                echo "APIM Instance  : $API_MANAGEMENT_SERVICE_NAME"
                echo "Output Folder  : $API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH"

                ./publisher/publisher
                echo "Publisher execution complete."

  # ================================================================
  # Stage 6: Publish APIops to Prod (with approval gate)
  # ================================================================
  - stage: publish_apiops_prod
    displayName: 'Publish APIops to Prod'
    dependsOn: publish_apiops_dev
    pool:
      name: KubernetesPoolOnPremLinux002
    jobs:
      - deployment: publish_prod
        displayName: 'Run APIops Publisher (Prod)'
        environment: 'APIM_APIops_Prod_006'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0

                - script: |
                    set -euo pipefail
                    echo "Downloading publisher $(publisherVersion)..."
                    curl -L -o publisher.zip \
                      "https://github.com/Azure/apiops/releases/download/$(publisherVersion)/publisher-linux-x64.zip"
                    unzip -o publisher.zip -d publisher
                    chmod +x publisher/publisher
                    echo "Publisher ready."
                  displayName: 'Download APIops publisher'

                - script: |
                    set -euo pipefail
                    CONFIG_YAML="configuration.prod-${{ parameters.instanceNumber }}.yaml"
                    if [ -f "$(System.DefaultWorkingDirectory)/$CONFIG_YAML" ]; then
                      echo "Performing token substitution in $CONFIG_YAML..."
                      sed -i "s/{#testSecretValue#}/$(testSecretValue)/g" \
                        "$(System.DefaultWorkingDirectory)/$CONFIG_YAML"
                      echo "Token substitution complete."
                    else
                      echo "Configuration file $CONFIG_YAML not found – skipping token substitution."
                    fi
                  displayName: 'Token substitution'

                - task: AzureCLI@2
                  displayName: 'Ensure demo-admin user exists (Prod)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      RG="rg-apim-basicv2-prod-${{ parameters.instanceNumber }}"
                      APIM_NAME=$(az apim list --resource-group "$RG" --query "[0].name" -o tsv)
                      SUB_ID=$(az account show --query id -o tsv)
                      API_VERSION="2024-06-01-preview"
                      USER_URL="https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM_NAME/users/demo-admin?api-version=$API_VERSION"
                      echo "Ensuring demo-admin user exists on $APIM_NAME..."
                      az rest --method put --url "$USER_URL" \
                        --body '{"properties":{"firstName":"Demo","lastName":"Admin","email":"demo-admin@'"$APIM_NAME"'.apim.net","state":"active"}}' \
                        --headers 'Content-Type=application/json' -o none 2>/dev/null || true
                      echo "demo-admin user ready."

                - task: AzureCLI@2
                  displayName: 'Run publisher for prod-${{ parameters.instanceNumber }}'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    failOnStandardError: false
                    inlineScript: |
                      set -euo pipefail

                      export AZURE_CLIENT_ID="$servicePrincipalId"
                      export AZURE_CLIENT_SECRET="$servicePrincipalKey"
                      export AZURE_TENANT_ID="$tenantId"
                      export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export AZURE_RESOURCE_GROUP_NAME="rg-apim-basicv2-prod-${{ parameters.instanceNumber }}"
                      export API_MANAGEMENT_SERVICE_NAME=$(az apim list \
                        --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
                        --query "[0].name" -o tsv)
                      export API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH="$(System.DefaultWorkingDirectory)/artifacts.dev-${{ parameters.instanceNumber }}"
                      export CONFIGURATION_YAML_PATH="$(System.DefaultWorkingDirectory)/configuration.prod-${{ parameters.instanceNumber }}.yaml"
                      export Logging__LogLevel__Default="Debug"

                      echo "Resource Group : $AZURE_RESOURCE_GROUP_NAME"
                      echo "APIM Instance  : $API_MANAGEMENT_SERVICE_NAME"
                      echo "Output Folder  : $API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH"
                      echo "Config YAML    : $CONFIGURATION_YAML_PATH"

                      ./publisher/publisher
                      echo "Publisher execution complete."

  # ================================================================
  # Stage 7: Lab Summary
  # ================================================================
  - stage: lab_summary
    displayName: 'Lab Deployment Summary'
    dependsOn:
      - record_start
      - deploy_apim
      - deploy_apis
      - publish_apiops_dev
      - publish_apiops_prod
    condition: always()
    pool:
      name: KubernetesPoolOnPremLinux002
    variables:
      startTime: $[ stageDependencies.record_start.record_time.outputs['timer.startTime'] ]
    jobs:
      - job: summary
        displayName: 'Generate Lab Summary'
        steps:
          - script: |
              set -euo pipefail

              # --- Calculate duration ---
              START=$(startTime)
              END=$(date +%s)
              DURATION=$((END - START))
              HOURS=$((DURATION / 3600))
              MINUTES=$(( (DURATION % 3600) / 60 ))
              SECONDS=$((DURATION % 60))

              if [ "$HOURS" -gt 0 ]; then
                FORMATTED="${HOURS}h ${MINUTES}m ${SECONDS}s"
              else
                FORMATTED="${MINUTES}m ${SECONDS}s"
              fi

              INSTANCE="${{ parameters.instanceNumber }}"
              LOCATION="${{ parameters.location }}"
              DEPLOY_APIS="${{ parameters.deployApis }}"
              BUILD_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              TRIGGERED_BY="$(Build.RequestedFor)"

              # --- Generate summary file ---
              SUMMARY_FILE="$(Build.ArtifactStagingDirectory)/lab-summary.md"
              mkdir -p "$(Build.ArtifactStagingDirectory)"

              {
                echo "# APIM Lab Environment — Deployment Summary"
                echo ""
                echo "## Overview"
                echo ""
                echo "| Property | Value |"
                echo "|----------|-------|"
                echo "| Instance | \`${INSTANCE}\` |"
                echo "| Location | \`${LOCATION}\` |"
                echo "| Wall-Clock Time | \`${FORMATTED}\` |"
                echo "| Build | [#$(Build.BuildId)](${BUILD_URL}) |"
                echo "| Triggered By | ${TRIGGERED_BY} |"
                echo ""
                echo "## Stage Results"
                echo ""
                echo "| Stage | Status |"
                echo "|-------|--------|"
                echo "| Deploy APIM (dev + prod) | See pipeline |"
                echo "| Deploy Backend APIs | See pipeline |"
                echo "| Publish APIops to Dev | See pipeline |"
                echo "| Publish APIops to Prod | See pipeline |"
                echo ""
                echo "## Resource Groups"
                echo ""
                echo "### APIM"
                echo ""
                echo "| Resource Group | Environment |"
                echo "|----------------|-------------|"
                echo "| \`rg-apim-basicv2-dev-${INSTANCE}\` | Dev |"
                echo "| \`rg-apim-basicv2-prod-${INSTANCE}\` | Prod |"
                echo ""

                if [ "${DEPLOY_APIS}" = "True" ]; then
                  echo "### Backend APIs"
                  echo ""
                  echo "| Resource Group | Application |"
                  echo "|----------------|-------------|"
                  echo "| \`rg-web-appservice-linux-005\` | Web App |"
                  echo "| \`rg-weather-appservice-linux-005\` | Weather API |"
                  echo "| \`rg-star-wars-appservice-linux-003\` | Star Wars API |"
                  echo "| \`rg-soap-appservice-linux-007\` | SOAP API |"
                  echo "| \`rg-odata-appservice-linux-002\` | OData API |"
                  echo "| \`rg-movies-appservice-linux-006\` | Movie API |"
                  echo "| \`rg-msal-python-soln\` | Flask App |"
                  echo "| \`rg-fast-api-app-insights-001\` | Fast API |"
                  echo "| \`rg-appointments-fnapp-linux-003\` | Appointments API |"
                  echo ""
                fi

                echo "## Estimated Monthly Cost"
                echo ""
                echo "| Component | SKU | Estimated Cost |"
                echo "|-----------|-----|----------------|"
                echo "| APIM Dev (BasicV2) | BasicV2 | ~\$150/month |"
                echo "| APIM Prod (BasicV2) | BasicV2 | ~\$150/month |"
                echo "| 9 Backend APIs (App Service) | B1 | ~\$90/month |"
                echo "| **Total (always-on)** | | **~\$390/month** |"
                echo "| **On-demand (8 hrs/week)** | | **~\$40/month** |"
                echo ""
                echo "> **Cost savings tip:** Use the teardown-lab workflow to destroy the"
                echo "> environment when not in use. Recreate it with this workflow before demos."
                echo ""
                echo "## Next Steps"
                echo ""
                echo "1. Open the APIM Developer Portal to verify all APIs are published"
                echo "2. Run the deployment report workflow to generate the wiki report"
                echo "3. When finished, run the teardown-lab workflow to destroy all resources"
              } > "$SUMMARY_FILE"

              echo "Summary written to $SUMMARY_FILE"
              cat "$SUMMARY_FILE"
            displayName: 'Generate lab summary'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish lab summary artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/lab-summary.md'
              ArtifactName: 'lab-summary'
              publishLocation: 'Container'
