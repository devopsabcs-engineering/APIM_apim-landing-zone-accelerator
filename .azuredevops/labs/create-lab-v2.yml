# ---------------------------------------------------------------------------
# Create APIM Lab Environment (ADO v2)
# Ports: .github/workflows/create-lab.yml
# Orchestrates full lab creation: APIM infra, backend APIs, APIops publishing
#
# Dependency chain:
#   record_start → (deploy_apim [dev||prod] || deploy_apis) → publish_apiops_dev
#     → publish_apiops_prod → lab_summary
# ---------------------------------------------------------------------------

trigger: none

parameters:
  - name: instanceNumber
    type: string
    default: '006'
  - name: location
    type: string
    default: 'canadacentral'
  - name: deployApis
    type: boolean
    default: true
  - name: deployApim
    type: boolean
    default: true

variables:
  - group: APIM_rg-apim-vnet-external-dev-006
  - name: azureSubscription
    value: 'APIM_MicrosoftAzureExternal_multitenant'
  - name: templateFile
    value: '$(System.DefaultWorkingDirectory)/infra/api-management-basicv2/main.bicep'
  - name: parametersDir
    value: '$(System.DefaultWorkingDirectory)/infra/api-management-basicv2'
  - name: rgDev
    value: 'rg-apim-basicv2-dev-${{ parameters.instanceNumber }}'
  - name: rgProd
    value: 'rg-apim-basicv2-prod-${{ parameters.instanceNumber }}'
  - name: publisherVersion
    value: 'v6.0.2'
  - name: appserviceTemplateFile
    value: '$(System.DefaultWorkingDirectory)/infra/appservice/main.bicep'
  - name: fnappTemplateFile
    value: '$(System.DefaultWorkingDirectory)/infra/fnapp/main.bicep'
  - name: deploymentName
    value: 'infra-deployment'
  - name: apiLocation
    value: 'canadacentral'

stages:
  # ================================================================
  # Stage 1: Record Start Time
  # ================================================================
  - stage: record_start
    displayName: 'Record Start Time'
    pool:
      name: KubernetesPoolOnPremLinux002
    jobs:
      - job: record_time
        displayName: 'Capture wall-clock start'
        steps:
          - script: |
              echo "##vso[task.setvariable variable=startTime;isOutput=true]$(date +%s)"
            name: timer
            displayName: 'Record start timestamp'

  # ================================================================
  # Stage 1b: Set Version and Tag
  # ================================================================
  - stage: set_version
    displayName: 'Set Version and Tag'
    dependsOn: record_start
    pool:
      name: KubernetesPoolOnPremLinux002
    jobs:
      - job: tag_version
        displayName: 'Calculate SemVer and push tag'
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          - task: gitversion/setup@3
            displayName: 'Install GitVersion'
            inputs:
              versionSpec: '5.x'
          - task: gitversion/execute@3
            displayName: 'Calculate SemVer'
          - script: |
              echo "Version: $(GitVersion.SemVer)"
              echo "##vso[build.updatebuildnumber]$(GitVersion.SemVer)"
            displayName: 'Update build number to SemVer'
          - script: |
              git config --global user.email "$(Build.RequestedForEmail)"
              git config --global user.name "$(Build.RequestedFor)"
              git tag -a "$(GitVersion.SemVer)" -m "Version $(GitVersion.SemVer)"
              git push origin "$(GitVersion.SemVer)" 2>/dev/null || echo "Tag already exists"
            displayName: 'Create and push git tag'

  # ================================================================
  # Stage 2: Deploy APIM BasicV2 (Dev + Prod in parallel)
  # ================================================================
  - stage: deploy_apim
    displayName: 'Deploy APIM Infrastructure'
    dependsOn:
      - record_start
      - set_version
    condition: and(succeeded(), eq('${{ parameters.deployApim }}', true))
    pool:
      name: KubernetesPoolOnPremLinux002
    jobs:
      # ----------------------------------------------------------
      # Job 0: Purge soft-deleted resources (runs once before both)
      # ----------------------------------------------------------
      - job: purge_deleted_resources
        displayName: 'Purge Soft-Deleted Resources'
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: 'Purge soft-deleted APIM and Key Vaults'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set +e
                echo "Checking for soft-deleted APIM services..."
                SUB_ID=$(az account show --query id -o tsv)

                # List all soft-deleted APIM services with their serviceId (contains location slug)
                DELETED_JSON=$(az rest --method GET \
                  --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                  -o json 2>/dev/null || echo '{"value":[]}')

                DELETED_COUNT=$(echo "$DELETED_JSON" | jq '.value | length')
                echo "Found $DELETED_COUNT soft-deleted APIM service(s)."

                if [ "$DELETED_COUNT" -gt 0 ]; then
                  echo "$DELETED_JSON" | jq -r '.value[] | "\(.name)|\(.properties.serviceId)"' | while IFS='|' read -r SVC SVC_ID; do
                    SVC_LOCATION=$(echo "$SVC_ID" | grep -oP 'locations/\K[^/]+')
                    [ -z "$SVC_LOCATION" ] && continue
                    echo "Purging: $SVC (location: $SVC_LOCATION)"
                    az rest --method DELETE \
                      --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/locations/$SVC_LOCATION/deletedservices/$SVC?api-version=2022-08-01" \
                      2>/dev/null || true
                  done
                  echo "Waiting for purge (max 2 min)..."
                  for i in $(seq 1 12); do
                    REMAINING=$(az rest --method GET \
                      --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                      --query "length(value[])" -o tsv 2>/dev/null || echo "0")
                    [ "$REMAINING" -eq 0 ] 2>/dev/null && echo "All APIM services purged." && break
                    echo "Still $REMAINING purging... ($i/12)"
                    sleep 10
                  done
                fi
                DELETED_KVS=$(az keyvault list-deleted --query "[].name" -o tsv 2>/dev/null || true)
                for KV in $DELETED_KVS; do
                  echo "Purging soft-deleted Key Vault: $KV (timeout 60s)..."
                  timeout 60 az keyvault purge --name "$KV" 2>/dev/null || echo "  Purge timed out or failed for $KV — skipping"
                done
                echo "Purge complete."

      # ----------------------------------------------------------
      # Job 1: Deploy APIM Dev
      # ----------------------------------------------------------
      - deployment: deploy_apim_dev
        displayName: 'Deploy APIM BasicV2 (Dev)'
        dependsOn: purge_deleted_resources
        environment: 'APIM_Create_Lab_006'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0

                - task: AzureCLI@2
                  displayName: 'Create Dev resource group'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      if az group exists --name $(rgDev) | grep -q true; then
                        echo "Deleting stale resource group $(rgDev)..."
                        az group delete --name $(rgDev) --yes
                      fi
                      az group create --name $(rgDev) --location ${{ parameters.location }}

                - task: AzureCLI@2
                  displayName: 'Purge soft-deleted APIM (Dev)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set +e
                      SUB_ID=$(az account show --query id -o tsv)
                      echo "Checking for soft-deleted APIM services..."
                      DELETED_JSON=$(az rest --method GET \
                        --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                        -o json 2>/dev/null || echo '{"value":[]}')
                      DELETED_COUNT=$(echo "$DELETED_JSON" | jq '.value | length')
                      if [ "$DELETED_COUNT" -gt 0 ]; then
                        echo "Purging $DELETED_COUNT soft-deleted APIM service(s)..."
                        echo "$DELETED_JSON" | jq -r '.value[] | "\(.name)|\(.properties.serviceId)"' | while IFS='|' read -r SVC SVC_ID; do
                          SVC_LOCATION=$(echo "$SVC_ID" | grep -oP 'locations/\K[^/]+')
                          [ -z "$SVC_LOCATION" ] && continue
                          echo "  Purging: $SVC ($SVC_LOCATION)"
                          az rest --method DELETE \
                            --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/locations/$SVC_LOCATION/deletedservices/$SVC?api-version=2022-08-01" \
                            2>/dev/null || true
                        done
                        for i in $(seq 1 12); do
                          REMAINING=$(az rest --method GET \
                            --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                            --query "length(value[])" -o tsv 2>/dev/null || echo "0")
                          [ "$REMAINING" -eq 0 ] 2>/dev/null && echo "Purge complete." && break
                          echo "  Waiting... ($i/12)"
                          sleep 10
                        done
                      else
                        echo "No soft-deleted APIM services found."
                      fi

                - task: AzureCLI@2
                  name: deploy_dev
                  displayName: 'Deploy APIM BasicV2 Dev (with retry)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      MAX_RETRIES=5
                      PARAMETERS_FILE="$(parametersDir)/main.parameters.dev-${{ parameters.instanceNumber }}.json"
                      DEPLOYMENT_NAME="apim-basicv2-dev-$(Build.BuildId)"
                      SUB_ID=$(az account show --query id -o tsv)
                      LOCATION="${{ parameters.location }}"

                      for ATTEMPT in $(seq 1 $MAX_RETRIES); do
                        echo "Deployment attempt $ATTEMPT of $MAX_RETRIES..."
                        RESULT=$(az deployment group create \
                          --resource-group $(rgDev) \
                          --template-file $(templateFile) \
                          --parameters @$PARAMETERS_FILE \
                          --name "$DEPLOYMENT_NAME" \
                          --query "properties.provisioningState" -o tsv 2>&1) && break

                        echo "Attempt $ATTEMPT failed: $RESULT"

                        # Calculate backoff: 60, 90, 120, 150s
                        RETRY_DELAY=$(( 60 + (ATTEMPT - 1) * 30 ))

                        # If soft-delete conflict, extract service name and purge it
                        if echo "$RESULT" | grep -q "ServiceAlreadyExistsInSoftDeletedState"; then
                          SVC_NAME=$(echo "$RESULT" | sed -n 's/.*Api service \([^ ]*\) was soft-deleted.*/\1/p')
                          if [ -n "$SVC_NAME" ]; then
                            echo "Purging soft-deleted APIM service: $SVC_NAME (location: $LOCATION)"
                            az rest --method DELETE \
                              --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/locations/$LOCATION/deletedservices/$SVC_NAME?api-version=2022-08-01" \
                              2>/dev/null || true
                            echo "Waiting for purge to complete..."
                            for i in $(seq 1 18); do
                              STATUS=$(az rest --method GET \
                                --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                                --query "value[?name=='$SVC_NAME'] | length(@)" -o tsv 2>/dev/null || echo "0")
                              [ "$STATUS" = "0" ] && echo "Service $SVC_NAME purged." && break
                              echo "  Still purging $SVC_NAME... ($i/18)"
                              sleep 10
                            done
                            # Extra cooldown — ARM needs time to release the lock after purge
                            echo "Waiting 90s for ARM to release the service lock..."
                            sleep 90
                            RETRY_DELAY=0
                          fi
                        fi

                        # If Key Vault soft-delete conflict, purge it
                        if echo "$RESULT" | grep -q "already exists in deleted state"; then
                          echo "Purging soft-deleted Key Vaults in resource group..."
                          DELETED_KVS=$(az keyvault list-deleted --query "[].name" -o tsv 2>/dev/null || true)
                          for KV in $DELETED_KVS; do
                            echo "  Purging Key Vault: $KV"
                            timeout 90 az keyvault purge --name "$KV" 2>/dev/null || echo "  Purge failed/timed out for $KV"
                          done
                          echo "Waiting 30s for Key Vault purge to propagate..."
                          sleep 30
                          RETRY_DELAY=0
                        fi

                        # If service is locked/transitioning, wait longer for ARM to settle
                        if echo "$RESULT" | grep -q "ServiceLocked"; then
                          echo "Service is transitioning after purge. Waiting 120s for lock release..."
                          sleep 120
                          RETRY_DELAY=0
                        fi

                        if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                          if [ "$RETRY_DELAY" -gt 0 ]; then
                            echo "Waiting ${RETRY_DELAY}s before retry..."
                            sleep $RETRY_DELAY
                          fi
                        else
                          echo "All $MAX_RETRIES attempts failed."
                          exit 1
                        fi
                      done

                      APIM_NAME=$(az deployment group show \
                        --resource-group $(rgDev) \
                        --name "$DEPLOYMENT_NAME" \
                        --query "properties.outputs.apiManagementName.value" -o tsv)
                      echo "APIM Dev Name: $APIM_NAME"
                      echo "##vso[task.setvariable variable=apimNameDev;isOutput=true]$APIM_NAME"

                - task: AzureCLI@2
                  displayName: 'Configure AAD identity provider (Dev)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      if [ -z "$(aadProviderClientId)" ]; then
                        echo "aadProviderClientId not set, skipping identity provider configuration"
                        exit 0
                      fi
                      APIM_NAME="$(deploy_dev.apimNameDev)"
                      RG="$(rgDev)"
                      API_VERSION="2024-06-01-preview"
                      SUB_ID=$(az account show --query id -o tsv)
                      TENANT_ID=$(az account show --query tenantId -o tsv)
                      RESOURCE_URL="https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${RG}/providers/Microsoft.ApiManagement/service/${APIM_NAME}/identityProviders/aad?api-version=${API_VERSION}"
                      az rest --method put --url "$RESOURCE_URL" \
                        --body "{\"properties\":{\"clientId\":\"$(aadProviderClientId)\",\"clientSecret\":\"$(aadProviderClientSecret)\",\"allowedTenants\":[\"${TENANT_ID}\"],\"type\":\"aad\"}}" \
                        --headers 'Content-Type=application/json'
                      echo "AAD identity provider configured for ${APIM_NAME}"

                - task: AzureCLI@2
                  displayName: 'Seed demo data (Dev)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: '$(System.DefaultWorkingDirectory)/scripts/seed-apim-demo-data.ps1'
                    arguments: >-
                      -ResourceGroup "$(rgDev)"
                      -ApimName "$(deploy_dev.apimNameDev)"

                - task: AzureCLI@2
                  displayName: 'Enable Developer Portal and CORS (Dev)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      APIM_NAME="$(deploy_dev.apimNameDev)"
                      RG="$(rgDev)"
                      SUB_ID=$(az account show --query id -o tsv)
                      API_VERSION="2024-06-01-preview"
                      PORTAL_URL="https://${APIM_NAME}.developer.azure-api.net"

                      echo "Configuring CORS for Developer Portal on $APIM_NAME..."
                      CORS_POLICY="<policies><inbound><cors allow-credentials=\"true\"><allowed-origins><origin>${PORTAL_URL}</origin></allowed-origins><allowed-methods><method>*</method></allowed-methods><allowed-headers><header>*</header></allowed-headers></cors></inbound><backend><forward-request /></backend><outbound /><on-error /></policies>"
                      az rest --method put \
                        --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM_NAME/policies/policy?api-version=$API_VERSION" \
                        --body "{\"properties\":{\"format\":\"xml\",\"value\":\"$CORS_POLICY\"}}" \
                        --headers 'Content-Type=application/json' -o none 2>/dev/null || echo "CORS policy update failed (non-fatal)"

                      echo "Publishing Developer Portal for $APIM_NAME..."
                      az rest --method put \
                        --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM_NAME/portalRevisions/portal-$(Build.BuildId)?api-version=$API_VERSION" \
                        --body '{"properties":{"description":"Auto-published by create-lab pipeline","isCurrent":true}}' \
                        --headers 'Content-Type=application/json' -o none 2>/dev/null || echo "Portal publish failed (non-fatal)"
                      echo "Developer Portal URL: $PORTAL_URL"

      # ----------------------------------------------------------
      # Job 2: Deploy APIM Prod (runs in parallel with Dev)
      # ----------------------------------------------------------
      - deployment: deploy_apim_prod
        displayName: 'Deploy APIM BasicV2 (Prod)'
        dependsOn: purge_deleted_resources
        environment: 'APIM_Create_Lab_006'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0

                - task: AzureCLI@2
                  displayName: 'Create Prod resource group'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      if az group exists --name $(rgProd) | grep -q true; then
                        echo "Deleting stale resource group $(rgProd)..."
                        az group delete --name $(rgProd) --yes
                      fi
                      az group create --name $(rgProd) --location ${{ parameters.location }}

                - task: AzureCLI@2
                  displayName: 'Purge soft-deleted APIM (Prod)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set +e
                      SUB_ID=$(az account show --query id -o tsv)
                      echo "Checking for soft-deleted APIM services..."
                      DELETED_JSON=$(az rest --method GET \
                        --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                        -o json 2>/dev/null || echo '{"value":[]}')
                      DELETED_COUNT=$(echo "$DELETED_JSON" | jq '.value | length')
                      if [ "$DELETED_COUNT" -gt 0 ]; then
                        echo "Purging $DELETED_COUNT soft-deleted APIM service(s)..."
                        echo "$DELETED_JSON" | jq -r '.value[] | "\(.name)|\(.properties.serviceId)"' | while IFS='|' read -r SVC SVC_ID; do
                          SVC_LOCATION=$(echo "$SVC_ID" | grep -oP 'locations/\K[^/]+')
                          [ -z "$SVC_LOCATION" ] && continue
                          echo "  Purging: $SVC ($SVC_LOCATION)"
                          az rest --method DELETE \
                            --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/locations/$SVC_LOCATION/deletedservices/$SVC?api-version=2022-08-01" \
                            2>/dev/null || true
                        done
                        for i in $(seq 1 12); do
                          REMAINING=$(az rest --method GET \
                            --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                            --query "length(value[])" -o tsv 2>/dev/null || echo "0")
                          [ "$REMAINING" -eq 0 ] 2>/dev/null && echo "Purge complete." && break
                          echo "  Waiting... ($i/12)"
                          sleep 10
                        done
                      else
                        echo "No soft-deleted APIM services found."
                      fi

                - task: AzureCLI@2
                  name: deploy_prod
                  displayName: 'Deploy APIM BasicV2 Prod (with retry)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      MAX_RETRIES=5
                      PARAMETERS_FILE="$(parametersDir)/main.parameters.prod-${{ parameters.instanceNumber }}.json"
                      DEPLOYMENT_NAME="apim-basicv2-prod-$(Build.BuildId)"
                      SUB_ID=$(az account show --query id -o tsv)
                      LOCATION="${{ parameters.location }}"

                      for ATTEMPT in $(seq 1 $MAX_RETRIES); do
                        echo "Deployment attempt $ATTEMPT of $MAX_RETRIES..."
                        RESULT=$(az deployment group create \
                          --resource-group $(rgProd) \
                          --template-file $(templateFile) \
                          --parameters @$PARAMETERS_FILE \
                          --name "$DEPLOYMENT_NAME" \
                          --query "properties.provisioningState" -o tsv 2>&1) && break

                        echo "Attempt $ATTEMPT failed: $RESULT"

                        # Calculate backoff: 60, 90, 120, 150s
                        RETRY_DELAY=$(( 60 + (ATTEMPT - 1) * 30 ))

                        # If soft-delete conflict, extract service name and purge it
                        if echo "$RESULT" | grep -q "ServiceAlreadyExistsInSoftDeletedState"; then
                          SVC_NAME=$(echo "$RESULT" | sed -n 's/.*Api service \([^ ]*\) was soft-deleted.*/\1/p')
                          if [ -n "$SVC_NAME" ]; then
                            echo "Purging soft-deleted APIM service: $SVC_NAME (location: $LOCATION)"
                            az rest --method DELETE \
                              --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/locations/$LOCATION/deletedservices/$SVC_NAME?api-version=2022-08-01" \
                              2>/dev/null || true
                            echo "Waiting for purge to complete..."
                            for i in $(seq 1 18); do
                              STATUS=$(az rest --method GET \
                                --url "/subscriptions/$SUB_ID/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
                                --query "value[?name=='$SVC_NAME'] | length(@)" -o tsv 2>/dev/null || echo "0")
                              [ "$STATUS" = "0" ] && echo "Service $SVC_NAME purged." && break
                              echo "  Still purging $SVC_NAME... ($i/18)"
                              sleep 10
                            done
                            # Extra cooldown — ARM needs time to release the lock after purge
                            echo "Waiting 90s for ARM to release the service lock..."
                            sleep 90
                            RETRY_DELAY=0
                          fi
                        fi

                        # If Key Vault soft-delete conflict, purge it
                        if echo "$RESULT" | grep -q "already exists in deleted state"; then
                          echo "Purging soft-deleted Key Vaults in resource group..."
                          DELETED_KVS=$(az keyvault list-deleted --query "[].name" -o tsv 2>/dev/null || true)
                          for KV in $DELETED_KVS; do
                            echo "  Purging Key Vault: $KV"
                            timeout 90 az keyvault purge --name "$KV" 2>/dev/null || echo "  Purge failed/timed out for $KV"
                          done
                          echo "Waiting 30s for Key Vault purge to propagate..."
                          sleep 30
                          RETRY_DELAY=0
                        fi

                        # If service is locked/transitioning, wait longer for ARM to settle
                        if echo "$RESULT" | grep -q "ServiceLocked"; then
                          echo "Service is transitioning after purge. Waiting 120s for lock release..."
                          sleep 120
                          RETRY_DELAY=0
                        fi

                        if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                          if [ "$RETRY_DELAY" -gt 0 ]; then
                            echo "Waiting ${RETRY_DELAY}s before retry..."
                            sleep $RETRY_DELAY
                          fi
                        else
                          echo "All $MAX_RETRIES attempts failed."
                          exit 1
                        fi
                      done

                      APIM_NAME=$(az deployment group show \
                        --resource-group $(rgProd) \
                        --name "$DEPLOYMENT_NAME" \
                        --query "properties.outputs.apiManagementName.value" -o tsv)
                      echo "APIM Prod Name: $APIM_NAME"
                      echo "##vso[task.setvariable variable=apimNameProd;isOutput=true]$APIM_NAME"

                - task: AzureCLI@2
                  displayName: 'Configure AAD identity provider (Prod)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      if [ -z "$(aadProviderClientId)" ]; then
                        echo "aadProviderClientId not set, skipping identity provider configuration"
                        exit 0
                      fi
                      APIM_NAME="$(deploy_prod.apimNameProd)"
                      RG="$(rgProd)"
                      API_VERSION="2024-06-01-preview"
                      SUB_ID=$(az account show --query id -o tsv)
                      TENANT_ID=$(az account show --query tenantId -o tsv)
                      RESOURCE_URL="https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${RG}/providers/Microsoft.ApiManagement/service/${APIM_NAME}/identityProviders/aad?api-version=${API_VERSION}"
                      az rest --method put --url "$RESOURCE_URL" \
                        --body "{\"properties\":{\"clientId\":\"$(aadProviderClientId)\",\"clientSecret\":\"$(aadProviderClientSecret)\",\"allowedTenants\":[\"${TENANT_ID}\"],\"type\":\"aad\"}}" \
                        --headers 'Content-Type=application/json'
                      echo "AAD identity provider configured for ${APIM_NAME}"

                - task: AzureCLI@2
                  displayName: 'Seed demo data (Prod)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: '$(System.DefaultWorkingDirectory)/scripts/seed-apim-demo-data.ps1'
                    arguments: >-
                      -ResourceGroup "$(rgProd)"
                      -ApimName "$(deploy_prod.apimNameProd)"

                - task: AzureCLI@2
                  displayName: 'Enable Developer Portal and CORS (Prod)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      APIM_NAME="$(deploy_prod.apimNameProd)"
                      RG="$(rgProd)"
                      SUB_ID=$(az account show --query id -o tsv)
                      API_VERSION="2024-06-01-preview"
                      PORTAL_URL="https://${APIM_NAME}.developer.azure-api.net"

                      echo "Configuring CORS for Developer Portal on $APIM_NAME..."
                      CORS_POLICY="<policies><inbound><cors allow-credentials=\"true\"><allowed-origins><origin>${PORTAL_URL}</origin></allowed-origins><allowed-methods><method>*</method></allowed-methods><allowed-headers><header>*</header></allowed-headers></cors></inbound><backend><forward-request /></backend><outbound /><on-error /></policies>"
                      az rest --method put \
                        --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.ApiManagement/service/$APIM_NAME/policies/policy?api-version=$API_VERSION" \
                        --body "{\"properties\":{\"format\":\"xml\",\"value\":\"$CORS_POLICY\"}}" \
