          projectRoot: '$(System.DefaultWorkingDirectory)/src/msal-python-soln/python-flask-webapp'
          flaskTemplateFile: '$(System.DefaultWorkingDirectory)/src/msal-python-soln/python-flask-webapp/main.bicep'
          pythonVersion: '3.13'
          webAppName: 'app-flask-iru5pc6fcyhre'
        pool:
          name: KubernetesPoolOnPremLinux002
        steps:
          - checkout: self
            fetchDepth: 0
          - task: gitversion/setup@3
            displayName: 'Install GitVersion'
            inputs:
              versionSpec: '5.x'
