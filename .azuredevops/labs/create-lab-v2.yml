                set -euo pipefail
                if az group exists --name $(resourceGroupName) | grep -q true; then
                  echo "Deleting stale resource group $(resourceGroupName)..."
                  az group delete --name $(resourceGroupName) --yes
                fi
                # Purge soft-deleted Key Vaults that would conflict
                set +e
                DELETED_KVS=$(az keyvault list-deleted --query "[?properties.vaultId!=null].name" -o tsv 2>/dev/null)
                for KV in $DELETED_KVS; do
                  echo "Purging soft-deleted Key Vault: $KV"
                  az keyvault purge --name "$KV" 2>/dev/null || true
                done
                set -e
                az group create --name $(resourceGroupName) --location $(flaskLocation)
                az deployment group create \
                  --name $(deploymentName) \
                  --resource-group $(resourceGroupName) \
                  --template-file $(flaskTemplateFile) \
                  --parameters pythonVersion=$(pythonVersion) secretValue=$(flaskClientSecret)
                appName=$(az deployment group show \
                  --name $(deploymentName) --resource-group $(resourceGroupName) \
                  --query properties.outputs.webAppName.value -o tsv)
                echo "Flask App Name: $appName"
                echo "##vso[task.setvariable variable=resolvedAppName;isOutput=true]$appName"
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              set -euo pipefail
              python -m venv antenv
              source antenv/bin/activate
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            workingDirectory: $(projectRoot)
            displayName: 'Install requirements'
          - task: ArchiveFiles@2
            displayName: 'Archive Flask app'
            inputs:
              rootFolderOrFile: $(projectRoot)
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/flask-app.zip
              replaceExistingArchive: true
          - task: AzureWebApp@1
            displayName: 'Deploy Flask App'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(deploy_infra.resolvedAppName)
              package: $(Build.ArtifactStagingDirectory)/flask-app.zip
              startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 app:app'
          - task: AzureCLI@2
