# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    - main
  # include only src folder
  paths:
    include:
      - src/soap-service-dotnetcore-example/*
      - src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/*
      - src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/AddressBook.Service.SOAP.csproj
      - src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/Dockerfile

resources:
  - repo: self

variables:
  - name: dockerRegistryServiceConnection
    value: "APIM_containerRegistrySoapApi"
  - name: imageRepository
    value: "soapapi"
  - name: containerRegistry
    value: "crsoapapik5qu64zoneaec.azurecr.io"
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"
  - name: buildContext
    value: "$(Build.SourcesDirectory)/src/soap-service-dotnetcore-example"
  - name: vmImageName
    value: "ubuntu-latest"

stages:
  - stage: set_version
    displayName: Set version stage
    jobs:
      - job: set_version
        displayName: Set version
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          - task: gitversion/setup@3
            enabled: true
            displayName: "Install GitTools"
            inputs:
              versionSpec: "5.x"
          - task: gitversion/execute@3
            enabled: true
            displayName: "Calculate SemVer"
          - script: echo current version is $(GitVersion.SemVer)
            displayName: "Display calculated version"
          - task: CmdLine@2
            enabled: true
            displayName: Init git global config
            inputs:
              script: |
                git config --global user.email $(Build.RequestedForEmail)
                git config --global user.name $(Build.RequestedFor)
          - task: CmdLine@2
            enabled: true
            displayName: Create Git tag for current version
            inputs:
              script: |
                git tag -a $(GitVersion.SemVer) -m "Main version $(GitVersion.SemVer)"
                git push origin $(GitVersion.SemVer)
  - stage: Build
    displayName: Build and push stage
    dependsOn: set_version
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push an image to container registry
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)"
              command: "buildAndPush"
              Dockerfile: "$(dockerfilePath)"
              buildContext: $(buildContext)
              tags: |
                $(tag)
                latest
