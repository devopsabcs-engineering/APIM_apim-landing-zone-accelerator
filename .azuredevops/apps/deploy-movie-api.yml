# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - none

resources:
  - repo: self

variables:
  - name: dockerRegistryServiceConnection
    value: "containerRegistryMovies"
  - name: imageRepository
    value: "movieapi"
  - name: containerRegistry
    value: "crmovieapimhk7hesuo5ziy.azurecr.io"
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/src/MovieReviewsSoln/MovieReviews/Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"
  - name: buildContext
    value: "$(Build.SourcesDirectory)/src/MovieReviewsSoln"
  - name: vmImageName
    value: "ubuntu-latest"

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push an image to container registry
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)"
              command: "buildAndPush"
              Dockerfile: "$(dockerfilePath)"
              buildContext: $(buildContext)
              tags: |
                $(tag)
                latest
