# Deploy All Apps and APIs (ADO v2)
# Ports the GitHub Actions deploy-all.yml workflow to Azure DevOps
# Deploys 9 APIs in parallel, captures screenshots, publishes wiki report, optional teardown

trigger: none

pool:
  name: KubernetesPoolOnPremLinux002

parameters:
  - name: deployInfra
    type: boolean
    default: true
  - name: teardown
    type: boolean
    default: false
  - name: skipDeploy
    type: boolean
    default: false
    displayName: "Skip API deployment (screenshots/teardown only)"
  - name: webAppInstance
    type: string
    default: "005"
  - name: weatherApiInstance
    type: string
    default: "005"
  - name: starWarsApiInstance
    type: string
    default: "003"
  - name: soapApiInstance
    type: string
    default: "007"
  - name: odataApiInstance
    type: string
    default: "002"
  - name: movieApiInstance
    type: string
    default: "006"
  - name: appointmentsApiInstance
    type: string
    default: "003"

variables:
  - group: APIM_rg-apim-vnet-external-dev-006
  - name: azureSubscription
    value: APIM_MicrosoftAzureExternal_multitenant
  - name: location
    value: canadacentral
  - name: deploymentName
    value: infra-deployment
  - name: appserviceTemplateFile
    value: $(System.DefaultWorkingDirectory)/infra/appservice/main.bicep
  - name: fnappTemplateFile
    value: $(System.DefaultWorkingDirectory)/infra/fnapp/main.bicep

stages:
  # ============================================================
  # Stage 0: Set Version and Tag
  # ============================================================
  - stage: set_version
    displayName: "Set Version and Tag"
    pool:
      name: KubernetesPoolOnPremLinux002
    jobs:
      - job: tag_version
        displayName: "Calculate SemVer and push tag"
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          - task: gitversion/setup@3
            displayName: "Install GitVersion"
            inputs:
              versionSpec: "5.x"
          - task: gitversion/execute@3
            displayName: "Calculate SemVer"
          - script: |
              echo "Version: $(GitVersion.SemVer)"
              echo "##vso[build.updatebuildnumber]$(GitVersion.SemVer)"
            displayName: "Update build number to SemVer"
          - script: |
              git config --global user.email "$(Build.RequestedForEmail)"
              git config --global user.name "$(Build.RequestedFor)"
              git tag -a "$(GitVersion.SemVer)" -m "Version $(GitVersion.SemVer)"
              git push origin "$(GitVersion.SemVer)" 2>/dev/null || echo "Tag already exists"
            displayName: "Create and push git tag"

  # ============================================================
  # Stage 1: Deploy — 9 parallel jobs
  # ============================================================
  - stage: deploy
    displayName: "Deploy All Apps"
    dependsOn: set_version
    condition: and(not(canceled()), eq('${{ parameters.skipDeploy }}', false))
    jobs:
      # ----------------------------------------------------------
      # Job 1: Web App (.NET Docker)
      # ----------------------------------------------------------
      - job: deploy_web_app
        displayName: "Deploy Web App"
        variables:
          resourceGroupName: "rg-web-appservice-linux-${{ parameters.webAppInstance }}"
          baseName: "web-app"
          imageName: "webappopenidconnectdotnet"
          dockerfilePath: "$(System.DefaultWorkingDirectory)/src/WebAppSoln/WebApp-OpenIDConnect-DotNet/Dockerfile"
          dockerContext: "$(System.DefaultWorkingDirectory)/src/WebAppSoln"
        steps:
          - checkout: self
            fetchDepth: 0
          - task: gitversion/setup@3
            displayName: 'Install GitVersion'
            inputs:
              versionSpec: '5.x'
          - task: gitversion/execute@3
            displayName: 'Calculate SemVer'
          - task: AzureCLI@2
            displayName: "Deploy Infrastructure"
            condition: eq('${{ parameters.deployInfra }}', true)
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                if az group exists --name $(resourceGroupName) | grep -q true; then
                  echo "Deleting stale resource group $(resourceGroupName)..."
                  az group delete --name $(resourceGroupName) --yes
                fi
                az group create --name $(resourceGroupName) --location $(location)
                az deployment group create \
                  --name $(deploymentName) \
                  --resource-group $(resourceGroupName) \
                  --template-file $(appserviceTemplateFile) \
                  --parameters baseName=$(baseName) \
                  --parameters imageName=$(imageName) \
                  --parameters addAzureAdAppSettings=false
          - task: AzureCLI@2
            displayName: "Build and Push Docker Image"
            name: build_push
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                containerRegistry=$(az deployment group show \
                  --name $(deploymentName) \
                  --resource-group $(resourceGroupName) \
                  --query properties.outputs.containerRegistryName.value -o tsv)
                echo "Container Registry: $containerRegistry"
                SEMVER="${GITVERSION_SEMVER:-0.0.$(Build.BuildId)}"
                FILEVERSION="${GITVERSION_ASSEMBLYSEMFILEVER:-0.0.0.0}"
                ASMVERSION="${GITVERSION_ASSEMBLYSEMVER:-0.0.0}"
                set +e
                for attempt in 1 2 3; do
                  az acr build --registry "$containerRegistry" \
                  --image $(imageName):$(Build.BuildId) \
                  --image $(imageName):latest \
                  --file $(dockerfilePath) \
                  --build-arg GitVersion_SemVer="$SEMVER" \
                  --build-arg GitVersion_AssemblySemFileVer="$FILEVERSION" \
                  --build-arg GitVersion_AssemblySemVer="$ASMVERSION" \
                  $(dockerContext)
                  acr_exit=$?
                  [ $acr_exit -eq 0 ] && break
                  echo "ACR build attempt $attempt failed, retrying in 30s..."
                  sleep 30
                done
                set -e
                [ $acr_exit -ne 0 ] && exit $acr_exit
                appName=$(az deployment group show \
                  --name $(deploymentName) \
                  --resource-group $(resourceGroupName) \
                  --query properties.outputs.appName.value -o tsv)
                echo "##vso[task.setvariable variable=appName;isOutput=true]$appName"
          - task: AzureCLI@2
            displayName: "Restart Web App"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                appName=$(build_push.appName)
                echo "Restarting $appName"
                az webapp restart --name "$appName" --resource-group $(resourceGroupName)

