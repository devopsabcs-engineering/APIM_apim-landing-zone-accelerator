trigger:
  batch: true
  branches:
    include:
      - main
    exclude:
      - features/experimental/*
  paths:
    exclude:
      - README.md
    include:
      - src/fast-api-app-insights/*
      # include pipeline file
      - .azuredevops/apps/deploy-fast-api.yml
      # include infra files
      - src/fast-api-app-insights/main.bicep

variables:
  - name: pythonVersion
    value: "3.13"
  - name: artifactName
    value: "fastapi-app"
  - name: packageFolder
    value: "package"
  - name: packageArchive
    value: "app.zip"
  - name: bicepFile
    value: "/src/fast-api-app-insights/main.bicep"
  - name: resourceGroupName
    value: "rg-fast-api-app-insights-001"
  - name: location
    value: "canadacentral"
  - name: appName
    value: "fast-api-app-insights-001"
  - name: azureServiceConnection
    value: "fe55e4ed-12be-41f8-87eb-5d661b8b8e83"

stages:
  - stage: Build
    displayName: Build and Package
    jobs:
      - job: Package
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: "$(pythonVersion)"
              architecture: "x64"

          - script: |
              set -e
              echo "Installing dependencies..."
              python -m pip install --upgrade pip

              # Create package directory
              mkdir -p $(Build.ArtifactStagingDirectory)/$(packageFolder)

              # Install dependencies with optimizations to reduce size
              echo "Installing dependencies (optimized for size)..."
              pip install \
                --target $(Build.ArtifactStagingDirectory)/$(packageFolder) \
                --no-cache-dir \
                --compile \
                -r requirements.txt

              # Copy application files
              echo "Copying application files..."
              cp main.py telemetry_v2.py $(Build.ArtifactStagingDirectory)/$(packageFolder)/

              # Copy requirements.txt for reference
              cp requirements.txt $(Build.ArtifactStagingDirectory)/$(packageFolder)/

              # Clean up to reduce package size
              echo "Cleaning up unnecessary files to reduce package size..."
              cd $(Build.ArtifactStagingDirectory)/$(packageFolder)
              
              # Remove test files and directories
              find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
              find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
              find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
              find . -type f -name "*.pyc" -delete 2>/dev/null || true
              find . -type f -name "*.pyo" -delete 2>/dev/null || true
              
              # Remove .dist-info directories (keep only necessary metadata)
              find . -type d -name "*.dist-info" -exec sh -c 'rm -rf "$1"/RECORD "$1"/INSTALLER "$1"/direct_url.json 2>/dev/null || true' _ {} \; 2>/dev/null || true
              
              # Remove documentation and examples
              find . -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true
              find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
              find . -type f -name "*.md" ! -name "requirements.txt" -delete 2>/dev/null || true
              find . -type f -name "*.rst" -delete 2>/dev/null || true
              
              # Remove typing stubs if present
              find . -type d -name "*.pyi" -delete 2>/dev/null || true

              echo "Package size after cleanup:"
              du -sh .
              
              echo "Checking for uvicorn:"
              ls -la uvicorn* 2>/dev/null || echo "uvicorn installed as module"
              
              echo "Verifying key dependencies:"
              ls -d fastapi* uvicorn* opentelemetry* 2>/dev/null || echo "Dependencies installed"

              echo "Package created successfully"
            displayName: "Install dependencies and copy sources (optimized)"
            workingDirectory: "$(System.DefaultWorkingDirectory)/src/fast-api-app-insights"

          - task: ArchiveFiles@2
            displayName: "Create deployment archive"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/$(packageFolder)"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(packageArchive)"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: "Publish artifact"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/$(packageArchive)"
              ArtifactName: "$(artifactName)"
              publishLocation: "Container"

  - stage: Deploy
    displayName: Deploy Infrastructure and App
    dependsOn: Build
    jobs:
      - deployment: DeployToAzure
        displayName: "Deploy to Azure Web App"
        environment: "APIM_fastapi-app-insights"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - task: DownloadBuildArtifacts@0
                  displayName: "Download build artifact"
                  inputs:
                    buildType: "current"
                    downloadType: "single"
                    artifactName: "$(artifactName)"
                    downloadPath: "$(Pipeline.Workspace)"

                - task: AzureCLI@2
                  displayName: "Deploy Bicep template"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      set -euo pipefail
                      az group create --name $(resourceGroupName) --location $(location)
                      az deployment group create \
                        --resource-group $(resourceGroupName) \
                        --template-file $(System.DefaultWorkingDirectory)/$(bicepFile) \
                        --parameters appName=$(appName) location=$(location) skuName=B1 skuTier=Basic skuCapacity=1

                - task: AzureCLI@2
                  displayName: "Configure Web App settings for deployment"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      set -euo pipefail

                      echo "Configuring Web App deployment settings..."

                      # Configure app settings for Python deployment
                      az webapp config appsettings set \
                        --resource-group $(resourceGroupName) \
                        --name $(appName) \
                        --settings \
                          SCM_COMMAND_IDLE_TIMEOUT=3600 \
                          SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                          ENABLE_ORYX_BUILD=false \
                          WEBSITES_PORT=8000 \
                        --output none

                      # Set the startup command
                      az webapp config set \
                        --resource-group $(resourceGroupName) \
                        --name $(appName) \
                        --startup-file "python -m uvicorn main:app --host 0.0.0.0 --port 8000" \
                        --output none

                      echo "Web App configuration complete"

                - task: AzureWebApp@1
                  displayName: "Deploy application package via Azure Web App task"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    appType: "webAppLinux"
                    appName: "$(appName)"
                    package: "$(Pipeline.Workspace)/$(artifactName)/$(packageArchive)"
                    deploymentMethod: "zipDeploy"
                  continueOnError: true

                - task: AzureCLI@2
                  displayName: "Check deployment logs and status"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      set +e  # Don't exit on error for log checking
                      
                      echo "Checking deployment status..."
                      
                      # Get deployment status
                      deployment_status=$(az webapp deployment list \
                        --resource-group $(resourceGroupName) \
                        --name $(appName) \
                        --query "[0].{status:status,message:message,active:active}" \
                        -o json 2>/dev/null)
                      
                      echo "Latest deployment status:"
                      echo "$deployment_status"
                      
                      # Get recent logs
                      echo ""
                      echo "Fetching recent deployment logs..."
                      az webapp log tail \
                        --resource-group $(resourceGroupName) \
                        --name $(appName) \
                        --timeout 30 \
                        2>/dev/null || echo "Could not fetch logs"
                      
                      # Check if deployment was successful
                      if echo "$deployment_status" | grep -q '"status": 4' || echo "$deployment_status" | grep -q '"active": true'; then
                        echo "✓ Deployment appears successful"
                        exit 0
                      else
                        echo "⚠ Deployment may have issues - check logs at:"
                        echo "  https://$(appName).scm.azurewebsites.net/api/deployments/latest"
                        echo "  https://$(appName).scm.azurewebsites.net/api/logs/docker"
                        exit 0  # Don't fail the pipeline, continue to restart
                      fi
                  condition: always()

                - task: AzureCLI@2
                  displayName: "Verify deployment and restart app"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      set -euo pipefail

                      echo "Restarting Web App to ensure clean start..."
                      az webapp restart \
                        --resource-group $(resourceGroupName) \
                        --name $(appName) \
                        --output none

                      echo "Waiting for app to restart..."
                      sleep 45

                      # Verify the app is running
                      echo "Verifying application health..."
                      max_attempts=15
                      attempt=1

                      while [ $attempt -le $max_attempts ]; do
                        echo "Health check attempt $attempt/$max_attempts..."
                        
                        if curl -f -s "https://$(appName).azurewebsites.net/healthz" > /dev/null 2>&1; then
                          echo "✓ Application is healthy and responding!"
                          exit 0
                        fi
                        
                        if [ $attempt -eq $max_attempts ]; then
                          echo "⚠ Application health check failed after $max_attempts attempts"
                          echo "Check logs at: https://$(appName).scm.azurewebsites.net/api/logs/docker"
                          exit 1
                        fi
                        
                        attempt=$((attempt+1))
                        sleep 10
                      done

  - stage: Test
    displayName: Test Endpoints and Generate Telemetry
    dependsOn: Deploy
    jobs:
      - job: TestEndpoints
        displayName: "Call Endpoints to Test App Insights"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "Wait for app to be ready"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail
                echo "Waiting for application to start..."
                sleep 30

                app_url="https://$(appName).azurewebsites.net"
                echo "Application URL: $app_url"

                # Wait for health check to pass
                max_attempts=10
                attempt=1
                while [ $attempt -le $max_attempts ]; do
                  echo "Health check attempt $attempt/$max_attempts"
                  if curl -f -s "$app_url/healthz" > /dev/null; then
                    echo "Application is healthy!"
                    break
                  fi
                  if [ $attempt -eq $max_attempts ]; then
                    echo "Application failed to become healthy after $max_attempts attempts"
                    exit 1
                  fi
                  attempt=$((attempt+1))
                  sleep 10
                done

          - task: PowerShell@2
            displayName: "Test all endpoints and generate telemetry"
            inputs:
              targetType: "inline"
              pwsh: true
              script: |
                $ErrorActionPreference = "Continue"
                $appUrl = "https://$(appName).azurewebsites.net"

                Write-Host "========================================" -ForegroundColor Cyan
                Write-Host "Testing FastAPI Application Endpoints" -ForegroundColor Cyan
                Write-Host "Application URL: $appUrl" -ForegroundColor Cyan
                Write-Host "========================================" -ForegroundColor Cyan

                # Test 1: Root endpoint (with external call)
                Write-Host "`n[TEST 1] Calling root endpoint (/)..." -ForegroundColor Yellow
                try {
                  $response = Invoke-RestMethod -Uri "$appUrl/" -Method Get -TimeoutSec 30
                  Write-Host "✓ Root endpoint successful" -ForegroundColor Green
                  Write-Host "  Response: $($response | ConvertTo-Json -Compress)" -ForegroundColor Gray
                } catch {
                  Write-Host "✗ Root endpoint failed: $_" -ForegroundColor Red
                }

                Start-Sleep -Seconds 2

                # Test 2: Health check endpoint
                Write-Host "`n[TEST 2] Calling health check endpoint (/healthz)..." -ForegroundColor Yellow
                try {
                  $response = Invoke-RestMethod -Uri "$appUrl/healthz" -Method Get -TimeoutSec 30
                  Write-Host "✓ Health check successful" -ForegroundColor Green
                  Write-Host "  Response: $($response | ConvertTo-Json -Compress)" -ForegroundColor Gray
                } catch {
                  Write-Host "✗ Health check failed: $_" -ForegroundColor Red
                }

                Start-Sleep -Seconds 2

                # Test 3: Slow endpoint (multiple external calls)
                Write-Host "`n[TEST 3] Calling slow endpoint (/slow)..." -ForegroundColor Yellow
                try {
                  $response = Invoke-RestMethod -Uri "$appUrl/slow" -Method Get -TimeoutSec 60
                  Write-Host "✓ Slow endpoint successful" -ForegroundColor Green
                  Write-Host "  Response: $($response | ConvertTo-Json -Compress)" -ForegroundColor Gray
                } catch {
                  Write-Host "✗ Slow endpoint failed: $_" -ForegroundColor Red
                }

                Start-Sleep -Seconds 2

                # Test 4: Chain endpoint (sequential calls)
                Write-Host "`n[TEST 4] Calling chain endpoint (/chain)..." -ForegroundColor Yellow
                try {
                  $response = Invoke-RestMethod -Uri "$appUrl/chain" -Method Get -TimeoutSec 60
                  Write-Host "✓ Chain endpoint successful" -ForegroundColor Green
                  Write-Host "  Total calls made: $($response.total_calls)" -ForegroundColor Gray
                } catch {
                  Write-Host "✗ Chain endpoint failed: $_" -ForegroundColor Red
                }

                Start-Sleep -Seconds 2

                # Test 5: Error endpoint (should fail - tests exception tracking)
                Write-Host "`n[TEST 5] Calling error endpoint (/error) - Expected to fail..." -ForegroundColor Yellow
                try {
                  $response = Invoke-RestMethod -Uri "$appUrl/error" -Method Get -TimeoutSec 30 -ErrorAction Stop
                  Write-Host "✗ Error endpoint should have failed but didn't!" -ForegroundColor Red
                } catch {
                  Write-Host "✓ Error endpoint failed as expected (for telemetry testing)" -ForegroundColor Green
                  Write-Host "  Error: $($_.Exception.Message)" -ForegroundColor Gray
                }

                Start-Sleep -Seconds 2

                # Test 6: Multiple rapid calls to test request aggregation
                Write-Host "`n[TEST 6] Making multiple rapid calls to root endpoint..." -ForegroundColor Yellow
                $successCount = 0
                for ($i = 1; $i -le 5; $i++) {
                  try {
                    Write-Host "  Call $i/5..." -NoNewline
                    $null = Invoke-RestMethod -Uri "$appUrl/" -Method Get -TimeoutSec 30
                    Write-Host " ✓" -ForegroundColor Green
                    $successCount++
                  } catch {
                    Write-Host " ✗" -ForegroundColor Red
                  }
                  Start-Sleep -Milliseconds 500
                }
                Write-Host "  Completed $successCount/5 calls successfully" -ForegroundColor Gray

                Write-Host "`n========================================" -ForegroundColor Cyan
                Write-Host "Telemetry Testing Complete!" -ForegroundColor Cyan
                Write-Host "========================================" -ForegroundColor Cyan
                Write-Host "`nℹ️  Check Application Insights for:" -ForegroundColor Cyan
                Write-Host "  • Request traces and dependencies" -ForegroundColor White
                Write-Host "  • Live Metrics during test execution" -ForegroundColor White
                Write-Host "  • Custom events and spans" -ForegroundColor White
                Write-Host "  • Exception tracking from /error endpoint" -ForegroundColor White
                Write-Host "  • Performance metrics from /slow and /chain endpoints" -ForegroundColor White
                Write-Host "`n🔗 View in Azure Portal:" -ForegroundColor Cyan
                Write-Host "   https://portal.azure.com/#@/resource/subscriptions/{subscription-id}/resourceGroups/$(resourceGroupName)/providers/microsoft.insights/components/$(appName)-insights" -ForegroundColor Blue

  - stage: LoadTest
    displayName: Run Load Tests with Locust
    dependsOn: Test
    jobs:
      - job: LocustLoadTest
        displayName: "Execute Locust Load Tests"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: "$(pythonVersion)"
              architecture: "x64"

          - script: |
              set -e
              python -m pip install --upgrade pip
              pip install locust
              locust --version
            displayName: "Install Locust"
            workingDirectory: "$(System.DefaultWorkingDirectory)/src/fast-api-app-insights"

          - task: PowerShell@2
            displayName: "Run Light Load Test (5 users, 60s)"
            inputs:
              targetType: "inline"
              pwsh: true
              workingDirectory: "$(System.DefaultWorkingDirectory)/src/fast-api-app-insights"
              script: |
                $ErrorActionPreference = "Stop"
                $host_url = "https://$(appName).azurewebsites.net"

                Write-Host "`n==============================================================" -ForegroundColor Cyan
                Write-Host "Locust Load Test - Light Scenario" -ForegroundColor Cyan
                Write-Host "==============================================================" -ForegroundColor Cyan
                Write-Host "Target: $host_url" -ForegroundColor Yellow
                Write-Host "  - 5 concurrent users" -ForegroundColor Gray
                Write-Host "  - 1 user spawned per second" -ForegroundColor Gray
                Write-Host "  - 60 second duration`n" -ForegroundColor Gray

                # Check app is accessible
                Write-Host "Verifying app is accessible..." -ForegroundColor Yellow
                try {
                  $response = Invoke-RestMethod -Uri "$host_url/healthz" -TimeoutSec 10
                  Write-Host "✓ App is healthy and ready for load testing`n" -ForegroundColor Green
                } catch {
                  Write-Host "✗ App is not accessible. Skipping load test." -ForegroundColor Red
                  exit 1
                }

                # Create reports directory
                if (-not (Test-Path "reports")) {
                  New-Item -ItemType Directory -Path "reports" | Out-Null
                }

                # Run Locust (allow failures - some endpoints like /error are expected to fail)
                Write-Host "Starting Locust load test..." -ForegroundColor Cyan
                $exitCode = 0
                try {
                  locust --host=$host_url `
                         --users 5 `
                         --spawn-rate 1 `
                         --run-time 60s `
                         --headless `
                         --html reports/load-test-azure-light.html `
                         --csv reports/load-test-azure-light `
                         --loglevel INFO
                } catch {
                  $exitCode = $LASTEXITCODE
                  Write-Host "Locust exited with code: $exitCode" -ForegroundColor Yellow
                }
                
                # Check if reports were generated (test ran)
                if (Test-Path "reports/load-test-azure-light.html") {
                  Write-Host "`n✓ Light load test completed - reports generated!" -ForegroundColor Green
                  Write-Host "Note: Some failures are expected (e.g., /error endpoint)" -ForegroundColor Gray
                  # Reset exit code to success since reports were generated
                  $global:LASTEXITCODE = 0
                  exit 0
                } else {
                  Write-Host "`n✗ Light load test failed - no reports generated" -ForegroundColor Red
                  exit 1
                }

          - task: PowerShell@2
            displayName: "Run Medium Load Test (20 users, 120s)"
            inputs:
              targetType: "inline"
              pwsh: true
              workingDirectory: "$(System.DefaultWorkingDirectory)/src/fast-api-app-insights"
              script: |
                $ErrorActionPreference = "Stop"
                $host_url = "https://$(appName).azurewebsites.net"

                Write-Host "`n==============================================================" -ForegroundColor Cyan
                Write-Host "Locust Load Test - Medium Scenario" -ForegroundColor Cyan
                Write-Host "==============================================================" -ForegroundColor Cyan
                Write-Host "Target: $host_url" -ForegroundColor Yellow
                Write-Host "  - 20 concurrent users" -ForegroundColor Gray
                Write-Host "  - 2 users spawned per second" -ForegroundColor Gray
                Write-Host "  - 120 second duration`n" -ForegroundColor Gray

                Write-Host "Starting Locust load test..." -ForegroundColor Cyan
                $exitCode = 0
                try {
                  locust --host=$host_url `
                         --users 20 `
                         --spawn-rate 2 `
                         --run-time 120s `
                         --headless `
                         --html reports/load-test-azure-medium.html `
                         --csv reports/load-test-azure-medium `
                         --loglevel INFO
                } catch {
                  $exitCode = $LASTEXITCODE
                  Write-Host "Locust exited with code: $exitCode" -ForegroundColor Yellow
                }
                
                # Check if reports were generated (test ran)
                if (Test-Path "reports/load-test-azure-medium.html") {
                  Write-Host "`n✓ Medium load test completed - reports generated!" -ForegroundColor Green
                  Write-Host "Note: Some failures are expected (e.g., /error endpoint)" -ForegroundColor Gray
                  # Reset exit code to success since reports were generated
                  $global:LASTEXITCODE = 0
                  exit 0
                } else {
                  Write-Host "`n✗ Medium load test failed - no reports generated" -ForegroundColor Red
                  exit 1
                }

          - task: PowerShell@2
            displayName: "Parse and display test results"
            inputs:
              targetType: "inline"
              pwsh: true
              workingDirectory: "$(System.DefaultWorkingDirectory)/src/fast-api-app-insights"
              script: |
                $ErrorActionPreference = "Continue"
                Write-Host "`n==============================================================" -ForegroundColor Cyan
                Write-Host "Load Test Results Summary" -ForegroundColor Cyan
                Write-Host "==============================================================" -ForegroundColor Cyan

                # Parse Light test results
                if (Test-Path "reports/load-test-azure-light_stats.csv") {
                  Write-Host "`n📊 LIGHT LOAD TEST (5 users, 60s):" -ForegroundColor Yellow
                  $lightStats = Import-Csv "reports/load-test-azure-light_stats.csv" | Where-Object { $_.Type -eq "Aggregated" }
                  if ($lightStats) {
                    Write-Host "  • Total Requests: $($lightStats.'Request Count')" -ForegroundColor White
                    Write-Host "  • Failure Count: $($lightStats.'Failure Count')" -ForegroundColor $(if ($lightStats.'Failure Count' -gt 0) { "Yellow" } else { "White" })
                    Write-Host "  • Avg Response Time: $($lightStats.'Average Response Time') ms" -ForegroundColor White
                    Write-Host "  • Min Response Time: $($lightStats.'Min Response Time') ms" -ForegroundColor White
                    Write-Host "  • Max Response Time: $($lightStats.'Max Response Time') ms" -ForegroundColor White
                    Write-Host "  • Requests/sec: $($lightStats.'Requests/s')" -ForegroundColor White
                  }
                  
                  # Show failures if any
                  if (Test-Path "reports/load-test-azure-light_failures.csv") {
                    $failures = Import-Csv "reports/load-test-azure-light_failures.csv"
                    if ($failures.Count -gt 0) {
                      Write-Host "`n  ⚠️  Failures detected:" -ForegroundColor Yellow
                      $failures | ForEach-Object {
                        Write-Host "    - $($_.Name): $($_.'# Failures') failure(s)" -ForegroundColor Gray
                      }
                    }
                  }
                }

                # Parse Medium test results
                if (Test-Path "reports/load-test-azure-medium_stats.csv") {
                  Write-Host "`n📊 MEDIUM LOAD TEST (20 users, 120s):" -ForegroundColor Yellow
                  $mediumStats = Import-Csv "reports/load-test-azure-medium_stats.csv" | Where-Object { $_.Type -eq "Aggregated" }
                  if ($mediumStats) {
                    Write-Host "  • Total Requests: $($mediumStats.'Request Count')" -ForegroundColor White
                    Write-Host "  • Failure Count: $($mediumStats.'Failure Count')" -ForegroundColor $(if ($mediumStats.'Failure Count' -gt 0) { "Yellow" } else { "White" })
                    Write-Host "  • Avg Response Time: $($mediumStats.'Average Response Time') ms" -ForegroundColor White
                    Write-Host "  • Min Response Time: $($mediumStats.'Min Response Time') ms" -ForegroundColor White
                    Write-Host "  • Max Response Time: $($mediumStats.'Max Response Time') ms" -ForegroundColor White
                    Write-Host "  • Requests/sec: $($mediumStats.'Requests/s')" -ForegroundColor White
                  }
                  
                  # Show failures if any
                  if (Test-Path "reports/load-test-azure-medium_failures.csv") {
                    $failures = Import-Csv "reports/load-test-azure-medium_failures.csv"
                    if ($failures.Count -gt 0) {
                      Write-Host "`n  ⚠️  Failures detected:" -ForegroundColor Yellow
                      $failures | ForEach-Object {
                        Write-Host "    - $($_.Name): $($_.'# Failures') failure(s)" -ForegroundColor Gray
                      }
                    }
                  }
                }

                Write-Host "`n==============================================================" -ForegroundColor Cyan
                Write-Host "Load Testing Complete!" -ForegroundColor Green
                Write-Host "==============================================================" -ForegroundColor Cyan
                
                Write-Host "`n📝 Note about failures:" -ForegroundColor Cyan
                Write-Host "  • The /error endpoint is designed to fail (tests exception tracking)" -ForegroundColor Gray
                Write-Host "  • Some 500 errors under heavy load are expected for /chain endpoint" -ForegroundColor Gray
                Write-Host "  • These failures generate valuable telemetry for Application Insights" -ForegroundColor Gray
                
                Write-Host "`nℹ️  Load test reports generated in reports/ directory" -ForegroundColor Cyan
                Write-Host "`n🔍 Check Application Insights for:" -ForegroundColor Yellow
                Write-Host "  • Server response times under load" -ForegroundColor White
                Write-Host "  • Request volume and throughput" -ForegroundColor White
                Write-Host "  • Dependency call performance" -ForegroundColor White
                Write-Host "  • Error rates and exceptions (including intentional /error calls)" -ForegroundColor White
                Write-Host "  • Application Map showing all dependencies" -ForegroundColor White
                Write-Host "`n🔗 Azure Portal Links:" -ForegroundColor Cyan
                Write-Host "  Application Insights: https://portal.azure.com/#@/resource/subscriptions/{subscription-id}/resourceGroups/$(resourceGroupName)" -ForegroundColor Blue
                Write-Host "  Live Metrics: Check during test execution for real-time data" -ForegroundColor Gray
                Write-Host "  Performance Blade: Review response times and throughput" -ForegroundColor Gray
                Write-Host "  Application Map: Visualize all service dependencies" -ForegroundColor Gray
                Write-Host "  Failures Blade: Review expected and unexpected failures" -ForegroundColor Gray

          - task: PublishBuildArtifacts@1
            displayName: "Publish load test reports"
            inputs:
              PathtoPublish: "$(System.DefaultWorkingDirectory)/src/fast-api-app-insights/reports"
              ArtifactName: "load-test-reports"
              publishLocation: "Container"
            condition: always()
