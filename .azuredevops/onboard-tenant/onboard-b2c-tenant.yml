                      Write-Host "public ip is $apimPublicIp"
                      $apimGatewayUrl = az apim show -g ${{parameters.resourceGroupNameApimPrd}} -n $ApimServiceName --query "gatewayUrl" | jq -r
                      $developerPortalUrl = az apim show -g ${{parameters.resourceGroupNameApimPrd}} -n $ApimServiceName --query "developerPortalUrl" | jq -r
