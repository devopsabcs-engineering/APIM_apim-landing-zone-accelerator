# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - none

pool:
  vmImage: ubuntu-latest

parameters:
  - name: B2CTenantName
    type: string
    default: testekb2c011
  - name: InstanceNumber
    type: string
    default: "011"
  - name: ResourceGroupName
    type: string
    default: rg-b2ctenant-011
  - name: Location #https://learn.microsoft.com/en-us/azure/active-directory-b2c/data-residency
    type: string
    default: "United States"
    values:
      - "United States"
      - "Europe"
      - "Asia Pacific"
      - "Australia"
  - name: CountryCode
    type: string
    default: "CA"
    values:
      - "CA"
      - "US"
      - "MX"
  - name: ResourceGroupLocation
    type: string
    default: "canadacentral"
    values:
      - "canadacentral"
  - name: variableGroupName
    type: string
    default: "APIM_B2C_main_vars_011"
  - name: variableGroupNameDev
    type: string
    default: "APIM_b2c_frontend_dev_vars_011"
  - name: variableGroupNamePrd
    type: string
    default: "APIM_b2c_frontend_prd_vars_011"
  - name: appName
    type: string
    default: ADO_Graph_Client_011
  - name: resourceGroupNameDev
    type: string
    default: rg-poc-apim-b2c-dev-011
  - name: resourceGroupNamePrd
    type: string
    default: rg-poc-apim-b2c-prd-011
  - name: resourceGroupNameApimDev
    type: string
    default: rg-apim-vnet-external-dev-002
  - name: apimServiceNameDev
    type: string
    default: apim-bcpcue6zklgaw
  - name: resourceGroupNameApimPrd
    type: string
    default: rg-apim-vnet-external-prod-002
  - name: apimServiceNamePrd
    type: string
    default: apim-257jlvys5ho6o

variables:
  - name: objectIdForADOServicePrincipal
    value: "065ef829-a039-434a-a0ca-c02afbcd6870" # hardcoded for now
  - name: azureSubscription
    value: "ME-MngEnv019702-emknafo (64c3d212-40ed-4c6d-a825-6adfbdf25dad)"
  - name: resourceGroupNameDev
    value: ${{parameters.resourceGroupNameDev}}
  - name: resourceGroupNamePrd
    value: ${{parameters.resourceGroupNamePrd}}
  - name: location
    value: ${{parameters.ResourceGroupLocation}}
  - name: bicepFilePath
    value: $(System.DefaultWorkingDirectory)/infra/apim-b2c/main-azurefunction.bicep
  - name: userFlowIdDev
    value: "frontendapp_dev_signupandsignin"
  - name: openIdIssuerDev
    value: "https://${{parameters.B2CTenantName}}.b2clogin.com/${{parameters.B2CTenantName}}.onmicrosoft.com/v2.0/.well-known/openid-configuration?p=B2C_1_$(userFlowIdDev)"
  - name: userFlowIdPrd
    value: "frontendapp_prd_signupandsignin"
  - name: openIdIssuerPrd
    value: "https://${{parameters.B2CTenantName}}.b2clogin.com/${{parameters.B2CTenantName}}.onmicrosoft.com/v2.0/.well-known/openid-configuration?p=B2C_1_$(userFlowIdPrd)"

  # Agent VM image name
  - name: vmImageName
    value: "windows-2019"

  # Working Directory
  - name: workingDirectory
    value: "$(System.DefaultWorkingDirectory)/src/ApimAzureAdB2CSoln/Hello"
  - name: ARTIFACT_NAME_FNAPP
    value: FunctionApp
  - name: ARTIFACT_NAME_DEV
    value: StaticWebsiteContentDev
  - name: ARTIFACT_NAME_PROD
    value: StaticWebsiteContentProd
  - name: project
    value: "src/ApimAzureAdB2CSoln/static-website-front-end"

stages:
  - stage: Create_b2c_tenant
    displayName: Create b2c tenant ${{parameters.B2CTenantName}}
    dependsOn: []
    jobs:
      - job: waitForValidation
        displayName: Wait for manual creation of B2C Tenant through PS script on local machine
        pool: server
        timeoutInMinutes: 4320 # job times out in 3 days
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440 # task times out in 1 day
            inputs:
              notifyUsers: |
                admin@MngEnv019702.onmicrosoft.com
                admin@MngEnv019702.onmicrosoft.com
              instructions: 'Please run manual script "./Create-B2CTenant -B2CTenantName ${{parameters.B2CTenantName}} -ResourceGroupName ${{parameters.ResourceGroupName}} -Location "${{parameters.Location}}" -CountryCode "${{parameters.CountryCode}}" -ResourceGroupLocation "${{parameters.ResourceGroupLocation}}" -AdoOrganization "$(System.CollectionUri)" -AdoProjectName "$(System.TeamProject)" -AdoVariableGroupName "${{parameters.variableGroupName}}" -AppName "${{parameters.appName}}" -AdoPAT ***" and resume. Do not forget to give newly created b2c admin user admin privileges (with PIM of course)!'
              onTimeout: "resume"
      - job: testMsGraph
        displayName: Test MSGraph API access
        dependsOn: [waitForValidation]
        pool:
          vmImage: "windows-latest"
        variables:
          - group: ${{parameters.variableGroupName}}
        steps:
          - task: PowerShell@2
            displayName: test var exists
            inputs:
              targetType: "inline"
              script: |
                # Write your PowerShell commands here.

                Write-Host "Hello World"
                Write-Host $(b2cAdoClientCertName) and $(b2cAdoClientId)
              pwsh: true
          - task: DownloadSecureFile@1
            name: ADO_Graph_Client_SecureFileTask
            inputs:
              secureFile: "${{parameters.appName}}"
          - task: PowerShell@2
            displayName: import pfx certificate
            inputs:
              targetType: "inline"
              script: |
                # Write your PowerShell commands here.

                Write-Host "import cert"
                $PasswordAsSecureString = ConvertTo-SecureString -String $(b2cAdoClientCertPassword) -AsPlainText -Force
                #Import-PfxCertificate -FilePath $(ADO_Graph_Client_SecureFileTask.secureFilePath) -CertStoreLocation Cert:\CurrentUser\My\ -Password $PasswordAsSecureString
                Import-PfxCertificate -FilePath $(ADO_Graph_Client_SecureFileTask.secureFilePath) -CertStoreLocation Cert:\LocalMachine\My\ -Password $PasswordAsSecureString
              pwsh: false
          - task: PowerShell@2
            displayName: use ms graph via cert
            inputs:
              targetType: "inline"
              script: |
                # Write your PowerShell commands here.

                Write-Host "get all certs"
                Get-ChildItem Cert:\LocalMachine\My\

                # Authenticate
                #Connect-MgGraph -ClientID $(b2cAdoClientId) -TenantId "${{parameters.B2CTenantName}}.onmicrosoft.com" -CertificateName $(b2cAdoClientCertName)
                $certInstore = Get-ChildItem "Cert:\LocalMachine\My\$(b2cAdoClientCertThumbprint)"
                #$certInstore = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -Match "$(b2cAdoClientCertName)" }
                #$certInstore = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -Match "ADO_Graph_Client" }
                Write-Host certificate $certInstore
                Connect-MgGraph -ClientId $(b2cAdoClientId) -TenantId "${{parameters.B2CTenantName}}.onmicrosoft.com" -Certificate $certInstore

                Write-Host "APPLICATIONS:"
                Write-Host "======================================================"
                Get-MgApplication -Property "id,displayName,appId,requiredResourceAccess" -PageSize 50 | Format-Table DisplayName, Id, AppId, RequiredResourceAccess

                Write-Host "SERVICE PRINCIPALS:"
                Write-Host "======================================================"
                Get-MgServicePrincipal -Property "id,displayName,appId,signInAudience" -PageSize 50 | Format-Table DisplayName, Id, AppId, SignInAudience

                Write-Host look for GraphAggregatorServiceServicePrincipalId aka 'Microsoft Graph'
                (Get-MgServicePrincipal | Where-Object { $_.DisplayName -match "Microsoft Graph" } | Where-Object { $_.AppId -match "00000003-0000-0000-c000-000000000000"}).Id

                Write-Host "USERS:"
                Write-Host "======================================================"
                # List first 50 users
                Get-MgUser -Property "id,displayName" -PageSize 50 | Format-Table DisplayName, Id

                Write-Host "GROUPS:"
                Write-Host "======================================================"
                # List first 50 groups
                Get-MgGroup -Property "id,displayName" -PageSize 50 | Format-Table DisplayName, Id

                # Disconnect
                Disconnect-MgGraph
              pwsh: false
      - deployment: DeployB2cTenant
        dependsOn: [testMsGraph]
        displayName: Deploy b2c tenant ${{parameters.B2CTenantName}}
        environment: APIM_B2C_tenant_${{parameters.B2CTenantName}}
        pool:
          vmImage: "windows-latest"
        variables:
          - group: ${{parameters.variableGroupName}}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: DownloadSecureFile@1
                  name: ADO_Graph_Client_SecureFileTask
                  inputs:
                    secureFile: "${{parameters.appName}}"
                - task: PowerShell@2
                  displayName: import pfx certificate
                  inputs:
                    targetType: "inline"
                    script: |
                      # Write your PowerShell commands here.

                      Write-Host "import cert"
                      $PasswordAsSecureString = ConvertTo-SecureString -String $(b2cAdoClientCertPassword) -AsPlainText -Force
                      #Import-PfxCertificate -FilePath $(ADO_Graph_Client_SecureFileTask.secureFilePath) -CertStoreLocation Cert:\CurrentUser\My\ -Password $PasswordAsSecureString
                      Import-PfxCertificate -FilePath $(ADO_Graph_Client_SecureFileTask.secureFilePath) -CertStoreLocation Cert:\LocalMachine\My\ -Password $PasswordAsSecureString
                    pwsh: false
                - task: PowerShell@2
                  displayName: Onboard tenant (PS)
                  enabled: true
                  env:
                    userPassword: $(userPassword)
                  inputs:
                    targetType: "inline"
                    script: |
                      Write-Host "logging in with user $(userId)"                
                      Write-Host "COMMAND: az login -u `"$(userId)`" -p `"$(userPassword)`" --scope `"https://management.core.windows.net//.default`" --tenant `"${{parameters.B2CTenantName}}.onmicrosoft.com`" --allow-no-subscriptions"
                      az login -u "$(userId)" -p "$(userPassword)" --scope "https://management.core.windows.net//.default" --tenant "${{parameters.B2CTenantName}}.onmicrosoft.com" --allow-no-subscriptions
                      Write-Host "DONE logging in with user $(userId)"
                      Write-Host "CLEANUP:"
                      Write-Host "======================================================"
                      $appNames = @("Frontend application dev", "Frontend application prd", "Backend application dev", "Backend application prd", "Frontend App for APIM Dev Portal dev", "Frontend App for APIM Dev Portal prd")
                      foreach ($AppName in $appNames) { 

                          Write-Host "delete exisiting app registrations by the same name $AppName (if they exist)"
                          $currentAppRegs = az ad app list --display-name $AppName
                          $currentAppRegsObject = $currentAppRegs | ConvertFrom-Json
                          $currentAppRegsObject | ForEach-Object -Process {
                              if ($_.displayName -eq $AppName) {
                                  Write-Host found previous app reg  $_.DisplayName with appId $_.appId
                                  Write-Host so will delete it
                                  az ad app delete --id $_.appId
                              }
                          }
                      }
                      Write-Host Load PS Modules
                      . ./Create-AzureB2C.ps1
                      #$userPasswordAsSecureString = ConvertTo-SecureString -String "$(userPassword)" -AsPlainText -Force
                      $userPasswordAsSecureString = ConvertTo-SecureString "$(userPassword)" -AsPlainText -Force
                      Write-Host "Create tenant Initialize-B2CTenant -B2CTenantName ${{parameters.B2CTenantName}} -ResourceGroupName ${{parameters.ResourceGroupName}} -Location `"${{parameters.Location}}`" -CountryCode ${{parameters.CountryCode}} -ResourceGroupLocation ${{parameters.ResourceGroupLocation}}"
                      Initialize-B2CTenant -B2CTenantName ${{parameters.B2CTenantName}} -ResourceGroupName ${{parameters.ResourceGroupName}} `
                        -Location "${{parameters.Location}}" -CountryCode "${{parameters.CountryCode}}" `
                        -ResourceGroupLocation "${{parameters.ResourceGroupLocation}}" `
                        -b2cAdoClientId $(b2cAdoClientId) `
                        -b2cAdoClientCertThumbprint $(b2cAdoClientCertThumbprint) `
                        -userId "$(userId)" `
                        -userPassword $userPasswordAsSecureString `
                        -AdoOrganization "$(System.CollectionUri)" `
                        -AdoProjectName "$(System.TeamProject)" `
                        -AdoVariableGroupNameDev "${{parameters.variableGroupNameDev}}" `
                        -AdoVariableGroupNamePrd "${{parameters.variableGroupNamePrd}}" `
                        -AdoPAT $(adoPAT)
                    workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
                - task: CopyFiles@2
                  displayName: copy vars json
                  inputs:
                    SourceFolder: "$(System.DefaultWorkingDirectory)/b2c/Output/variables"
                    Contents: "**/*.json"
                    TargetFolder: "$(build.artifactstagingdirectory)"
                - task: PublishPipelineArtifact@1
                  displayName: publish vars
                  inputs:
                    targetPath: "$(build.artifactstagingdirectory)"
                    artifact: "variables"
                    publishLocation: "pipeline"
  - stage: PostTenantStage
    dependsOn: [Create_b2c_tenant]
    displayName: After tenant ${{parameters.B2CTenantName}} is created
    jobs:
      - job: loadVarsFromJson
        displayName: Create Variable Groups From Json
        dependsOn: []
        pool:
          vmImage: "ubuntu-latest"
        variables:
          - group: ${{parameters.variableGroupName}}
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: "current"
              targetPath: "$(Pipeline.Workspace)"
          - bash: |
              az pipelines build list
              #git pr list
            displayName: "Show build list"
            enabled: false
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
          - bash: |
              az pipelines variable-group list -o table
            displayName: "Show variable groups with variable count"
            env:
              AZURE_DEVOPS_EXT_PAT: $(adoPAT)
          - task: PowerShell@2
            enabled: false
            displayName: test variable files exist
            inputs:
              targetType: "inline"
              script: |
                # Write your PowerShell commands here.

                Write-Host "Hello World"
                ls $(Pipeline.Workspace)
                ls "$(Pipeline.Workspace)/variables"
              pwsh: true
          - task: PowerShell@2
            displayName: create variable groups DEV
            env:
              AZURE_DEVOPS_EXT_PAT: $(adoPAT)
            inputs:
              filePath: "$(System.DefaultWorkingDirectory)/b2c/Update-ADOFromJson.ps1"
              arguments: '-PatToken $(adoPAT) -OrganizationUrl "$(System.CollectionUri)" -Project "$(System.TeamProject)" -VariableGroupName "${{parameters.variableGroupNameDev}}" -VariableFileLocalPath "$(Pipeline.Workspace)/variables/${{parameters.variableGroupNameDev}}.json"'
              pwsh: true
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
          - task: PowerShell@2
            displayName: create variable groups PRD
            env:
              AZURE_DEVOPS_EXT_PAT: $(adoPAT)
            inputs:
              filePath: "$(System.DefaultWorkingDirectory)/b2c/Update-ADOFromJson.ps1"
              arguments: '-PatToken $(adoPAT) -OrganizationUrl "$(System.CollectionUri)" -Project "$(System.TeamProject)" -VariableGroupName "${{parameters.variableGroupNamePrd}}" -VariableFileLocalPath "$(Pipeline.Workspace)/variables/${{parameters.variableGroupNamePrd}}.json"'
              pwsh: true
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
  - stage: Deploy_Dev_Infra
    displayName: Deploy infra Dev into rg ${{parameters.resourceGroupNameDev}}
    dependsOn: [PostTenantStage]
    condition: succeeded()
    jobs:
      - deployment: Deploy_infra_dev
        displayName: Deploy infra dev
        variables:
          - group: ${{parameters.variableGroupName}}
          - group: ${{parameters.variableGroupNameDev}}
        environment: "APIM_B2C_backend_infra_development_$(resourceGroupNameDev)"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      az group create --name $(resourceGroupNameDev) --location $(location)
                      $publicApimVirtualIpDev = az apim show -g ${{parameters.resourceGroupNameApimDev}} -n ${{parameters.apimServiceNameDev}} --query "publicIpAddresses[0]" | jq -r
                      Write-Host "apim public ip $publicApimVirtualIpDev"
                      $deploymentName = "$(resourceGroupNameDev)"
                      az deployment group create --name $deploymentName --resource-group $(resourceGroupNameDev) `
                        --template-file $(bicepFilePath) --parameters appInsightsLocation=$(location) `
                        publicApimVirtualIp=$publicApimVirtualIpDev `
                        backendClientSecret=$(backendClientSecret) `
                        backendClientId=$(backendClientId) `
                        openIdIssuer=$(openIdIssuerDev)
                      Write-Host "Listing deployments dev"
                      az deployment group list -o table -g $(resourceGroupNameDev)
                - task: AzureCLI@2
                  displayName: UPDATE variable groups DEV
                  env:
                    AZURE_DEVOPS_EXT_PAT: $(adoPAT)
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      az pipelines variable-group list -o table
                      $(System.DefaultWorkingDirectory)/infra/scripts/post-deploy.ps1 -PatToken $(adoPAT) `
                        -OrganizationUrl "$(System.CollectionUri)" -Project "$(System.TeamProject)" `
                        -VariableGroupName "${{parameters.variableGroupNameDev}}" -ResourceGroupAzureFunction "${{parameters.resourceGroupNameDev}}" `
                        -ResourceGroupApim "${{parameters.resourceGroupNameApimDev}}" `
                        -FunctionAppNameInApim "func-b2c-${{parameters.InstanceNumber}}"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/scripts"
  - stage: Deploy_Prod_Infra
    displayName: Deploy infra Prod into rg ${{parameters.resourceGroupNamePrd}}
    dependsOn: [PostTenantStage]
    condition: succeeded()
    jobs:
      - deployment: Deploy_infra_prod
        displayName: Deploy Infra Prod
        variables:
          - group: ${{parameters.variableGroupName}}
          - group: ${{parameters.variableGroupNamePrd}}
        environment: "APIM_B2C_backend_infra_production_$(resourceGroupNamePrd)"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      az group create --name $(resourceGroupNamePrd) --location $(location)
                      $publicApimVirtualIpPrd = az apim show -g ${{parameters.resourceGroupNameApimPrd}} -n ${{parameters.apimServiceNamePrd}} --query "publicIpAddresses[0]" | jq -r
                      Write-Host "apim public ip $publicApimVirtualIpPrd"
                      $deploymentName = "$(resourceGroupNamePrd)"
                      az deployment group create --name $deploymentName --resource-group $(resourceGroupNamePrd) `
                        --template-file $(bicepFilePath) --parameters appInsightsLocation=$(location) `
                        publicApimVirtualIp=$publicApimVirtualIpPrd `
                        backendClientSecret=$(backendClientSecret) `
                        backendClientId=$(backendClientId) `
                        openIdIssuer=$(openIdIssuerPrd)
                      Write-Host "Listing deployments prd"
                      az deployment group list -o table -g $(resourceGroupNamePrd)
                - task: AzureCLI@2
                  displayName: UPDATE variable groups PRD
                  env:
                    AZURE_DEVOPS_EXT_PAT: $(adoPAT)
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      az pipelines variable-group list -o table
                      $(System.DefaultWorkingDirectory)/infra/scripts/post-deploy.ps1 -PatToken $(adoPAT) `
                        -OrganizationUrl "$(System.CollectionUri)" -Project "$(System.TeamProject)" `
                        -VariableGroupName "${{parameters.variableGroupNamePrd}}" -ResourceGroupAzureFunction "${{parameters.resourceGroupNamePrd}}" `
                        -ResourceGroupApim "${{parameters.resourceGroupNameApimPrd}}" `
                        -FunctionAppNameInApim "func-b2c-${{parameters.InstanceNumber}}"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/scripts"
  - stage: BuildApp
    displayName: Build app stage
    dependsOn: [Deploy_Dev_Infra, Deploy_Prod_Infra]
    jobs:
      - job: Build
        displayName: Build backend app
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: "build"
              projects: |
                $(workingDirectory)/*.csproj
              arguments: --output $(System.DefaultWorkingDirectory)/publish_output --configuration Release
          - task: ArchiveFiles@2
            displayName: "Archive files"
            inputs:
              rootFolderOrFile: "$(System.DefaultWorkingDirectory)/publish_output"
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
            artifact: $(ARTIFACT_NAME_FNAPP)
  - stage: Deploy_Dev
    displayName: Deploy app Dev
    dependsOn: BuildApp
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy be dev
        environment: "APIM_B2C_backend_app_development_$(resourceGroupNameDev)"
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  name: printvardevfnapp
                  displayName: Get Function Name DEV
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      Write-Host "looking for function app"
                      $FunctionAppName = az functionapp list -g $(resourceGroupNameDev) --query "[0].name" | jq -r
                      Write-Host "found fnapp $FunctionAppName"
                      echo "##vso[task.setvariable variable=FunctionAppNameDev;isOutput=true]$FunctionAppName"
                - script: echo $(printvardevfnapp.FunctionAppNameDev)
                  name: echovardevfnapp
                - task: AzureFunctionApp@1
                  enabled: true # not ready to deploy yet!
                  displayName: "Azure functions app deploy"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: functionApp
                    appName: $(printvardevfnapp.FunctionAppNameDev)
                    package: "$(Pipeline.Workspace)/$(ARTIFACT_NAME_FNAPP)/$(Build.BuildId).zip"
  - stage: Deploy_Prod
    displayName: Deploy app Prod
    dependsOn: BuildApp
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy be prd
        environment: "APIM_B2C_backend_app_production_$(resourceGroupNamePrd)"
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Get Function Name PRD
                  name: printvarprdfnapp
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      Write-Host "looking for function app"
                      $FunctionAppName = az functionapp list -g $(resourceGroupNamePrd) --query "[0].name" | jq -r
                      Write-Host "found fnapp $FunctionAppName"
                      echo "##vso[task.setvariable variable=FunctionAppNamePrd;isOutput=true]$FunctionAppName"
                - script: echo $(printvarprdfnapp.FunctionAppNamePrd)
                  name: echovarprdfnapp
                - task: AzureFunctionApp@1
                  enabled: true # not ready to deploy yet!
                  displayName: "Azure functions app deploy"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: functionApp
                    appName: $(printvarprdfnapp.FunctionAppNamePrd)
                    package: "$(Pipeline.Workspace)/$(ARTIFACT_NAME_FNAPP)/$(Build.BuildId).zip"
  - stage: Build_Dev_web
    dependsOn: [Deploy_Dev, Deploy_Prod]
    displayName: Build static web Dev
    jobs:
      - job: Transform
        displayName: Transform Input Dev
        variables:
          - group: ${{parameters.variableGroupNameDev}}
        steps:
          - task: replacetokens@5
            inputs:
              rootDirectory: "$(project)"
              targetFiles: "**/*.html"
              encoding: "auto"
              tokenPattern: "default"
              writeBOM: true
              actionOnMissing: "warn"
              keepToken: false
              actionOnNoFiles: "continue"
              enableTransforms: false
              enableRecursion: false
              useLegacyPattern: false
              enableTelemetry: true
          - task: CopyFiles@2
            displayName: Copy
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/$(project)"
              Contents: "**"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/output"
          - task: PublishPipelineArtifact@1
            displayName: Share
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/output"
              artifact: "$(ARTIFACT_NAME_DEV)"
              publishLocation: "pipeline"
  - stage: Release_Dev_web
    displayName: Release static web Dev
    dependsOn: Build_Dev_web
    pool:
      vmImage: $(vmImageName)
    variables:
      - group: ${{parameters.variableGroupName}}
      - group: ${{parameters.variableGroupNameDev}}
    jobs:
      - deployment: DeployToStorage
        displayName: Deploy to Azure Storage Dev
        environment: APIM_B2C_frontend_web_development_$(resourceGroupNameDev)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Get Web Storage account Name DEV
                  name: printvardevstor
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      Write-Host "looking for web storage account"
                      $storages = az storage account list -g $(resourceGroupNameDev) --query "[].name" | ConvertFrom-Json
                      $StorageAccountName = $storages | Where-Object { $_.Contains("stweb") }
                      Write-Host "found web storage account $StorageAccountName"
                      echo "##vso[task.setvariable variable=StorageAccountNameDev;isOutput=true]$StorageAccountName"
                - script: echo $(printvardevstor.StorageAccountNameDev)
                  name: echovardevstor
                - task: AzureCLI@2
                  displayName: Give Storage Blob Data Owner access DEV
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    scriptType: "pscore"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      $storages = az storage account list -g $(resourceGroupNameDev) --query "[].name" | ConvertFrom-Json
                      $StorageAccountName = $storages | Where-Object { $_.Contains("stweb") }
                      Write-Host "found web storage account $StorageAccountName"
                      $scope = az storage account show -g $(resourceGroupNameDev) -n $StorageAccountName --query "id" | ConvertFrom-Json
                      try {
                        Write-Host "Assigning Storage Blob Data Owner role to the service principal..."  
