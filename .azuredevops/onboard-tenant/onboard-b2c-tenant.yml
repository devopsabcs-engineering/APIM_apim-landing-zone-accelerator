  - stage: Build_Prod_web
    dependsOn: [Deploy_Dev, Deploy_Prod]
    displayName: Build static web Prod
    jobs:
      - job: Transform
        displayName: Transform Input Prd
        variables:
          - group: ${{parameters.variableGroupNamePrd}}
        steps:
          - task: replacetokens@5
            inputs:
              rootDirectory: "$(project)"
              targetFiles: "**/*.html"
              encoding: "auto"
              tokenPattern: "default"
              writeBOM: true
              actionOnMissing: "warn"
              keepToken: false
              actionOnNoFiles: "continue"
              enableTransforms: false
              enableRecursion: false
              useLegacyPattern: false
              enableTelemetry: true
          - task: CopyFiles@2
            displayName: Copy
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/$(project)"
              Contents: "**"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/output"
          - task: PublishPipelineArtifact@1
            displayName: Share
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/output"
              artifact: "$(ARTIFACT_NAME_PROD)"
              publishLocation: "pipeline"
