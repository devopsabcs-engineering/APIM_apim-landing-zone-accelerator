  - stage: UpdateStageDev
    displayName: update uris and stuff DEV
    dependsOn: [Release_Dev_web, Release_Prod_web]
    variables:
      - group: ${{parameters.variableGroupName}}
      - group: ${{parameters.variableGroupNameDev}}
    jobs:
      - job: update_job
        displayName: update job dev
        steps:
          - script: |
              echo Add other tasks to build, test, and deploy your project.
              echo $(b2cAdoClientCertName)
            displayName: "Run a multi-line script"
          - task: DownloadSecureFile@1
            name: graphSpCertificate
            displayName: "Download certificate for Microsoft Graph service principal"
            inputs:
              secureFile: "${{parameters.appName}}" #'$(b2cAdoClientCertName)'
          - task: PowerShell@2
            displayName: "Install Graph PowerShell module"
            inputs:
              targetType: "inline"
              script: |
                # Graph module shouldn't be preinstalled on the agent, but checking anyway.
                if (Get-Module -ListAvailable -Name Microsoft.Graph) {
                  Write-Host "*** Module Microsoft.Graph exists."
                }
                else {
                  Write-Host "*** Installing Microsoft.Graph module..."
                  Install-Module Microsoft.Graph -Force
                }
                $CertPath = "$(graphSpCertificate.secureFilePath)"
                Write-Host "*** Certificate path: " $CertPath
                $Certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($CertPath, "$(b2cAdoClientCertPassword)")

                $tenantId = "${{parameters.B2CTenantName}}.onmicrosoft.com"

                # Connecting using app-only authentication with in-memory certificate.
                Connect-MgGraph -ClientID "$(b2cAdoClientId)" -TenantId "$tenantId" -Certificate $Certificate

                $app = Get-MgApplication | Where-Object { $_.AppId -eq "$(MSAL_AUTH_CLIENTID)" }

                $newUri = "$(MSAL_AUTH_REDIRECT_URI)"

                Write-Host "front end app $app - checking for uri $newUri"

                if ($app.Spa.RedirectUris.Contains("$newUri")) {
                  Write-Host "*** Redirect URI $newUri already present, skipping."
                }
                else {
                  # Add FQDN to the registration
                  $app.Spa.RedirectUris += "$newUri"

                  # Update app registration
                  Update-MgApplication -ApplicationId $app.Id -Spa $app.Spa
                }
          - task: AzureCLI@2
            displayName: add redirect uri for oauth server DEV
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              inlineScript: |
                Write-Host "looking for apim"
                $ApimServiceName = az apim list -g ${{parameters.resourceGroupNameApimDev}} --query "[0].name" | jq -r
                Write-Host "found apim $ApimServiceName"
                $developerPortalUrl = az apim show -g ${{parameters.resourceGroupNameApimDev}} -n $ApimServiceName --query "developerPortalUrl" | jq -r
                Write-Host "apim dev portal url is $developerPortalUrl"

                #front end APIM DEV
                # Graph module shouldn't be preinstalled on the agent, but checking anyway.
                if (Get-Module -ListAvailable -Name Microsoft.Graph) {
                  Write-Host "*** Module Microsoft.Graph exists."
                }
                else {
                  Write-Host "*** Installing Microsoft.Graph module..."
                  Install-Module Microsoft.Graph -Force
                }
                $CertPath = "$(graphSpCertificate.secureFilePath)"
                Write-Host "*** Certificate path: " $CertPath
                $Certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($CertPath, "$(b2cAdoClientCertPassword)")

                $tenantId = "${{parameters.B2CTenantName}}.onmicrosoft.com"

                # Connecting using app-only authentication with in-memory certificate.
                Connect-MgGraph -ClientID "$(b2cAdoClientId)" -TenantId "$tenantId" -Certificate $Certificate

                $appApim = Get-MgApplication | Where-Object { $_.AppId -eq "$(apimFrontendClientId)" }

                $newUriApim = "$developerPortalUrl/signin-oauth/code/callback/b2c${{parameters.InstanceNumber}}oauthserver"

                Write-Host "front end APIM app $appApim - checking for uri $newUriApim"

                if ($appApim.Web.RedirectUris.Contains("$newUriApim")) {
                  Write-Host "*** Redirect URI $newUriApim already present, skipping."
                }
                else {
                  # Add FQDN to the registration
                  $appApim.Web.RedirectUris += "$newUriApim"

                  # Update app registration
                  Update-MgApplication -ApplicationId $appApim.Id -Web $appApim.Web
                }
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
          - task: AzureCLI@2
            displayName: Update Name Value Pair for backend in APIM DEV
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              inlineScript: |
                Write-Host "looking for apim"
                $ApimServiceName = az apim list -g ${{parameters.resourceGroupNameApimDev}} --query "[0].name" | jq -r
                Write-Host "found apim $ApimServiceName"
                Write-Host  "looking for apim public ip"
                $apimPublicIp = az apim show -g ${{parameters.resourceGroupNameApimDev}} -n $ApimServiceName --query "publicIpAddresses[0]" | jq -r
                Write-Host "public ip is $apimPublicIp"
                $apimGatewayUrl = az apim show -g ${{parameters.resourceGroupNameApimDev}} -n $ApimServiceName --query "gatewayUrl" | jq -r
                $developerPortalUrl = az apim show -g ${{parameters.resourceGroupNameApimDev}} -n $ApimServiceName --query "developerPortalUrl" | jq -r
                Write-Host "apim gateway url is $apimGatewayUrl"
                Write-Host "apim dev portal url is $developerPortalUrl"
                az apim nv list --resource-group ${{parameters.resourceGroupNameApimDev}} --service-name $ApimServiceName -o table
                Write-Host "updating to backend id ${{parameters.InstanceNumber}} $(backendClientId) - if prod will need to fix configuration.prod.yaml in API Ops"
                try {
                  az apim nv create --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimDev}} --named-value-id "b2cbackend-api-application-client-id-${{parameters.InstanceNumber}}" --display-name "b2cbackend-api-application-client-id-${{parameters.InstanceNumber}}" --value $(backendClientId)
                }
                catch {
                  Wait-Host "already exists so updating it"                
                  az apim nv update --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimDev}} --named-value-id "b2cbackend-api-application-client-id-${{parameters.InstanceNumber}}" --value $(backendClientId)
                }
                Write-Host "updating to web ${{parameters.InstanceNumber}} $(MSAL_AUTH_REDIRECT_URI) - if prod will need to fix configuration.prod.yaml in API Ops"
                try {
                  az apim nv create --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimDev}} --named-value-id "b2cPrimaryStorageEndpoint-${{parameters.InstanceNumber}}" --display-name "b2cPrimaryStorageEndpoint-${{parameters.InstanceNumber}}" --value $(MSAL_AUTH_REDIRECT_URI)
                }
                catch {
                  Wait-Host "already exists so updating it"                
                  az apim nv update --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimDev}} --named-value-id "b2cPrimaryStorageEndpoint-${{parameters.InstanceNumber}}" --value $(MSAL_AUTH_REDIRECT_URI)
                }
                $wellKnown = "$(openIdIssuerDev)"
                Write-Host "updating to well-known ${{parameters.InstanceNumber}} $wellKnown - if prod will need to fix configuration.prod.yaml in API Ops"
                try {
                  az apim nv create --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimDev}} --named-value-id "b2cpolicy-well-known-openid-${{parameters.InstanceNumber}}" --display-name "b2cpolicy-well-known-openid-${{parameters.InstanceNumber}}" --value $wellKnown
                }
                catch {
                  Wait-Host "already exists so updating it"
                  az apim nv update --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimDev}} --named-value-id "b2cpolicy-well-known-openid-${{parameters.InstanceNumber}}" --value $wellKnown
                }
                az apim nv list --resource-group ${{parameters.resourceGroupNameApimDev}} --service-name $ApimServiceName -o table
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
          - task: AzureCLI@2
            displayName: deploy oauth server for dev portal DEV
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              inlineScript: |
                Write-Host "looking for apim"
                $ApimServiceName = az apim list -g ${{parameters.resourceGroupNameApimDev}} --query "[0].name" | jq -r
                Write-Host "found apim $ApimServiceName"
                echo adding oauth server
                az deployment group create --resource-group ${{parameters.resourceGroupNameApimDev}} --name oauthserverdev${{parameters.B2CTenantName}} `
                  --template-fil ../infra/api-management-create-with-external-vnet-publicip-stv2/oauth-server/main.bicep `
                  --parameters apimServiceName=$ApimServiceName oauthServerForDevPortalName=b2c${{parameters.InstanceNumber}}oauthserver `
                  authorizationEndpoint="https://${{parameters.B2CTenantName}}.b2clogin.com/${{parameters.B2CTenantName}}.onmicrosoft.com/oauth2/v2.0/authorize?p=b2c_1_$(userFlowIdDev)" `
                  tokenEndpoint="https://${{parameters.B2CTenantName}}.b2clogin.com/${{parameters.B2CTenantName}}.onmicrosoft.com/oauth2/v2.0/token?p=b2c_1_$(userFlowIdDev)" `
                  defaultScope="https://${{parameters.B2CTenantName}}.onmicrosoft.com/$(backendClientId)/Hello" `
                  environmentName=dev `
                  frontendClientId=$(apimFrontendClientId) frontendClientSecret="$(apimFrontendClientSecret)"
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
