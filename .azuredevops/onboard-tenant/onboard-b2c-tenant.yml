                  az apim nv create --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimPrd}} --named-value-id "b2cpolicy-well-known-openid-${{parameters.InstanceNumber}}" --display-name "b2cpolicy-well-known-openid-${{parameters.InstanceNumber}}" --value $wellKnown
                }
                catch {
                  Wait-Host "already exists so updating it"
                  az apim nv update --service-name $ApimServiceName -g ${{parameters.resourceGroupNameApimPrd}} --named-value-id "b2cpolicy-well-known-openid-${{parameters.InstanceNumber}}" --value $wellKnown
                }
                az apim nv list --resource-group ${{parameters.resourceGroupNameApimPrd}} --service-name $ApimServiceName -o table
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
          - task: AzureCLI@2
            displayName: deploy oauth server for dev portal PRD
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              inlineScript: |
                Write-Host "looking for apim"
                $ApimServiceName = az apim list -g ${{parameters.resourceGroupNameApimPrd}} --query "[0].name" | jq -r
                Write-Host "found apim $ApimServiceName"
                echo adding oauth server
                az deployment group create --resource-group ${{parameters.resourceGroupNameApimPrd}} --name oauthserverprd${{parameters.B2CTenantName}} `
                  --template-fil ../infra/api-management-create-with-external-vnet-publicip-stv2/oauth-server/main.bicep `
                  --parameters apimServiceName=$ApimServiceName oauthServerForDevPortalName=b2c${{parameters.InstanceNumber}}oauthserver `
                  authorizationEndpoint="https://${{parameters.B2CTenantName}}.b2clogin.com/${{parameters.B2CTenantName}}.onmicrosoft.com/oauth2/v2.0/authorize?p=b2c_1_$(userFlowIdPrd)" `
                  tokenEndpoint="https://${{parameters.B2CTenantName}}.b2clogin.com/${{parameters.B2CTenantName}}.onmicrosoft.com/oauth2/v2.0/token?p=b2c_1_$(userFlowIdPrd)" `
                  defaultScope="https://${{parameters.B2CTenantName}}.onmicrosoft.com/$(backendClientId)/Hello" `
                  environmentName=prd `
                  frontendClientId=$(apimFrontendClientId) frontendClientSecret="$(apimFrontendClientSecret)"
              workingDirectory: "$(System.DefaultWorkingDirectory)/b2c"
