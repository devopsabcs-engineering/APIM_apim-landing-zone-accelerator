# Base pipeline to deploy APIM ESLZ with default configuration
# Instructions:
# 1) Create a service connection in Azure Devops to Github so the remote repo where the Bicep files
#    of APIM- ESLZ are located can be downloaded
# 2) Enter the correct name of the APIM- ESLZ repo and the name of the just created 
#    service endpoint for the Github on lines 22 and 23
# 3) Substitute all variable values in the connected template apim-eslz-vars.yml 
#    to align with your environment

trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: ReDeployInfraParam
  type: boolean
  default: false
  displayName: Initial or Re-Deployment of the APIM Infra
- name: InstanceNumber
  type: string
  default: '07'
- name: Environment
  type: string
  default: dev
  values:
  - 'dev'
  - 'uat'
  - 'prd'
  - 'dsr'
- name: Location #https://learn.microsoft.com/en-us/azure/reliability/migrate-api-mgt#prerequisites
  type: string
  default: canadacentral
  values:
  - 'canadacentral'
  - 'eastus'  
  - 'eastus2'
  - 'westus2'
  - 'westus3'

variables:
- group: 'APIM_apim-landing-zone-accelerator_${{ parameters.Environment }}_0${{ parameters.InstanceNumber }}'
- name: workloadPrefix
  value: 'ekLZ' # up to 6 chars e.g. ApimLZ
- name: workloadNameVar
  value: '$(workloadPrefix)${{ parameters.InstanceNumber }}'
- name: shortInstance
  value: '${{ parameters.InstanceNumber }}'
- name: longInstance
  value: '0${{ parameters.InstanceNumber }}'
- name: poolNameVar
  value: 'APIM_Internal_Vnet_Agents_${{ parameters.Environment }}_0${{ parameters.InstanceNumber }}'
- template: apim-eslz-vars.yml
- group: APIM_ESLZ_${{ parameters.Environment }}_vars
- name: ReDeployInfra
  value: ${{ parameters.ReDeployInfraParam }}
- name: mainTemplatePath
  value: '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/azure-resource-manager/main.json'
#- name: mainTemplatePath
#  value: '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/main.json'
- name: serviceConnectionName   # Name of the serviceconnection to the target ESLZ Azure subscription
  value: APIM_MicrosoftAzureExternal_multitenant
- name: deploymentLocation
  value: ${{ parameters.Location }}
- name: deploymentName          # Name of deployment to label ARM deployments in the Azure Portal
  value: 'api-management-ESLZ-${{ parameters.Location }}-${{ parameters.Environment }}-$(workloadPrefix)${{ parameters.InstanceNumber }}'

#resources:
#  repositories:
#  - repository: apimeslz
#    type: github
#    name: devopsabcs-engineering/apim-landing-zone-accelerator
#    endpoint: APIM_devopsabcs-engineering_apim-landing-zone-accelerator

stages:
- stage: retrieve_template_from_github_and_publish
  displayName: 'Fetch templates from github and store in pipeline'
  jobs:
  - job: publish_artifact_to_pipeline
    displayName: 'Publish bicep files as artifact to pipeline'
    steps:
    #- checkout: apimeslz
    - checkout: self
    - task: CmdLine@2
      displayName: list source files
      inputs:
        script: |
          echo Write your commands here
          
          echo Hello world
          
          ls $(Pipeline.Workspace)/s    
    - task: DownloadSecureFile@1
      name: appgwPfxDownloadTask_dev
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_appgateway_dev.pfx'
    - task: DownloadSecureFile@1
      name: pfxApiTask_dev
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_api_dev.pfx'
    - task: DownloadSecureFile@1
      name: pfxManagementTask_dev
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_management_dev.pfx'
    - task: DownloadSecureFile@1
      name: pfxPortalTask_dev
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_portal_dev.pfx'
    - task: DownloadSecureFile@1
      name: appgwPfxDownloadTask_prd
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_appgateway_prd.pfx'
    - task: DownloadSecureFile@1
      name: pfxApiTask_prd
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_api_prd.pfx'
    - task: DownloadSecureFile@1
      name: pfxManagementTask_prd
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_management_prd.pfx'
    - task: DownloadSecureFile@1
      name: pfxPortalTask_prd
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_portal_prd.pfx'
    - task: DownloadSecureFile@1
      name: trustedrootcert
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_cacert_custom_domain.pem'
    - bash: |
        mkdir '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs'
        cp '$(appgwPfxDownloadTask_dev.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/appgateway_dev.pfx'
        cp '$(pfxApiTask_dev.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/api_dev.pfx'
        cp '$(pfxPortalTask_dev.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/portal_dev.pfx'
        cp '$(pfxManagementTask_dev.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/management_dev.pfx'
        cp '$(appgwPfxDownloadTask_prd.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/appgateway_prd.pfx'
        cp '$(pfxApiTask_prd.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/api_prd.pfx'
        cp '$(pfxPortalTask_prd.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/portal_prd.pfx'
        cp '$(pfxManagementTask_prd.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs/management_prd.pfx'
        ls '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/shared/certs'
      displayName: copy appgw pfx cert from secure file
    - task: PowerShell@2
      displayName: Build Main Template json from Bicep
      inputs:
        targetType: 'inline'
        script: |
          # Write your PowerShell commands here.
          
          Write-Host "Build template with strong Bicep"
          az bicep build -f '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/main.bicep' --outfile '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/azure-resource-manager/main.json'
          #Copy-Item -Path $(mainTemplateLocation) -Destination '$(Build.ArtifactStagingDirectory)/$(planName)/mainTemplate.json' -Force
          #$(System.DefaultWorkingDirectory)/$(ADO_REPO_ARM_TTK)/arm-ttk/Test-AzTemplate.sh $(Build.ArtifactStagingDirectory)/$(planName)
        failOnStderr: false
        pwsh: true    
    - task: RunARMTTKTestsXPlat@1
      displayName: Run Template Checker
      inputs:
        templatelocation: '$(mainTemplatePath)'
        resultLocation: '$(System.DefaultWorkingDirectory)/results/main'
        skipTests: 'URIs Should Be Properly Constructed,Template Should Not Contain Blanks,Parameter Types Should Be Consistent'
        mainTemplates: 'main.json'
        allTemplatesMain: false
        cliOutputResults: true
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'NUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/results/main/*-armttk.xml'
      condition: always()
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep'
        artifact: $(artifactName)
        publishLocation: 'pipeline'
- stage: deploy_artifacts
  dependsOn: retrieve_template_from_github_and_publish
  displayName: 'Deploy all bicep artifacts'
  jobs:
  - deployment: 
    timeoutInMinutes: 120 #often takes more than 1 hour
    displayName: 'Deploy APIM ESLZ artifacts to Azure subscription'
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)
          - task: AzureCLI@2
            displayName: deploy apim bicep templates
            enabled: ${{ variables.ReDeployInfra }}
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "using serviceconnection :" $(serviceConnectionName)
                echo "initial deployment may take up to one hour while subsequent ones are shorter"
                az deployment sub create --location $(deploymentLocation) --name $(deploymentName) --template-file $(Pipeline.Workspace)/$(artifactName)/main.bicep --parameters workloadName=$(workloadNameVar) longInstance=$(longInstance) poolName=$(poolNameVar) environment=${{ parameters.Environment }} CICDAgentType=$(CICDAgentType) accountName=$(accountName) appGatewayCertType=$(appGatewayCertType) appGatewayFqdn=$(appGatewayFqdn) certificatePassword=$(certificatePassword) personalAccessToken=$(personalAccessToken) vmPassword=$(vmPassword) vmUsername=$(vmUsername) apiFQDN=$(apiFQDN) apiCertificatePassword=$(apiCertificatePassword) apiCertType=$(apiCertType) portalFQDN=$(portalFQDN) portalCertificatePassword=$(portalCertificatePassword) portalCertType=$(portalCertType) managementFQDN=$(managementFQDN) managementCertificatePassword=$(managementCertificatePassword) managementCertType=$(managementCertType) mainDomainName=$(mainDomainName)
- stage: postdeploy
  displayName: 'Post deploy scripts'
  dependsOn: deploy_artifacts
  jobs:
  - job: post_deploy_job
    variables:
    - name: appGatewayVnetName
      value: 'vnet-apim-cs-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}'
    - name: ResourceGroupNameShared
      value: 'rg-shared-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: ResourceGroupNameNetwork
      value: 'rg-networking-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: domainName
      value: MngEnv019702.onmicrosoft.com
    - name: zoneName
      value: MngEnv019702.onmicrosoft.com
    - name: ResourceGroupNameApim 
      value: 'rg-apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: apimServiceName
      value: 'apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    #- name: Location
    #  value: canadacentral
    #- name: apimOrganization
    #  value: "Contoso MngEnv019702"
    #- name: apimAdminEmail
    #  value: "admin@MngEnv019702.onmicrosoft.com" # Administrator's email address
    - name: ARTIFACTS_FEED_NAME
      value: APIM_landing_zone_tools
    steps:
      - task: CmdLine@2
        inputs:
          script: |
            echo Write your commands here
            
            echo Hello world
      - task: DownloadSecureFile@1
        name: pfxApiTask
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_api_${{ parameters.Environment }}.pfx'
      - task: DownloadSecureFile@1
        name: pfxManagementTask
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_management_${{ parameters.Environment }}.pfx'
      - task: DownloadSecureFile@1
        name: pfxPortalTask
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_portal_${{ parameters.Environment }}.pfx'
      - task: DownloadSecureFile@1
        name: trustedrootcert
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_cacert_custom_domain.pem'      
      - task: AzureCLI@2
        enabled: ${{ variables.ReDeployInfra }}
        displayName: post deploy
        inputs:
          azureSubscription: '$(serviceConnectionName)'
          scriptType: 'pscore'
          scriptLocation: 'scriptPath'
          scriptPath: '$(System.DefaultWorkingDirectory)/infra/scripts/main-postdeploy.ps1'
          arguments: '-ResourceGroupNameApim $(ResourceGroupNameApim) -apimServiceName $(apimServiceName) -domainName $(domainName) -pfxPassword $(pfxPassword) -trustedrootcertsecureFIlePath $(trustedrootcert.secureFIlePath) -pfxApiTasksecureFIlePath $(pfxApiTask.secureFIlePath) -pfxPortalTasksecureFIlePath $(pfxPortalTask.secureFIlePath) -pfxManagementTasksecureFIlePath $(pfxManagementTask.secureFIlePath) -azureApplicationId $(azureApplicationId) -azureTenantId $(azureTenantId) -azureClientSecret $(azureClientSecret) -zoneName $(zoneName) -ResourceGroupNameShared $(ResourceGroupNameShared) -ResourceGroupNameNetwork $(ResourceGroupNameNetwork) -appGatewayVnetName $(appGatewayVnetName)'
- stage: internal_vnet_tests
  dependsOn: [postdeploy]
  pool:
   name: 'APIM_Internal_Vnet_Agents_${{ parameters.Environment }}_$(longInstance)'
  jobs:
  - job: do_health_tests
    displayName: perform internal vnet health test
    variables:
    - name: appGatewayVnetName
      value: 'vnet-apim-cs-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}'
    - name: ResourceGroupNameShared
      value: 'rg-shared-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: ResourceGroupNameNetwork
      value: 'rg-networking-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: domainName
      value: MngEnv019702.com
    - name: zoneName
      value: MngEnv019702.com
    - name: ResourceGroupNameApim 
      value: 'rg-apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: apimServiceName
      value: 'apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'    
    - name: ARTIFACTS_FEED_NAME
      value: APIM_landing_zone_tools
    - name: appGatewayName
      value: 'appgw-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: apimServiceName
      value: 'apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: Location
      value: ${{ parameters.Location }}
    - name: apimOrganization
      value: "Contoso MngEnv019702"
    - name: apimAdminEmail
      value: "admin@MngEnv019702.onmicrosoft.com" # Administrator's email address
    - name: appGatewayPublicIpName
      value: 'pip-appgw-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    steps:
    - task: DownloadSecureFile@1
      name: trustedrootcert
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_cacert_custom_domain.pem'
    - task: CmdLine@2
      displayName: show hostname to prove internal    
      inputs:
        script: |
          echo Write your commands here
          
          echo hostname
          
          hostname
          echo import a home grown cert to root
          type $(trustedrootcert.secureFIlePath)          
          certutil -addstore "Root" "$(trustedrootcert.secureFIlePath)"
    - task: AzureCLI@2
      enabled: true
      displayName: Perform the Backend Health Tests
      inputs:
        azureSubscription: '$(serviceConnectionName)'
        scriptType: 'pscore'
        scriptLocation: 'scriptPath'
        scriptPath: '$(System.DefaultWorkingDirectory)/infra/scripts/health-test-internal.ps1'
        arguments: '-Location $(Location) -ResourceGroupNameApim $(ResourceGroupNameApim) -zoneName $(zoneName) -appGatewayName $(appGatewayName) -apimServiceName $(apimServiceName) -domainName $(domainName) -apimOrganization "$(apimOrganization)" -apimAdminEmail $(apimAdminEmail) -pfxPassword $(pfxPassword) -azureApplicationId $(azureApplicationId) -azureTenantId $(azureTenantId) -azureClientSecret $(azureClientSecret) -appGatewayPublicIpName $(appGatewayPublicIpName) -environment ${{ parameters.Environment }}'
    - task: UniversalPackages@0
      displayName: Download rest api tools
      inputs:
        downloadDirectory: '$(Pipeline.Workspace)/restapitool'
        vstsFeed: $(System.TeamProject)/$(ARTIFACTS_FEED_NAME)
        vstsFeedPackage: 'restapitool'
        vstsPackageVersion: '*'
    - task: CmdLine@2
      displayName: internal test management via direct rest api tools
      env:
        APIM_LandingZone_RestApi_PrimaryKey: $(APIM_LandingZone_RestApi_PrimaryKey)
        APIM_LandingZone_RestApi_Identifier: $(APIM_LandingZone_RestApi_Identifier)
      inputs:
        script: |
          echo Write your commands here
          
          echo Hello world
          dir "$(Pipeline.Workspace)/restapitool"          
          $(Pipeline.Workspace)/restapitool/ApimManagementApi.exe
