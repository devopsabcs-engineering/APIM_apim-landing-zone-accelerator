- stage: integrated_tests
  dependsOn: [external_vnet_tests]
  pool:
   vmImage: windows-latest
  jobs:
  - job: do_health_tests
    displayName: perform health test
    variables:
    - name: appGatewayVnetName
      value: 'vnet-apim-cs-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}'
    - name: ResourceGroupNameShared
      value: 'rg-shared-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: ResourceGroupNameNetwork
      value: 'rg-networking-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: domainName
      value: MngEnv019702.com
    - name: zoneName
      value: MngEnv019702.com
    - name: ResourceGroupNameApim 
      value: 'rg-apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: apimServiceName
      value: 'apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: ARTIFACTS_FEED_NAME
      value: APIM_landing_zone_tools
    - name: appGatewayName
      value: 'appgw-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: apimServiceName
      value: 'apim-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    - name: Location
      value: ${{ parameters.Location }}
    - name: apimOrganization
      value: "Contoso MngEnv019702"
    - name: apimAdminEmail
      value: "admin@MngEnv019702.onmicrosoft.com" # Administrator's email address
    - name: appGatewayPublicIpName
      value: 'pip-appgw-$(workloadPrefix)$(shortInstance)-${{ parameters.Environment }}-${{ parameters.Location }}-$(longInstance)'
    steps:
    #- checkout: self
    #  persistCredentials: true    
    - task: AzureCLI@2
      enabled: false
      displayName: Perform the Backend Health Tests
      inputs:
        azureSubscription: '$(serviceConnectionName)'
        scriptType: 'pscore'
        scriptLocation: 'scriptPath'
        scriptPath: '$(System.DefaultWorkingDirectory)/infra/scripts/health-test.ps1'
        arguments: '-Location $(Location) -ResourceGroupNameApim $(ResourceGroupNameApim) -zoneName $(zoneName) -appGatewayName $(appGatewayName) -apimServiceName $(apimServiceName) -domainName $(domainName) -apimOrganization "$(apimOrganization)" -apimAdminEmail $(apimAdminEmail) -pfxPassword $(pfxPassword) -azureApplicationId $(azureApplicationId) -azureTenantId $(azureTenantId) -azureClientSecret $(azureClientSecret) -environment ${{ parameters.Environment }}'

    - task: AzureCLI@2
      enabled: false
      env:
        azureClientSecret: $(azureClientSecret)
        azureApplicationId: $(azureApplicationId)
        azureTenantId: $(azureTenantId)
      inputs:
        azureSubscription: '$(serviceConnectionName)'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Write your PowerShell commands here.

          $azureClientSecret = Get-ChildItem Env:azureClientSecret
          $azureApplicationId = Get-ChildItem Env:azureApplicationId
          $azureTenantId = Get-ChildItem Env:azureTenantId

          echo $azureApplicationId
          echo $azureTenantId
          echo $azureClientSecret
                    
          Write-Host "Hello World"
          Write-Host "install az module"

          Install-Module -Name Az -AllowClobber -Scope CurrentUser -Force
          $azurePassword = ConvertTo-SecureString "$(azureClientSecret)" -AsPlainText -Force
          $psCred = New-Object System.Management.Automation.PSCredential($(azureApplicationId) , $azurePassword)
          Connect-AzAccount -Credential $psCred -TenantId $(azureTenantId)  -ServicePrincipal 
          
          Write-Host After the application gateway deploys, confirm the health status of the API Management back ends in the portal or by running the following command
          
          Get-AzApplicationGatewayBackendHealth -Name $(appGatewayName) -ResourceGroupName $(ResourceGroupNameApim)
    - task: PowerShell@2
      enabled: false
      displayName: Health Check
      env:
        azureClientSecret: $(azureClientSecret)
        azureApplicationId: $(azureApplicationId)
        azureTenantId: $(azureTenantId)
      inputs:
        targetType: 'inline'
        script: |
          # Write your PowerShell commands here.
          
          $azureClientSecret = Get-ChildItem Env:azureClientSecret
          $azureApplicationId = Get-ChildItem Env:azureApplicationId
          $azureTenantId = Get-ChildItem Env:azureTenantId

          echo $azureApplicationId
          echo $azureTenantId
          echo $azureClientSecret

          Write-Host "Hello World"
          Write-Host "install az module"

          Install-Module -Name Az -AllowClobber -Scope CurrentUser -Force
          $azurePassword = ConvertTo-SecureString "$azureClientSecret" -AsPlainText -Force
          $psCred = New-Object System.Management.Automation.PSCredential($azureApplicationId , $azurePassword)
          Connect-AzAccount -Credential $psCred -TenantId $azureTenantId  -ServicePrincipal
          
          Write-Host After the application gateway deploys, confirm the health status of the API Management back ends in the portal or by running the following command
          
          Get-AzApplicationGatewayBackendHealth -Name $(appGatewayName) -ResourceGroupName $(ResourceGroupNameApim)