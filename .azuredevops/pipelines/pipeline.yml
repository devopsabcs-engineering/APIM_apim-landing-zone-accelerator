# Base pipeline to deploy APIM ESLZ with default configuration
# Instructions:
# 1) Create a service connection in Azure Devops to Github so the remote repo where the Bicep files
#    of APIM- ESLZ are located can be downloaded
# 2) Enter the correct name of the APIM- ESLZ repo and the name of the just created 
#    service endpoint for the Github on lines 22 and 23
# 3) Substitute all variable values in the connected template apim-eslz-vars.yml 
#    to align with your environment

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- template: apim-eslz-vars.yml
- group: APIM_ESLZ_dev_vars

#resources:
#  repositories:
#  - repository: apimeslz
#    type: github
#    name: devopsabcs-engineering/apim-landing-zone-accelerator
#    endpoint: APIM_devopsabcs-engineering_apim-landing-zone-accelerator

stages:
- stage: retrieve_template_from_github_and_publish
  displayName: 'Fetch templates from github and store in pipeline'
  jobs:
  - job: publish_artifact_to_pipeline
    displayName: 'Publish bicep files as artifact to pipeline'
    steps:
    #- checkout: apimeslz
    - checkout: self
    - task: CmdLine@2
      inputs:
        script: |
          echo Write your commands here
          
          echo Hello world
          
          ls $(Pipeline.Workspace)/s
    - task: DownloadSecureFile@1
      name: appgwPfxDownloadTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_VNEXT_appgw.pfx'
    - task: DownloadSecureFile@1
      name: pfxApiTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_api.pfx'
    - task: DownloadSecureFile@1
      name: pfxManagementTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_management.pfx'
    - task: DownloadSecureFile@1
      name: pfxPortalTask
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_portal.pfx'
    - task: DownloadSecureFile@1
      name: trustedrootcert
      inputs:
        secureFile: 'APIM_apim-landing-zone-accelerator_cacert.pem'
    - bash: |
        mkdir '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/gateway/certs'
        cp '$(appgwPfxDownloadTask.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/gateway/certs/appgw.pfx'
        cp '$(pfxApiTask.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/gateway/certs/api.pfx'
        cp '$(pfxPortalTask.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/gateway/certs/portal.pfx'
        cp '$(pfxManagementTask.secureFIlePath)' '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/gateway/certs/management.pfx'
        ls '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep/gateway/certs'
      displayName: copy appgw pfx cert from secure file
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)/s/reference-implementations/AppGW-IAPIM-Func/bicep'
        artifact: $(artifactName)
        publishLocation: 'pipeline'
- stage: deploy_artifacts
  dependsOn: retrieve_template_from_github_and_publish
  displayName: 'Deploy all bicep artifacts'
  jobs:
  - deployment: 
    displayName: 'Deploy APIM ESLZ artifacts to Azure subscription'
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "using serviceconnection :" $(serviceConnectionName)
                echo "initial deployment may take up to one hour while subsequent ones are shorter"
                az deployment sub create --location $(deploymentLocation) --name $(deploymentName) --template-file $(Pipeline.Workspace)/$(artifactName)/main.bicep --parameters workloadName=$(workloadName) environment=$(eslzEnvironmentType) CICDAgentType=$(CICDAgentType) accountName=$(accountName) appGatewayCertType=$(appGatewayCertType) appGatewayFqdn=$(appGatewayFqdn) certificatePassword=$(certificatePassword) personalAccessToken=$(personalAccessToken) vmPassword=$(vmPassword) vmUsername=$(vmUsername) apiFQDN=$(apiFQDN) apiCertificatePassword=$(apiCertificatePassword) apiCertType=$(apiCertType) portalFQDN=$(portalFQDN) portalCertificatePassword=$(portalCertificatePassword) portalCertType=$(portalCertType) managementFQDN=$(managementFQDN) managementCertificatePassword=$(managementCertificatePassword) managementCertType=$(managementCertType)
- stage: postdeploy
  displayName: 'Post deploy scripts'
  dependsOn: deploy_artifacts
  jobs:
  - job: post_deploy_job
    variables:
    #- name: internalVnetName
    #  value: vnet-apim-cs-ApimESLZ-dev-canadacentral-002
    - name: domainName
      value: MngEnv019702.onmicrosoft.com
    #- name: zoneName
    #  value: MngEnv019702.onmicrosoft.com
    - name: ResourceGroupNameApim 
      value: rg-apim-ApimLZ03-dev-canadacentral-003
    - name: apimServiceName
      value: apim-ApimLZ03-dev-canadacentral-003
    - group: APIM_apim-landing-zone-accelerator_common
    #- name: appGatewayName
    #  value: appgw-ApimESLZ-dev-canadacentral-002
    #- name: Location
    #  value: canadacentral
    #- name: apimOrganization
    #  value: "Contoso MngEnv019702"
    #- name: apimAdminEmail
    #  value: "admin@MngEnv019702.onmicrosoft.com" # Administrator's email address
    - group: APIM_apim-landing-zone-accelerator_common
    #- name: ARTIFACTS_FEED_NAME
    #  value: APIM_landing_zone_tools
    steps:
      - task: CmdLine@2
        inputs:
          script: |
            echo Write your commands here
            
            echo Hello world
      - task: DownloadSecureFile@1
        name: pfxApiTask
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_api.pfx'
      - task: DownloadSecureFile@1
        name: pfxManagementTask
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_management.pfx'
      - task: DownloadSecureFile@1
        name: pfxPortalTask
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_portal.pfx'
      - task: DownloadSecureFile@1
        name: trustedrootcert
        inputs:
          secureFile: 'APIM_apim-landing-zone-accelerator_cacert.pem'      
      - task: AzureCLI@2
        enabled: true
        displayName: post deploy
        inputs:
          azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
          scriptType: 'pscore'
          scriptLocation: 'scriptPath'
          scriptPath: '$(System.DefaultWorkingDirectory)/infra/scripts/main-postdeply.ps1'
          arguments: '-ResourceGroupNameApim $(ResourceGroupNameApim) -apimServiceName $(apimServiceName) -domainName $(domainName) -pfxPassword $(pfxPassword) -trustedrootcertsecureFIlePath $(trustedrootcert.secureFIlePath) -pfxApiTasksecureFIlePath $(pfxApiTask.secureFIlePath) -pfxPortalTasksecureFIlePath $(pfxPortalTask.secureFIlePath) -pfxManagementTasksecureFIlePath $(pfxManagementTask.secureFIlePath) -azureApplicationId $(azureApplicationId) -azureTenantId $(azureTenantId) -azureClientSecret $(azureClientSecret)'
