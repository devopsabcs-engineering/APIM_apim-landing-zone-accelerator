# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  paths:
    include:
      - src/ApimAzureAdB2CSoln/static-website-front-end
      #- tools/code/extractor

pool:
  vmImage: 'windows-latest'

variables:
- name: azureSubscription
  value: 'APIM_MicrosoftAzureExternal_multitenant'
- name: storageAccountProd
  value: stwebn4nccfxiu2ep6
- name: storageAccountDev
  value: stweb23x452a77wcmu
- name: ARTIFACT_NAME_DEV
  value: StaticWebsiteContentDev
- name: ARTIFACT_NAME_PROD
  value: StaticWebsiteContentProd
- name: project
  value: 'src/ApimAzureAdB2CSoln/static-website-front-end'

stages:
- stage: Build_Dev
  displayName: Build Dev
  jobs:
  - job: Transform
    displayName: Transform Input
    variables:
      - group: APIM_b2c_frontend_dev_vars
    steps:
    - task: replacetokens@5
      inputs:
        rootDirectory: '$(project)'
        targetFiles: '**/*.html'
        encoding: 'auto'
        tokenPattern: 'default'
        writeBOM: true
        actionOnMissing: 'warn'
        keepToken: false
        actionOnNoFiles: 'continue'
        enableTransforms: false
        enableRecursion: false
        useLegacyPattern: false
        enableTelemetry: true
    - task: CopyFiles@2
      displayName: Copy
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/$(project)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/output'
    - task: PublishPipelineArtifact@1
      displayName: Share
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/output'
        artifact: '$(ARTIFACT_NAME_DEV)'
        publishLocation: 'pipeline'

- stage: Release_Dev
  displayName: Release Dev
  dependsOn: Build_Dev  
  jobs:
  - deployment: DeployToStorage
    displayName: Deploy to Azure Storage
    environment: APIM_B2C_frontend_development
    variables:
      AZURE_STORAGE_ACCOUNT: $(storageAccountDev)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Delete Existing Files'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'az storage blob delete-batch -s `$web --account-name $(AZURE_STORAGE_ACCOUNT) --auth-mode login'
          - task: AzureFileCopy@4
            displayName: 'Copy Files to Storage'
            inputs:
              azureSubscription: '$(azureSubscription)'
              SourcePath: '$(Pipeline.Workspace)/$(ARTIFACT_NAME_DEV)/*'
              Destination: 'AzureBlob'
              storage: '$(AZURE_STORAGE_ACCOUNT)'
              ContainerName: '$web'
- stage: Build_Prod
  dependsOn: Release_Dev
  displayName: Build Prod
  jobs:
  - job: Transform
    displayName: Transform Input
    variables:
      - group: APIM_b2c_frontend_prod_vars
    steps:
    - task: replacetokens@5
      inputs:
        rootDirectory: '$(project)'
        targetFiles: '**/*.html'
        encoding: 'auto'
        tokenPattern: 'default'
        writeBOM: true
        actionOnMissing: 'warn'
        keepToken: false
        actionOnNoFiles: 'continue'
        enableTransforms: false
        enableRecursion: false
        useLegacyPattern: false
        enableTelemetry: true    
    - task: CopyFiles@2
      displayName: Copy
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/$(project)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/output'
    - task: PublishPipelineArtifact@1
      displayName: Share
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/output'
        artifact: '$(ARTIFACT_NAME_PROD)'
        publishLocation: 'pipeline'

- stage: Release_Prod
  displayName: Release Prod
  dependsOn: Build_Prod  
  jobs:
  - deployment: DeployToStorage
    displayName: Deploy to Azure Storage
    environment: APIM_B2C_frontend_production
    variables:
      AZURE_STORAGE_ACCOUNT: $(storageAccountProd)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Delete Existing Files'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'az storage blob delete-batch -s `$web --account-name $(AZURE_STORAGE_ACCOUNT) --auth-mode login'
          - task: AzureFileCopy@4
            displayName: 'Copy Files to Storage'
            inputs:
              azureSubscription: '$(azureSubscription)'
              SourcePath: '$(Pipeline.Workspace)/$(ARTIFACT_NAME_PROD)/*'
              Destination: 'AzureBlob'
              storage: '$(AZURE_STORAGE_ACCOUNT)'
              ContainerName: '$web'