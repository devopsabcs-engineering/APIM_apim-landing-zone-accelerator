# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  paths:
    include:
      - src/ApimAzureAdB2CSoln/static-website-front-end
      #- tools/code/extractor

pool:
  vmImage: 'windows-latest'

variables:
  ARTIFACT_NAME: StaticWebsiteContent

stages:
- stage: Build_Dev
  displayName: Build Dev
  jobs:
  - job: Transform
    displayName: Transform Input
    variables:
      project: 'src/ApimAzureAdB2CSoln/static-website-front-end'
    steps:    
    - task: CopyFiles@2
      displayName: Copy
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/$(project)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/output'
    - task: PublishPipelineArtifact@1
      displayName: Share
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/output'
        artifact: '$(ARTIFACT_NAME)'
        publishLocation: 'pipeline'

- stage: Release_Dev
  displayName: Release Dev
  dependsOn: Build_Dev  
  jobs:
  - deployment: DeployToStorage
    displayName: Deploy to Azure Storage
    environment: APIM_B2C_frontend_development
    variables:
      AZURE_STORAGE_ACCOUNT: stor3m2fbh7dapcag    
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Delete Existing Files'
            inputs:
              azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'az storage blob delete-batch -s `$web --account-name $(AZURE_STORAGE_ACCOUNT) --auth-mode login'
          - task: AzureFileCopy@4
            displayName: 'Copy Files to Storage'
            inputs:
              azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
              SourcePath: '$(Pipeline.Workspace)/$(ARTIFACT_NAME)/*'
              Destination: 'AzureBlob'
              storage: '$(AZURE_STORAGE_ACCOUNT)'
              ContainerName: '$web'
- stage: Build_Prod
  dependsOn: Release_Dev
  displayName: Build Prod
  jobs:
  - job: Transform
    displayName: Transform Input
    variables:
      project: 'src/ApimAzureAdB2CSoln/static-website-front-end'
    steps:    
    - task: CopyFiles@2
      displayName: Copy
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/$(project)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/output'
    - task: PublishPipelineArtifact@1
      displayName: Share
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/output'
        artifact: '$(ARTIFACT_NAME)'
        publishLocation: 'pipeline'

- stage: Release_Prod
  displayName: Release Prod
  dependsOn: Build_Prod  
  jobs:
  - deployment: DeployToStorage
    displayName: Deploy to Azure Storage
    environment: APIM_B2C_frontend_production
    variables:
      AZURE_STORAGE_ACCOUNT: femlifepocapimb2ce    
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Delete Existing Files'
            inputs:
              azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: 'az storage blob delete-batch -s `$web --account-name $(AZURE_STORAGE_ACCOUNT) --auth-mode login'
          - task: AzureFileCopy@4
            displayName: 'Copy Files to Storage'
            inputs:
              azureSubscription: 'APIM_MicrosoftAzureExternal_multitenant'
              SourcePath: '$(Pipeline.Workspace)/$(ARTIFACT_NAME)/*'
              Destination: 'AzureBlob'
              storage: '$(AZURE_STORAGE_ACCOUNT)'
              ContainerName: '$web'