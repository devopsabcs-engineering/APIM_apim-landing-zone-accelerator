<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>APIOps 007 Labs | Ateliers APIOps 007</title>
    <meta name="description" content="Bilingual hands-on labs: promote Azure API Management from dev to prod with the APIops CLI. Ateliers pratiques bilingues : promouvez Azure API Management du dev à la prod avec l'APIops CLI.">
    <link rel="canonical" href="{{ config.site_url }}en/">
    <link rel="alternate" hreflang="en" href="{{ config.site_url }}en/">
    <link rel="alternate" hreflang="fr" href="{{ config.site_url }}fr/">
    <link rel="alternate" hreflang="x-default" href="{{ config.site_url }}en/">
    <noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: #0b1020; color: #eef2ff; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: clamp(1.75rem, 6vw, 2.5rem); letter-spacing: -.02em; background: linear-gradient(90deg, #0ea5e9, #6366f1, #a855f7, #ef4444); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { color: #c7d0ea; line-height: 1.5; }
      .choices { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1.5rem; }
      a { display: inline-block; padding: .65rem 1.25rem; border-radius: 10px; border: 1px solid #4f46e5; background: #4f46e5; color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { background: #4338ca; }
      a:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <h1>APIOps 007 Labs</h1>
      <p lang="en">Choose your language. You will be redirected automatically.</p>
      <p lang="fr">Choisissez votre langue. Vous serez redirigé automatiquement.</p>
      <div class="choices">
        <a href="en/" hreflang="en" lang="en">English</a>
        <a href="fr/" hreflang="fr" lang="fr">Français</a>
      </div>
    </main>
    <script>
      (function () {
        var key = "apiops007-lang";
        var lang = "en";
        try {
          var saved = localStorage.getItem(key);
          if (saved === "en" || saved === "fr") {
            lang = saved;
          } else {
            var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
            for (var i = 0; i < prefs.length; i++) {
              var code = String(prefs[i]).toLowerCase().slice(0, 2);
              if (code === "fr" || code === "en") { lang = code; break; }
            }
          }
        } catch (e) { /* storage blocked: keep the default */ }
        window.location.replace(lang + "/" + window.location.search + window.location.hash);
      })();
    </script>
  </body>
</html>
