<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | APIOps 007 Labs</title>
    <meta name="robots" content="noindex">
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: #0b1020; color: #eef2ff; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 8vw, 3.5rem); }
      p { color: #c7d0ea; line-height: 1.5; }
      .choices { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1.5rem; }
      a { display: inline-block; padding: .65rem 1.25rem; border-radius: 10px; border: 1px solid #4f46e5; background: #4f46e5; color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { background: #4338ca; }
      a:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1><span role="img" aria-label="Compass">🧭</span> 404</h1>
      <p lang="en">This page does not exist. Start again from the home page.</p>
      <p lang="fr">Cette page n'existe pas. Revenez à la page d'accueil.</p>
      <div class="choices">
        <a href="{{ config.site_url }}en/" hreflang="en" lang="en">English home</a>
        <a href="{{ config.site_url }}fr/" hreflang="fr" lang="fr">Accueil en français</a>
      </div>
    </main>
  </body>
</html>
