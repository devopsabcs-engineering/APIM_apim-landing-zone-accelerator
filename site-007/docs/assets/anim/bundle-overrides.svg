<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One environment-neutral bundle, two environments">
  <title>One environment-neutral bundle, two environments</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#101a33"/></linearGradient>
    <linearGradient id="apim" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
    <style>
      .t { fill:#e2e8f0; } .muted { fill:#94a3b8; font-size:12.5px; } .lane { fill:#64748b; font-size:11px; font-weight:700; letter-spacing:.14em; }
      .box { fill:#111c36; stroke:#334155; stroke-width:1.5; }
      .wire { stroke:#475569; stroke-width:2; fill:none; }
      .flow { stroke-width:2.5; fill:none; stroke-dasharray:8 10; opacity:.7; animation:dash 1.1s linear infinite; }
      .green { stroke:#4ade80; } .amber { stroke:#fbbf24; } .red { stroke:#f87171; } .blue { stroke:#38bdf8; }
      @keyframes dash { to { stroke-dashoffset:-36; } }
      .title { font-size:22px; font-weight:700; fill:#f1f5f9; } .h { font-size:14.5px; font-weight:650; fill:#e2e8f0; }
      .pill { font-size:12.5px; font-weight:650; }
      @media (prefers-reduced-motion: reduce) { .flow { animation:none; } .motion { display:none; } }
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>
  <text x="600" y="44" text-anchor="middle" class="title">One environment-neutral bundle, two environments</text>
  <text x="600" y="68" text-anchor="middle" class="muted">The bundle never holds hosts, limits or secrets: generated overrides fill them in at publish time</text>
  <rect x="40" y="105" width="330" height="330" rx="14" class="box"/>
  <text x="60" y="135" class="h">📦 artifacts.007 (bundle)</text>
  <text x="60" y="172" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#cbd5e1">apis/ai-gateway/policy.xml</text>
  <text x="76" y="190" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#fbbf24">{{ai-safety-threshold}}</text>
  <text x="60" y="218" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#cbd5e1">backends/ai-foundry</text>
  <text x="76" y="236" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#fbbf24">https://ai-foundry.invalid</text>
  <text x="60" y="264" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#cbd5e1">namedValues/ai-team-retail-tpm</text>
  <text x="76" y="282" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#fbbf24">UNCONFIGURED</text>
  <text x="60" y="310" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#cbd5e1">products/team-retail/policy.xml</text>
  <text x="76" y="328" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#fbbf24">{{ai-team-retail-tpm}}</text>
  <text x="60" y="356" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#cbd5e1">apis/weather/policy.xml</text>
  <text x="76" y="374" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#fbbf24">x-demo-release</text>
  <text x="60" y="420" class="muted">🔒 ownership filter: only owned resources</text>
  <rect x="450" y="120" width="300" height="90" rx="12" class="box"/>
  <text x="600" y="158" text-anchor="middle" class="h">New-Apim007Overrides.ps1</text>
  <text x="600" y="177" text-anchor="middle" class="muted">dev manifest + ai-settings</text>
  <rect x="450" y="330" width="300" height="90" rx="12" class="box"/>
  <text x="600" y="368" text-anchor="middle" class="h">New-Apim007Overrides.ps1</text>
  <text x="600" y="387" text-anchor="middle" class="muted">prod manifest + ai-settings</text>
  <rect x="830" y="105" width="330" height="150" rx="14" fill="url(#apim)" opacity=".93"/>
  <text x="850" y="135" class="h">dev-007</text>
  <text x="850" y="167" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#e9d5ff">ai-foundry → ais-apim007-dev-…</text>
  <text x="850" y="195" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#e9d5ff">ai-team-retail-tpm = 2000</text>
  <text x="850" y="223" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#e9d5ff">ai-team-finance-tpm = 300</text>
  <rect x="830" y="315" width="330" height="150" rx="14" fill="url(#apim)" opacity=".93"/>
  <text x="850" y="345" class="h">prod-007</text>
  <text x="850" y="377" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#e9d5ff">ai-foundry → ais-apim007-prod-…</text>
  <text x="850" y="405" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#e9d5ff">ai-team-retail-tpm = 5000</text>
  <text x="850" y="433" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#e9d5ff">ai-team-finance-tpm = 500</text>
  <path class="wire" d="M370,200 H450" marker-end="url(#arrow)"/><path class="wire" d="M370,340 H410 V375 H450" marker-end="url(#arrow)"/>
  <path class="wire" d="M750,165 H830" marker-end="url(#arrow)"/><path class="wire" d="M750,375 H830" marker-end="url(#arrow)"/>
  <path class="flow blue" d="M370,200 H450"/><path class="flow blue" d="M370,340 H410 V375 H450"/><path class="flow green" d="M750,165 H830"/><path class="flow green" d="M750,375 H830"/>
  <g class="motion"><rect x="845" y="150" width="305" height="85" fill="#4c1d95" opacity="1">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.35;0.41;0.95;1"/></rect><rect x="845" y="360" width="305" height="85" fill="#4c1d95" opacity="1">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.6;0.66;0.95;1"/></rect>
  <circle r="8" fill="#38bdf8" filter="url(#glow)" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" path="M370,200 H600 V165 H830" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.34;0.36;1"/></circle>
  <circle r="8" fill="#4ade80" filter="url(#glow)" opacity="0"><animateMotion dur="10s" repeatCount="indefinite" path="M370,340 H410 V375 H830" keyPoints="0;0;1;1" keyTimes="0;0.3;0.6;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.59;0.61;1"/></circle></g>
  <text x="600" y="480" text-anchor="middle" class="muted">publish --source artifacts.007 --overrides overrides.&lt;env&gt;.json --filter configuration.007.ownership.yaml --no-transitive</text>
  </svg>