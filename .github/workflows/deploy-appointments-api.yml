name: Deploy Appointments API

on:
  push:
    branches:
      - main
    paths:
      - 'src/power-platform-custom-connector-api/Appointment/Appointment/**'
      - 'src/power-platform-custom-connector-api/Appointment/**'
      - 'src/power-platform-custom-connector-api/Appointment/Appointment/Dockerfile'
      - '.github/workflows/deploy-appointments-api.yml'
      - 'infra/fnapp/main.bicep'
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '003'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '003'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  SOLUTION: src/power-platform-custom-connector-api/Appointment/Appointment.sln
  BUILD_CONFIGURATION: Release
  ARTIFACT_NAME: appointments-api-artifact
  WEBSITE_PACKAGE_NAME: Appointment
  RESOURCE_GROUP_NAME: rg-appointments-fnapp-linux-${{ inputs.instance_number || '003' }}
  LOCATION: canadacentral
  DEPLOYMENT_NAME: infra-deployment
  TEMPLATE_FILE: infra/fnapp/main.bicep
  BASE_NAME: appointments-api
  IMAGE_NAME: appointmentsapi
  WORKING_DIRECTORY: src/power-platform-custom-connector-api/Appointment/Appointment
  BUILD_CONTEXT: src/power-platform-custom-connector-api/Appointment
  DOCKERFILE_PATH: src/power-platform-custom-connector-api/Appointment/Appointment/Dockerfile
  INSTANCE_NUMBER: ${{ inputs.instance_number || '003' }}
  DEPLOY_INFRA: ${{ inputs.deploy_infra || true }}
  ADD_AZURE_AD_APP_SETTINGS: 'false'

jobs:
  set-version:
    name: Set version and create tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      assembly_sem_ver: ${{ steps.gitversion.outputs.assemblySemVer }}
      assembly_sem_file_ver: ${{ steps.gitversion.outputs.assemblySemFileVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Create Git tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.gitversion.outputs.semVer }}"
          git tag -a "$TAG" -m "Main version $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already exists, skipping."

  build:
    name: Build
    needs: set-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: Publish
        run: |
          dotnet publish "${{ env.WORKING_DIRECTORY }}" \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --output "${{ runner.temp }}/${{ env.WEBSITE_PACKAGE_NAME }}_${{ github.run_id }}" \
            -p:Version=${{ needs.set-version.outputs.semver }} \
            -p:FileVersion=${{ needs.set-version.outputs.assembly_sem_file_ver }} \
            -p:AssemblyVersion=${{ needs.set-version.outputs.assembly_sem_ver }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.WEBSITE_PACKAGE_NAME }}_${{ github.run_id }}

  deploy-infra:
    name: Deploy Infrastructure
    needs: build
    if: ${{ inputs.deploy_infra != false }}
    runs-on: ubuntu-latest
    environment: APIM_Appointments_Api_infra_production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.LOCATION }}
            az deployment group create \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters instanceNumber=${{ env.INSTANCE_NUMBER }}

  deploy-app:
    name: Deploy Application
    needs: [set-version, deploy-infra]
    runs-on: ubuntu-latest
    environment: APIM_Appointments_Api_app_production
    outputs:
      app_name: ${{ steps.get_app.outputs.app_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get app name
        id: get_app
        run: |
          APP_NAME=$(az deployment group show \
            --name ${{ env.DEPLOYMENT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --query properties.outputs.functionAppName.value -o tsv)
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/drop
      - name: Create zip package
        run: |
          cd ${{ runner.temp }}/drop
          zip -r ${{ runner.temp }}/deploy.zip .
      - name: Deploy to Azure Functions
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --name ${{ steps.get_app.outputs.app_name }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --src-path ${{ runner.temp }}/deploy.zip \
              --type zip \
              --clean true

            echo "Restarting function app to pick up deployed functions..."
            az functionapp restart \
              --name ${{ steps.get_app.outputs.app_name }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }}

            echo "Waiting for runtime to initialize..."
            sleep 90

            echo "Listing deployed functions:"
            az functionapp function list \
              --name ${{ steps.get_app.outputs.app_name }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --output table || echo "Function listing not available yet"

            echo "Checking runtime logs for errors..."
            az webapp log tail \
              --name ${{ steps.get_app.outputs.app_name }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --timeout 15 2>&1 | head -50 || true

  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app warmup
        run: sleep 30
      - name: Smoke test Appointments API
        id: smoke
        env:
          APP_NAME: ${{ needs.deploy-app.outputs.app_name }}
        run: |
          APP_URL="https://${APP_NAME}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/api/Appointment"
          echo "Testing: ${SMOKE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${SMOKE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "smoke_url=${SMOKE_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 500 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Write job summary
        env:
          APP_URL: ${{ steps.smoke.outputs.app_url }}
          SMOKE_URL: ${{ steps.smoke.outputs.smoke_url }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          # Fetch version
          VERSION_RESPONSE=$(curl -s --max-time 30 --retry 2 --retry-delay 5 "${APP_URL}/api/version" || echo "N/A")
          echo "Version: ${VERSION_RESPONSE}"

          # Capture screenshot of version endpoint
          npm install puppeteer 2>/dev/null
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 720 });
              await page.goto('${APP_URL}/api/version', { waitUntil: 'networkidle2', timeout: 30000 }).catch(() => {});
              await new Promise(r => setTimeout(r, 3000));
              await page.screenshot({ path: 'screenshot.png' });
              await browser.close();
              console.log('Screenshot captured');
            })().catch(e => { console.error('Screenshot failed:', e.message); process.exit(0); });
          "

          {
            echo "## 🔍 Smoke Test Results"
            echo ""
            echo "| Check | URL | Status |"
            echo "|-------|-----|--------|"
            echo "| Appointments API | [${SMOKE_URL}](${SMOKE_URL}) | ${SMOKE_RESULT} |"
            echo ""
            echo "### 📦 Version Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${VERSION_RESPONSE}\` |"
            echo "| Version URL | [${APP_URL}/api/version](${APP_URL}/api/version) |"
            echo ""
            if [ -f screenshot.png ]; then
              echo "### 📸 Appointments API Screenshot"
              echo ""
              echo "Screenshot uploaded as workflow artifact: **screenshot-appointments-api**"
              echo ""
            fi
            echo "🔗 **Application URL:** [${APP_URL}](${APP_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-appointments-api
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 30

  teardown:
    name: Teardown Infrastructure
    needs: smoke-test
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deleting resource group ${{ env.RESOURCE_GROUP_NAME }}..."
            az group delete \
              --name ${{ env.RESOURCE_GROUP_NAME }} \
              --yes \
              --no-wait
            echo "Teardown initiated for ${{ env.RESOURCE_GROUP_NAME }}"
