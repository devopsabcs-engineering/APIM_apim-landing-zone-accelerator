name: Deploy Appointments API

on:
  push:
    branches:
      - main
    paths:
      - 'src/power-platform-custom-connector-api/Appointment/Appointment/**'
      - 'src/power-platform-custom-connector-api/Appointment/**'
      - 'src/power-platform-custom-connector-api/Appointment/Appointment/Dockerfile'
      - '.github/workflows/deploy-appointments-api.yml'
      - 'infra/fnapp/main.bicep'
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '003'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '003'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  RESOURCE_GROUP_NAME: rg-appointments-fnapp-linux-${{ inputs.instance_number || '003' }}
  LOCATION: canadacentral
  DEPLOYMENT_NAME: infra-deployment
  TEMPLATE_FILE: infra/fnapp/main.bicep
  IMAGE_NAME: appointmentsapi
  BUILD_CONTEXT: src/power-platform-custom-connector-api/Appointment
  DOCKERFILE_PATH: src/power-platform-custom-connector-api/Appointment/Appointment/Dockerfile
  INSTANCE_NUMBER: ${{ inputs.instance_number || '003' }}
  DEPLOY_INFRA: ${{ inputs.deploy_infra || true }}

jobs:
  set-version:
    name: Set version and create tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      assembly_sem_ver: ${{ steps.gitversion.outputs.assemblySemVer }}
      assembly_sem_file_ver: ${{ steps.gitversion.outputs.assemblySemFileVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Create Git tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.gitversion.outputs.semVer }}"
          git tag -a "$TAG" -m "Main version $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already exists, skipping."

  deploy-infra:
    name: Deploy Infrastructure
    needs: set-version
    if: ${{ inputs.deploy_infra != false }}
    runs-on: ubuntu-latest
    environment: APIM_Appointments_Api_infra_production
    outputs:
      acr_login_server: ${{ steps.deploy.outputs.acr_login_server }}
      acr_name: ${{ steps.deploy.outputs.acr_name }}
      app_name: ${{ steps.deploy.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        id: deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.LOCATION }}
            az deployment group create \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters instanceNumber=${{ env.INSTANCE_NUMBER }}

            FUNC_NAME=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.functionAppName.value -o tsv)
            ACR_NAME=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.containerRegistryName.value -o tsv)
            ACR_LOGIN=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.containerRegistryLoginServer.value -o tsv)

            echo "app_name=$FUNC_NAME" >> "$GITHUB_OUTPUT"
            echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
            echo "acr_login_server=$ACR_LOGIN" >> "$GITHUB_OUTPUT"

            echo "Waiting 90s for RBAC and private endpoints to propagate..."
            sleep 90

  build-and-push:
    name: Build and Push Container Image
    needs: [set-version, deploy-infra]
    runs-on: ubuntu-latest
    environment: APIM_Appointments_Api_app_production
    outputs:
      image_tag: ${{ needs.set-version.outputs.semver }}
      app_name: ${{ needs.deploy-infra.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name ${{ needs.deploy-infra.outputs.acr_name }}
      - name: Build and push container image
        run: |
          ACR_LOGIN="${{ needs.deploy-infra.outputs.acr_login_server }}"
          IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}"
          TAG="${{ needs.set-version.outputs.semver }}"

          docker build \
            --build-arg GitVersion_SemVer="${TAG}" \
            --build-arg GitVersion_AssemblySemFileVer="${{ needs.set-version.outputs.assembly_sem_file_ver }}" \
            --build-arg GitVersion_AssemblySemVer="${{ needs.set-version.outputs.assembly_sem_ver }}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            -f ${{ env.DOCKERFILE_PATH }} \
            ${{ env.BUILD_CONTEXT }}

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

          echo "Pushed: ${IMAGE}:${TAG}"

  deploy-app:
    name: Deploy Application
    needs: [set-version, deploy-infra, build-and-push]
    runs-on: ubuntu-latest
    environment: APIM_Appointments_Api_app_production
    outputs:
      app_name: ${{ needs.deploy-infra.outputs.app_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update container image on Function App
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME="${{ needs.deploy-infra.outputs.app_name }}"
            RG="${{ env.RESOURCE_GROUP_NAME }}"
            ACR_LOGIN="${{ needs.deploy-infra.outputs.acr_login_server }}"
            TAG="${{ needs.set-version.outputs.semver }}"
            IMAGE="${ACR_LOGIN}/${{ env.IMAGE_NAME }}:${TAG}"

            echo "=== Setting container image to ${IMAGE} ==="
            az functionapp config container set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --image "$IMAGE"

            echo "=== Restarting function app ==="
            az functionapp restart --name "$APP_NAME" --resource-group "$RG"

            echo "=== Waiting 120s for container to pull and start ==="
            sleep 120

            echo "=== Function list ==="
            az functionapp function list --name "$APP_NAME" --resource-group "$RG" --output table || echo "No functions listed yet"

            echo "=== Version endpoint ==="
            curl -sv --max-time 30 "https://${APP_NAME}.azurewebsites.net/api/version" 2>&1 || echo "Version endpoint not responding yet"

            echo "=== Function app status ==="
            az functionapp show --name "$APP_NAME" --resource-group "$RG" \
              --query "{state:state, availabilityState:availabilityState}" --output table

  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app warmup
        run: sleep 30
      - name: Smoke test Appointments API
        id: smoke
        env:
          APP_NAME: ${{ needs.deploy-app.outputs.app_name }}
        run: |
          APP_URL="https://${APP_NAME}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/api/Appointment"
          echo "Testing: ${SMOKE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${SMOKE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "smoke_url=${SMOKE_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 500 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Write job summary
        env:
          APP_URL: ${{ steps.smoke.outputs.app_url }}
          SMOKE_URL: ${{ steps.smoke.outputs.smoke_url }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          VERSION_RESPONSE=$(curl -s --max-time 30 --retry 2 --retry-delay 5 "${APP_URL}/api/version" || echo "N/A")
          echo "Version: ${VERSION_RESPONSE}"

          {
            echo "## 🔍 Smoke Test Results"
            echo ""
            echo "| Check | URL | Status |"
            echo "|-------|-----|--------|"
            echo "| Appointments API | [${SMOKE_URL}](${SMOKE_URL}) | ${SMOKE_RESULT} |"
            echo ""
            echo "### 📦 Version Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${VERSION_RESPONSE}\` |"
            echo "| Version URL | [${APP_URL}/api/version](${APP_URL}/api/version) |"
            echo ""
            echo "🔗 **Application URL:** [${APP_URL}](${APP_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    name: Teardown Infrastructure
    needs: smoke-test
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deleting resource group ${{ env.RESOURCE_GROUP_NAME }}..."
            az group delete \
              --name ${{ env.RESOURCE_GROUP_NAME }} \
              --yes \
              --no-wait
            echo "Teardown initiated for ${{ env.RESOURCE_GROUP_NAME }}"
