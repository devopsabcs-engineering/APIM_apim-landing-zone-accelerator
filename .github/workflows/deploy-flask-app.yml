name: Deploy Flask App

on:
  push:
    branches:
      - main
    paths:
      - 'src/msal-python-soln/python-flask-webapp/**'
      - '.github/workflows/deploy-flask-app.yml'
      - 'src/msal-python-soln/python-flask-webapp/main.bicep'
  workflow_dispatch:
    inputs:
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: '3.13'
  WEB_APP_NAME: app-flask-iru5pc6fcyhre
  PROJECT_ROOT: src/msal-python-soln/python-flask-webapp
  TEMPLATE_FILE: src/msal-python-soln/python-flask-webapp/main.bicep
  RESOURCE_GROUP_NAME: rg-msal-python-soln
  LOCATION: canadacentral
  DEPLOYMENT_NAME: infra-deployment
  APP_CONFIG_FILE: src/msal-python-soln/python-flask-webapp/app_config.py

jobs:
  set-version:
    name: Set version and create tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Create Git tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.gitversion.outputs.semVer }}"
          git tag -a "$TAG" -m "Main version $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already exists, skipping."

  build:
    name: Build
    needs: set-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Replace version in app_config.py
        run: |
          echo "Replacing __VERSION__ with ${{ steps.gitversion.outputs.semVer }}"
          sed -i "s/__VERSION__/${{ steps.gitversion.outputs.semVer }}/g" ${{ env.APP_CONFIG_FILE }}
          cat ${{ env.APP_CONFIG_FILE }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install requirements
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt
      - name: Create archive
        run: |
          cd ${{ env.PROJECT_ROOT }}
          zip -r ${{ runner.temp }}/${{ github.run_id }}.zip . -x "antenv/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-artifact
          path: ${{ runner.temp }}/${{ github.run_id }}.zip

  deploy-infra:
    name: Deploy Infrastructure
    needs: build
    runs-on: ubuntu-latest
    environment: APIM_app-flask-iru5pc6fcyhre_Infra
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.LOCATION }}
            az deployment group create \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters secretValue=${{ secrets.SECRET_VALUE }} \
              --parameters pythonVersion=${{ env.PYTHON_VERSION }}

  deploy-app:
    name: Deploy Web App
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: APIM_app-flask-iru5pc6fcyhre
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-app-artifact
          path: ${{ runner.temp }}/drop
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Wait for SCM site availability
        run: |
          echo "Waiting for SCM site to be ready..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.WEB_APP_NAME }}.scm.azurewebsites.net/" --max-time 10 || echo "000")
            echo "Attempt $i: SCM status $STATUS"
            if [[ "$STATUS" != "409" && "$STATUS" != "000" ]]; then
              echo "SCM site is ready"
              break
            fi
            echo "SCM site busy, waiting 15s..."
            sleep 15
          done
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: ${{ runner.temp }}/drop/${{ github.run_id }}.zip

  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app warmup
        run: sleep 60
      - name: Smoke test home page
        id: smoke
        run: |
          APP_URL="https://${{ env.WEB_APP_NAME }}.azurewebsites.net"
          echo "Testing: ${APP_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L --max-time 60 --retry 3 --retry-delay 10 "${APP_URL}" || true)
          if [ -z "${HTTP_STATUS}" ] || [ "${HTTP_STATUS}" = "000" ]; then
            HTTP_STATUS="000"
            echo "HTTP status: ${HTTP_STATUS} (connection failed or timed out)"
          else
            echo "HTTP status: ${HTTP_STATUS}"
          fi
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 400 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Write job summary
        env:
          APP_URL: ${{ steps.smoke.outputs.app_url }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          # Fetch version
          VERSION_RESPONSE=$(curl -s --max-time 30 --retry 2 --retry-delay 5 "${APP_URL}/version" || echo "N/A")
          echo "Version: ${VERSION_RESPONSE}"

          # Capture screenshot of home page
          npm install puppeteer 2>/dev/null
          echo "Warming up ${APP_URL}..."
          curl -s -o /dev/null --max-time 30 "${APP_URL}" || true
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 720 });
              try { await page.goto('${APP_URL}', { waitUntil: 'networkidle2', timeout: 45000 }); }
              catch (e) { console.log('Navigation warning:', e.message); }
              await new Promise(r => setTimeout(r, 3000));
              await page.screenshot({ path: 'screenshot.png' });
              await browser.close();
              console.log('Screenshot captured');
            })().catch(e => { console.error('Screenshot failed:', e.message); process.exit(0); });
          "

          {
            echo "## 🔍 Smoke Test Results"
            echo ""
            echo "| Check | URL | Status |"
            echo "|-------|-----|--------|"
            echo "| Home Page | [${APP_URL}](${APP_URL}) | ${SMOKE_RESULT} |"
            echo ""
            echo "### 📦 Version Information"
            echo ""
            echo "\`\`\`json"
            echo "${VERSION_RESPONSE}"
            echo "\`\`\`"
            echo ""
            if [ -f screenshot.png ]; then
              echo "### 📸 Home Screen Screenshot"
              echo ""
              echo "Screenshot uploaded as workflow artifact: **screenshot-flask-app**"
              echo ""
            fi
            echo "🔗 **Application URL:** [${APP_URL}](${APP_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-flask-app
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 30

  teardown:
    name: Teardown Infrastructure
    needs: smoke-test
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deleting resource group ${{ env.RESOURCE_GROUP_NAME }}..."
            az group delete \
              --name ${{ env.RESOURCE_GROUP_NAME }} \
              --yes \
              --no-wait
            echo "Teardown initiated for ${{ env.RESOURCE_GROUP_NAME }}"
