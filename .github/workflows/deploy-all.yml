name: Deploy All Apps and APIs

on:
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      teardown:
        description: 'Tear down all infrastructure after deployment'
        type: boolean
        default: false
      web_app_instance:
        description: 'Web App instance number'
        type: string
        default: '005'
      weather_api_instance:
        description: 'Weather API instance number'
        type: string
        default: '005'
      star_wars_api_instance:
        description: 'Star Wars API instance number'
        type: string
        default: '003'
      soap_api_instance:
        description: 'SOAP API instance number'
        type: string
        default: '007'
      odata_api_instance:
        description: 'OData API instance number'
        type: string
        default: '002'
      movie_api_instance:
        description: 'Movie API instance number'
        type: string
        default: '006'
      appointments_api_instance:
        description: 'Appointments API instance number'
        type: string
        default: '003'

permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  deploy-web-app:
    name: Web App
    uses: ./.github/workflows/deploy-web-app.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.web_app_instance }}
      teardown: false
    secrets: inherit

  deploy-weather-api:
    name: Weather API
    uses: ./.github/workflows/deploy-weather-api.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.weather_api_instance }}
      teardown: false
    secrets: inherit

  deploy-star-wars-api:
    name: Star Wars API
    uses: ./.github/workflows/deploy-star-wars-api.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.star_wars_api_instance }}
      teardown: false
    secrets: inherit

  deploy-soap-api:
    name: SOAP API
    uses: ./.github/workflows/deploy-soap-api.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.soap_api_instance }}
      teardown: false
    secrets: inherit

  deploy-odata-api:
    name: OData API
    uses: ./.github/workflows/deploy-odata-api.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.odata_api_instance }}
      teardown: false
    secrets: inherit

  deploy-movie-api:
    name: Movie API
    uses: ./.github/workflows/deploy-movie-api.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.movie_api_instance }}
      teardown: false
    secrets: inherit

  deploy-flask-app:
    name: Flask App
    uses: ./.github/workflows/deploy-flask-app.yml
    with:
      teardown: false
    secrets: inherit

  deploy-fast-api:
    name: Fast API
    uses: ./.github/workflows/deploy-fast-api.yml
    with:
      teardown: false
    secrets: inherit

  deploy-appointments-api:
    name: Appointments API
    uses: ./.github/workflows/deploy-appointments-api.yml
    with:
      deploy_infra: ${{ inputs.deploy_infra }}
      instance_number: ${{ inputs.appointments_api_instance }}
      teardown: false
    secrets: inherit

  publish-wiki:
    name: Publish Deployment Report to Wiki
    needs:
      - deploy-web-app
      - deploy-weather-api
      - deploy-star-wars-api
      - deploy-soap-api
      - deploy-odata-api
      - deploy-movie-api
      - deploy-flask-app
      - deploy-fast-api
      - deploy-appointments-api
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all screenshot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          path: screenshots
          merge-multiple: false
      - name: Collect version and smoke test data
        id: collect
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Define all apps with their version endpoints
          declare -A APPS
          APPS=(
            ["Web App"]="https://app-web-app-jqlzyrm7hw4ou.azurewebsites.net|/api/version|/"
            ["Weather API"]="https://app-weather-api-wvwg5gngtozli.azurewebsites.net|/api/version|/swagger"
            ["Star Wars API"]="https://app-star-wars-api-o3swnbq56q5wi.azurewebsites.net|/api/version|/swagger"
            ["SOAP API"]="https://app-soap-api-eck3siixea55c.azurewebsites.net|/api/version|/PersonProfileService.asmx?wsdl"
            ["OData API"]="https://app-odata-api-y3va2idmk57mg.azurewebsites.net|/api/version|/odata/\$metadata"
            ["Movie API"]="https://app-movie-reviews-api-cknbss3bmafei.azurewebsites.net|/api/version|/swagger"
            ["Flask App"]="https://app-flask-iru5pc6fcyhre.azurewebsites.net|/version|/"
            ["Fast API"]="https://fast-api-app-insights-001.azurewebsites.net|/version|/healthz"
            ["Appointments API"]="https://func-appt-003-ooykm4ncakrlc.azurewebsites.net|/api/version|/api/Appointment"
          )

          # Build wiki page
          WIKI_FILE="wiki-report.md"
          {
            echo "# Deployment Report"
            echo ""
            echo "_Generated: ${TIMESTAMP}_"
            echo ""
            echo "**Workflow Run:** [#${GITHUB_RUN_NUMBER}](${RUN_URL})"
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo "**Triggered by:** ${GITHUB_ACTOR}"
            echo ""
            echo "---"
            echo ""
            echo "## Application Status"
            echo ""
            echo "| Application | URL | Version | Smoke Test | Version Endpoint |"
            echo "|-------------|-----|---------|------------|------------------|"
          } > "${WIKI_FILE}"

          ORDER=("Web App" "Weather API" "Star Wars API" "SOAP API" "OData API" "Movie API" "Flask App" "Fast API" "Appointments API")
          for APP_NAME in "${ORDER[@]}"; do
            IFS='|' read -r BASE_URL VERSION_PATH SMOKE_PATH <<< "${APPS[$APP_NAME]}"
            VERSION=$(curl -s --max-time 15 --retry 1 "${BASE_URL}${VERSION_PATH}" 2>/dev/null || echo "N/A")
            SMOKE_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 --retry 1 "${BASE_URL}${SMOKE_PATH}" 2>/dev/null || echo "000")
            if [[ "${SMOKE_STATUS}" -ge 200 && "${SMOKE_STATUS}" -lt 400 ]]; then
              SMOKE_ICON="✅"
            elif [[ "${SMOKE_STATUS}" -ge 400 && "${SMOKE_STATUS}" -lt 500 ]]; then
              SMOKE_ICON="⚠️"
            else
              SMOKE_ICON="❌"
            fi
            echo "| ${APP_NAME} | [${BASE_URL}](${BASE_URL}) | \`${VERSION}\` | ${SMOKE_ICON} HTTP ${SMOKE_STATUS} | [version](${BASE_URL}${VERSION_PATH}) |" >> "${WIKI_FILE}"
          done

          {
            echo ""
            echo "---"
            echo ""
            echo "## Screenshots"
            echo ""
          } >> "${WIKI_FILE}"

          # List available screenshots
          if [ -d screenshots ]; then
            FOUND_SCREENSHOTS=false
            for SCREENSHOT_DIR in screenshots/screenshot-*/; do
              if [ -d "${SCREENSHOT_DIR}" ]; then
                DIR_NAME=$(basename "${SCREENSHOT_DIR}")
                APP_LABEL=$(echo "${DIR_NAME}" | sed 's/screenshot-//; s/-/ /g' | sed 's/\b\(.\)/\u\1/g')
                for IMG in "${SCREENSHOT_DIR}"*.png; do
                  if [ -f "${IMG}" ]; then
                    FOUND_SCREENSHOTS=true
                    IMG_NAME="${DIR_NAME}-$(basename "${IMG}")"
                    # Copy to flat name for wiki
                    cp "${IMG}" "screenshots/${IMG_NAME}"
                    echo "### ${APP_LABEL}" >> "${WIKI_FILE}"
                    echo "" >> "${WIKI_FILE}"
                    echo "![${APP_LABEL}](${IMG_NAME})" >> "${WIKI_FILE}"
                    echo "" >> "${WIKI_FILE}"
                  fi
                done
              fi
            done
            if [ "${FOUND_SCREENSHOTS}" = "false" ]; then
              echo "_No screenshots captured in this run._" >> "${WIKI_FILE}"
            fi
          else
            echo "_No screenshots captured in this run._" >> "${WIKI_FILE}"
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "## Deployment Details"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Run ID | ${GITHUB_RUN_ID} |"
            echo "| Run Number | ${GITHUB_RUN_NUMBER} |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Timestamp | ${TIMESTAMP} |"
          } >> "${WIKI_FILE}"

          echo "wiki_file=${WIKI_FILE}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_REPO="${GITHUB_REPOSITORY}.wiki"
          WIKI_DIR="wiki-checkout"

          # Clone wiki repository
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${WIKI_REPO}.git" "${WIKI_DIR}" 2>/dev/null || {
            echo "Wiki not initialized. Creating initial wiki page..."
            mkdir -p "${WIKI_DIR}"
            cd "${WIKI_DIR}"
            git init
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${WIKI_REPO}.git"
            echo "# APIM Landing Zone Accelerator Wiki" > Home.md
            cd ..
          }

          # Create deployment reports directory
          mkdir -p "${WIKI_DIR}/Deployment-Reports"

          # Remove all old deployment report files — keep only the current run
          rm -f "${WIKI_DIR}"/Deployment-Reports/Deployment-Report-*.md

          # Remove old screenshot images from wiki root
          rm -f "${WIKI_DIR}"/screenshot-*.png

          # Copy flat-named screenshots to wiki repo root (GitHub Wiki serves images from root)
          if [ -d screenshots ]; then
            for IMG in screenshots/screenshot-*.png; do
              if [ -f "${IMG}" ]; then
                cp "${IMG}" "${WIKI_DIR}/$(basename "${IMG}")"
              fi
            done
          fi

          # Copy report as latest only (no historical copies)
          DATE_STAMP=$(date -u '+%Y-%m-%d')
          cp wiki-report.md "${WIKI_DIR}/Deployment-Reports/Deployment-Report-${DATE_STAMP}-Run-${GITHUB_RUN_NUMBER}.md"
          cp wiki-report.md "${WIKI_DIR}/Deployment-Reports/Latest-Deployment-Report.md"

          # Update wiki index page for deployment reports
          {
            echo "# Deployment Reports"
            echo ""
            echo "**[Latest Deployment Report](Deployment-Reports/Latest-Deployment-Report)**"
          } > "${WIKI_DIR}/Deployment-Reports.md"

          # Commit and push
          cd "${WIKI_DIR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "${GITHUB_ACTOR}"
          git add -A
          git diff --cached --quiet && echo "No wiki changes to commit" && exit 0
          git commit -m "Deployment report for run #${GITHUB_RUN_NUMBER} on $(date -u '+%Y-%m-%d')"
          git push origin master 2>/dev/null || git push origin main 2>/dev/null || echo "Wiki push failed - wiki may not be enabled"
      - name: Write deploy-all summary
        run: |
          {
            echo "## 📋 Deployment Report Published"
            echo ""
            echo "The full deployment report with screenshots has been published to the [GitHub Wiki](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki/Deployment-Reports)."
            echo ""
            cat wiki-report.md
          } >> "$GITHUB_STEP_SUMMARY"

  teardown-all:
    name: Teardown All Infrastructure
    needs:
      - publish-wiki
      - deploy-web-app
      - deploy-weather-api
      - deploy-star-wars-api
      - deploy-soap-api
      - deploy-odata-api
      - deploy-movie-api
      - deploy-flask-app
      - deploy-fast-api
      - deploy-appointments-api
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    environment: APIM_Teardown_All
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Tear down all resource groups
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RESOURCE_GROUPS=(
              "rg-web-appservice-linux-${{ inputs.web_app_instance }}"
              "rg-weather-appservice-linux-${{ inputs.weather_api_instance }}"
              "rg-star-wars-appservice-linux-${{ inputs.star_wars_api_instance }}"
              "rg-soap-appservice-linux-${{ inputs.soap_api_instance }}"
              "rg-odata-appservice-linux-${{ inputs.odata_api_instance }}"
              "rg-movies-appservice-linux-${{ inputs.movie_api_instance }}"
              "rg-msal-python-soln"
              "rg-fast-api-app-insights-001"
              "rg-appointments-fnapp-linux-${{ inputs.appointments_api_instance }}"
            )
            for RG in "${RESOURCE_GROUPS[@]}"; do
              if az group exists --name "$RG" | grep -q true; then
                echo "Deleting resource group $RG..."
                az group delete --name "$RG" --yes --no-wait
              else
                echo "Resource group $RG does not exist, skipping."
              fi
            done
            echo "Teardown initiated for all resource groups."
      - name: Write job summary
        run: |
          {
            echo "## 🗑️ Teardown Summary"
            echo ""
            echo "| Resource Group | Status |"
            echo "|----------------|--------|"
            echo "| rg-web-appservice-linux-${{ inputs.web_app_instance }} | 🔄 Deleting |"
            echo "| rg-weather-appservice-linux-${{ inputs.weather_api_instance }} | 🔄 Deleting |"
            echo "| rg-star-wars-appservice-linux-${{ inputs.star_wars_api_instance }} | 🔄 Deleting |"
            echo "| rg-soap-appservice-linux-${{ inputs.soap_api_instance }} | 🔄 Deleting |"
            echo "| rg-odata-appservice-linux-${{ inputs.odata_api_instance }} | 🔄 Deleting |"
            echo "| rg-movies-appservice-linux-${{ inputs.movie_api_instance }} | 🔄 Deleting |"
            echo "| rg-msal-python-soln | 🔄 Deleting |"
            echo "| rg-fast-api-app-insights-001 | 🔄 Deleting |"
            echo "| rg-appointments-fnapp-linux-${{ inputs.appointments_api_instance }} | 🔄 Deleting |"
            echo ""
            echo "> **Note:** Resource groups are being deleted asynchronously. Deletion may take several minutes to complete."
          } >> "$GITHUB_STEP_SUMMARY"
