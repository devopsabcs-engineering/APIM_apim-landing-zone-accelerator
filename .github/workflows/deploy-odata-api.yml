name: Deploy OData API

on:
  push:
    branches:
      - main
    paths:
      - 'src/OdataAppSoln/**'
      - 'src/OdataAppSoln/OdataApp/**'
      - 'src/OdataAppSoln/OdataApp/Dockerfile'
      - '.github/workflows/deploy-odata-api.yml'
      - 'infra/appservice/main.bicep'
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '002'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '002'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  SOLUTION: src/OdataAppSoln/OdataAppSoln.sln
  BUILD_CONFIGURATION: Release
  ARTIFACT_NAME: odata-api-artifact
  WEBSITE_PACKAGE_NAME: OdataApp
  RESOURCE_GROUP_NAME: rg-odata-appservice-linux-${{ inputs.instance_number || '002' }}
  LOCATION: canadacentral
  DEPLOYMENT_NAME: infra-deployment
  TEMPLATE_FILE: infra/appservice/main.bicep
  BASE_NAME: odata-api
  IMAGE_NAME: odataapi
  WORKING_DIRECTORY: src/OdataAppSoln/OdataApp
  BUILD_CONTEXT: src/OdataAppSoln
  DOCKERFILE_PATH: src/OdataAppSoln/OdataApp/Dockerfile
  INSTANCE_NUMBER: ${{ inputs.instance_number || '002' }}
  DEPLOY_INFRA: ${{ inputs.deploy_infra || true }}
  ADD_AZURE_AD_APP_SETTINGS: 'false'

jobs:
  set-version:
    name: Set version and create tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      assembly_sem_ver: ${{ steps.gitversion.outputs.assemblySemVer }}
      assembly_sem_file_ver: ${{ steps.gitversion.outputs.assemblySemFileVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Create Git tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.gitversion.outputs.semVer }}"
          git tag -a "$TAG" -m "Main version $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already exists, skipping."

  build:
    name: Build
    needs: set-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: Publish
        run: |
          dotnet publish "${{ env.WORKING_DIRECTORY }}" \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --output "${{ runner.temp }}/${{ env.WEBSITE_PACKAGE_NAME }}_${{ github.run_id }}" \
            -p:Version=${{ needs.set-version.outputs.semver }} \
            -p:FileVersion=${{ needs.set-version.outputs.assembly_sem_file_ver }} \
            -p:AssemblyVersion=${{ needs.set-version.outputs.assembly_sem_ver }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.WEBSITE_PACKAGE_NAME }}_${{ github.run_id }}

  deploy-infra:
    name: Deploy Infrastructure
    needs: build
    if: ${{ inputs.deploy_infra != false }}
    runs-on: ubuntu-latest
    environment: APIM_Odata_Api_infra_production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.LOCATION }}
            az deployment group create \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters baseName=${{ env.BASE_NAME }} \
              --parameters imageName=${{ env.IMAGE_NAME }} \
              --parameters addAzureAdAppSettings=${{ env.ADD_AZURE_AD_APP_SETTINGS }}

  build-and-push:
    name: Build and push Docker image
    needs: [set-version, deploy-infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get container registry
        id: get_acr
        uses: azure/cli@v2
        with:
          inlineScript: |
            ACR_NAME=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.containerRegistryName.value -o tsv)
            echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build \
              --registry ${{ steps.get_acr.outputs.acr_name }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.run_id }} \
              --image ${{ env.IMAGE_NAME }}:latest \
              --file ${{ env.DOCKERFILE_PATH }} \
              --build-arg GitVersion_SemVer=${{ needs.set-version.outputs.semver }} \
              --build-arg GitVersion_AssemblySemFileVer=${{ needs.set-version.outputs.assembly_sem_file_ver }} \
              --build-arg GitVersion_AssemblySemVer=${{ needs.set-version.outputs.assembly_sem_ver }} \
              ${{ env.BUILD_CONTEXT }}

  deploy-app:
    name: Deploy Application
    needs: [set-version, build-and-push]
    runs-on: ubuntu-latest
    environment: APIM_Odata_Api_app_production
    outputs:
      app_name: ${{ steps.get_app.outputs.app_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get app name
        id: get_app
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.appName.value -o tsv)
            echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/artifact
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.get_app.outputs.app_name }}
          package: ${{ runner.temp }}/artifact

  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app warmup
        run: sleep 30
      - name: Smoke test OData metadata
        id: smoke
        env:
          APP_NAME: ${{ needs.deploy-app.outputs.app_name }}
        run: |
          APP_URL="https://${APP_NAME}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/odata/\$metadata"
          echo "Testing: ${SMOKE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${SMOKE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 400 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Write job summary
        env:
          APP_NAME: ${{ needs.deploy-app.outputs.app_name }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          APP_URL="https://${APP_NAME}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/odata/\$metadata"

          # Fetch version
          VERSION_RESPONSE=$(curl -s --max-time 30 --retry 2 --retry-delay 5 "${APP_URL}/api/version" || echo "N/A")
          echo "Version: ${VERSION_RESPONSE}"

          # Capture screenshot of OData $metadata page
          npm install puppeteer 2>/dev/null
          echo "Warming up ${APP_URL}/odata/\$metadata..."
          curl -s -o /dev/null --max-time 30 "${APP_URL}/odata/\$metadata" || true
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 720 });
              await page.goto('${APP_URL}/odata/\$metadata', { waitUntil: 'networkidle2', timeout: 45000 }).catch(() => {});
              await new Promise(r => setTimeout(r, 3000));
              await page.screenshot({ path: 'screenshot.png' });
              await browser.close();
              console.log('Screenshot captured');
            })().catch(e => { console.error('Screenshot failed:', e.message); process.exit(0); });
          "

          {
            echo "## 🔍 Smoke Test Results"
            echo ""
            echo "| Check | URL | Status |"
            echo "|-------|-----|--------|"
            echo "| OData Metadata | [${SMOKE_URL}](${SMOKE_URL}) | ${SMOKE_RESULT} |"
            echo ""
            echo "### 📦 Version Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${VERSION_RESPONSE}\` |"
            echo "| Version URL | [${APP_URL}/api/version](${APP_URL}/api/version) |"
            echo ""
            if [ -f screenshot.png ]; then
              echo "### 📸 OData Metadata Screenshot"
              echo ""
              echo "Screenshot uploaded as workflow artifact: **screenshot-odata-api**"
              echo ""
            fi
            echo "🔗 **Application URL:** [${APP_URL}](${APP_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-odata-api
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 30

  teardown:
    name: Teardown Infrastructure
    needs: smoke-test
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deleting resource group ${{ env.RESOURCE_GROUP_NAME }}..."
            az group delete \
              --name ${{ env.RESOURCE_GROUP_NAME }} \
              --yes \
              --no-wait
            echo "Teardown initiated for ${{ env.RESOURCE_GROUP_NAME }}"
