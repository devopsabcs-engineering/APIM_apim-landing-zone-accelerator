  UpdateStageDev-update_job:
    name: update job dev
    needs:
      - Release_Dev_web-DeployToStorage
      - Release_Prod_web-DeployToStorage
    runs-on: windows-latest
    environment:
      name: ${{inputs.variableGroupNameDev}}
    steps:
      - name: checkout
        uses: actions/checkout@v3.5.0
      - name: Show variable groups with variable count
        env:
          GITHUB_TOKEN: ${{ secrets.ADO_P_A_T }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |-
          gh secret list --repo "${{env.OWNER}}/${{env.REPO}}"
          gh variable list --repo "${{env.OWNER}}/${{env.REPO}}"
        shell: pwsh
      - name: Download pfx cert as base64 string
        id: graphSpCertificate_secureFilePath
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "myTemporaryFile.txt"
          encodedString: ${{ secrets.ADO_AAD_GRAPH_CLIENT_BASE64 }}
      - name: Install Graph PowerShell module
        run: |-
          # Graph module shouldn't be preinstalled on the agent, but checking anyway.
          if (Get-Module -ListAvailable -Name Microsoft.Graph) {
            Write-Host "*** Module Microsoft.Graph exists."
          }
          else {
            Write-Host "*** Installing Microsoft.Graph module..."
            Install-Module Microsoft.Graph -Force
          }
          $CertPath = "${{ steps.graphSpCertificate_secureFilePath.outputs.filePath }}"
          Write-Host "*** Certificate path: " $CertPath
          $Certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($CertPath, "${{ secrets.AAD_ADO_CLIENT_CERT_PASSWORD }}")
          $tenantId = "${{inputs.TenantName}}.onmicrosoft.com"
          # Connecting using app-only authentication with in-memory certificate.
          Connect-MgGraph -ClientID "${{ vars.AAD_ADO_CLIENT_ID }}" -TenantId "$tenantId" -Certificate $Certificate
          $app = Get-MgApplication | Where-Object { $_.AppId -eq "${{ vars.MSAL_AUTH_CLIENTID }}" }
          $newUri = "${{ vars.MSAL_AUTH_REDIRECT_URI }}"
          Write-Host "front end app $app - checking for uri $newUri"
          if ($app.Spa.RedirectUris.Contains("$newUri")) {
            Write-Host "*** Redirect URI $newUri already present, skipping."
          }
          else {
            # Add FQDN to the registration
            $app.Spa.RedirectUris += "$newUri"
            # Update app registration
