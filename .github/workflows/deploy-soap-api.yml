name: Deploy SOAP API

on:
  push:
    branches:
      - main
    paths:
      - 'src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/**'
      - 'src/soap-service-dotnetcore-example/**'
      - 'src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/Dockerfile'
      - '.github/workflows/deploy-soap-api.yml'
      - 'infra/appservice/main.bicep'
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '007'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure'
        type: boolean
        default: true
      instance_number:
        description: 'Instance number'
        type: string
        default: '007'
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  SOLUTION: src/soap-service-dotnetcore-example/soap-service-dotnetcore-example.sln
  BUILD_CONFIGURATION: Release
  TEST_PROJECT: src/soap-service-dotnetcore-example/AddressBook.Service.SOAP.IntegrationTests/AddressBook.Service.SOAP.IntegrationTests.csproj
  ARTIFACT_NAME: myWebsites
  WEBSITE_PACKAGE_NAME: AddressBook.Service.SOAP
  RESOURCE_GROUP_NAME: rg-soap-appservice-linux-${{ inputs.instance_number || '007' }}
  LOCATION: canadacentral
  DEPLOYMENT_NAME: infra-deployment
  TEMPLATE_FILE: infra/appservice/main.bicep
  BASE_NAME: soap-api
  IMAGE_NAME: soapapi
  WORKING_DIRECTORY: src/soap-service-dotnetcore-example/AddressBook.Service.SOAP
  BUILD_CONTEXT: src/soap-service-dotnetcore-example
  DOCKERFILE_PATH: src/soap-service-dotnetcore-example/AddressBook.Service.SOAP/Dockerfile
  INSTANCE_NUMBER: ${{ inputs.instance_number || '007' }}
  DEPLOY_INFRA: ${{ inputs.deploy_infra || true }}
  ADD_AZURE_AD_APP_SETTINGS: 'false'

jobs:
  set-version:
    name: Set version and create tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      assembly_sem_ver: ${{ steps.gitversion.outputs.assemblySemVer }}
      assembly_sem_file_ver: ${{ steps.gitversion.outputs.assemblySemFileVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Create Git tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.gitversion.outputs.semVer }}"
          git tag -a "$TAG" -m "Main version $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already exists, skipping."

  build:
    name: Build
    needs: set-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: Publish
        run: |
          dotnet publish "${{ env.WORKING_DIRECTORY }}" \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --output "${{ runner.temp }}/${{ env.WEBSITE_PACKAGE_NAME }}_${{ github.run_id }}" \
            -p:Version=${{ needs.set-version.outputs.semver }} \
            -p:FileVersion=${{ needs.set-version.outputs.assembly_sem_file_ver }} \
            -p:AssemblyVersion=${{ needs.set-version.outputs.assembly_sem_ver }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.WEBSITE_PACKAGE_NAME }}_${{ github.run_id }}

  deploy-infra:
    name: Deploy Infrastructure
    needs: build
    if: ${{ inputs.deploy_infra != false }}
    runs-on: ubuntu-latest
    environment: APIM_Soap_Api_infra_production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.LOCATION }}
            az deployment group create \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters baseName=${{ env.BASE_NAME }} \
              --parameters imageName=${{ env.IMAGE_NAME }} \
              --parameters addAzureAdAppSettings=${{ env.ADD_AZURE_AD_APP_SETTINGS }}

  build-and-push:
    name: Build and push Docker image
    needs: [set-version, deploy-infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get container registry
        id: get_acr
        uses: azure/cli@v2
        with:
          inlineScript: |
            ACR_NAME=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.containerRegistryName.value -o tsv)
            echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build \
              --registry ${{ steps.get_acr.outputs.acr_name }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.run_id }} \
              --image ${{ env.IMAGE_NAME }}:latest \
              --file ${{ env.DOCKERFILE_PATH }} \
              --build-arg GitVersion_SemVer=${{ needs.set-version.outputs.semver }} \
              --build-arg GitVersion_AssemblySemFileVer=${{ needs.set-version.outputs.assembly_sem_file_ver }} \
              --build-arg GitVersion_AssemblySemVer=${{ needs.set-version.outputs.assembly_sem_ver }} \
              ${{ env.BUILD_CONTEXT }}

  deploy-app:
    name: Deploy Application
    needs: [set-version, build-and-push]
    runs-on: ubuntu-latest
    environment: APIM_Soap_Api_app_production
    outputs:
      app_name: ${{ steps.get_app.outputs.app_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get app name
        id: get_app
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME=$(az deployment group show \
              --name ${{ env.DEPLOYMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --query properties.outputs.appName.value -o tsv)
            echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/artifact
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.get_app.outputs.app_name }}
          package: ${{ runner.temp }}/artifact

  smoke-test:
    name: Smoke Test
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app warmup
        run: sleep 30
      - name: Smoke test SOAP WSDL
        id: smoke
        env:
          APP_NAME: ${{ needs.deploy-app.outputs.app_name }}
        run: |
          APP_URL="https://${APP_NAME}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/PersonProfileService.asmx?wsdl"
          echo "Testing: ${SMOKE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${SMOKE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "smoke_url=${SMOKE_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 400 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Write job summary
        env:
          APP_URL: ${{ steps.smoke.outputs.app_url }}
          SMOKE_URL: ${{ steps.smoke.outputs.smoke_url }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          {
            echo "## 🔍 Smoke Test Results"
            echo ""
            echo "| Check | URL | Status |"
            echo "|-------|-----|--------|"
            echo "| SOAP WSDL | [${SMOKE_URL}](${SMOKE_URL}) | ${SMOKE_RESULT} |"
            echo ""
            echo "🔗 **Application URL:** [${APP_URL}](${APP_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    name: Teardown Infrastructure
    needs: smoke-test
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deleting resource group ${{ env.RESOURCE_GROUP_NAME }}..."
            az group delete \
              --name ${{ env.RESOURCE_GROUP_NAME }} \
              --yes \
              --no-wait
            echo "Teardown initiated for ${{ env.RESOURCE_GROUP_NAME }}"
