name: Deploy Fast API

on:
  push:
    branches:
      - main
    paths:
      - 'src/fast-api-app-insights/**'
      - '.github/workflows/deploy-fast-api.yml'
      - 'src/fast-api-app-insights/main.bicep'
  workflow_dispatch:
    inputs:
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false
  workflow_call:
    inputs:
      teardown:
        description: 'Tear down infrastructure after deployment'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: '3.13'
  ARTIFACT_NAME: fastapi-app
  PACKAGE_FOLDER: package
  PACKAGE_ARCHIVE: app.zip
  BICEP_FILE: src/fast-api-app-insights/main.bicep
  RESOURCE_GROUP_NAME: rg-fast-api-app-insights-001
  LOCATION: canadacentral
  APP_NAME: fast-api-app-insights-001

jobs:
  set-version:
    name: Set version and create tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Create Git tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.gitversion.outputs.semVer }}"
          git tag -a "$TAG" -m "FastAPI version $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag $TAG already exists, skipping."

  build:
    name: Build and Package
    needs: set-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Current version is ${{ steps.gitversion.outputs.semVer }}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies and create package
        working-directory: src/fast-api-app-insights
        run: |
          set -e
          echo "Installing dependencies..."
          python -m pip install --upgrade pip

          mkdir -p ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }}

          echo "Installing dependencies (optimized for size)..."
          pip install \
            --target ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }} \
            --no-cache-dir \
            --compile \
            -r requirements.txt

          echo "Copying application files..."
          cp main.py telemetry_v2.py ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }}/
          cp requirements.txt ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }}/

          echo "Replacing __VERSION__ with ${{ steps.gitversion.outputs.semVer }}"
          sed -i "s/__VERSION__/${{ steps.gitversion.outputs.semVer }}/g" ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }}/main.py

          echo "Cleaning up unnecessary files..."
          cd ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }}
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          find . -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true

          echo "Package size after cleanup:"
          du -sh .
          echo "Package created successfully"

      - name: Create deployment archive
        run: |
          cd ${{ runner.temp }}/${{ env.PACKAGE_FOLDER }}
          zip -r ${{ runner.temp }}/${{ env.PACKAGE_ARCHIVE }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.PACKAGE_ARCHIVE }}

  deploy:
    name: Deploy Infrastructure and App
    needs: [set-version, build]
    runs-on: ubuntu-latest
    environment: APIM_fastapi-app-insights
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate SemVer
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Display version
        run: echo "Deploying version ${{ steps.gitversion.outputs.semVer }}"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/artifact
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.LOCATION }}
            az deployment group create \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --template-file ${{ env.BICEP_FILE }} \
              --parameters appName=${{ env.APP_NAME }} \
                           location=${{ env.LOCATION }} \
                           skuName=B1 \
                           skuTier=Basic \
                           skuCapacity=1 \
                           deploymentEnvironment=production \
                           appVersion=${{ steps.gitversion.outputs.semVer }}
      - name: Configure Web App settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp config appsettings set \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --name ${{ env.APP_NAME }} \
              --settings \
                SCM_COMMAND_IDLE_TIMEOUT=3600 \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                ENABLE_ORYX_BUILD=false \
                WEBSITES_PORT=8000 \
              --output none

            az webapp config set \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --name ${{ env.APP_NAME }} \
              --startup-file "python -m uvicorn main:app --host 0.0.0.0 --port 8000" \
              --output none
      - name: Wait for SCM container to stabilize
        run: sleep 60
      - name: Deploy application package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ${{ runner.temp }}/artifact/${{ env.PACKAGE_ARCHIVE }}
      - name: Restart and verify
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp restart \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --name ${{ env.APP_NAME }} \
              --output none

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app warmup
        run: sleep 30
      - name: Smoke test health endpoint
        id: smoke_health
        run: |
          APP_URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/healthz"
          echo "Testing: ${SMOKE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${SMOKE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "smoke_url=${SMOKE_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 400 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test API docs
        id: smoke_docs
        run: |
          APP_URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          SMOKE_URL="${APP_URL}/docs"
          echo "Testing: ${SMOKE_URL}"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 10 "${SMOKE_URL}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "smoke_url=${SMOKE_URL}" >> "$GITHUB_OUTPUT"
          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 400 ]]; then
            echo "result=✅ Passed (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Warning (HTTP ${HTTP_STATUS})" >> "$GITHUB_OUTPUT"
          fi
      - name: Write job summary
        env:
          APP_URL: ${{ steps.smoke_health.outputs.app_url }}
          HEALTH_URL: ${{ steps.smoke_health.outputs.smoke_url }}
          HEALTH_RESULT: ${{ steps.smoke_health.outputs.result }}
          DOCS_URL: ${{ steps.smoke_docs.outputs.smoke_url }}
          DOCS_RESULT: ${{ steps.smoke_docs.outputs.result }}
        run: |
          # Fetch version
          VERSION_RESPONSE=$(curl -s --max-time 30 --retry 2 --retry-delay 5 "${APP_URL}/version" || echo "N/A")
          echo "Version: ${VERSION_RESPONSE}"

          # Capture screenshot of API docs
          npm install puppeteer 2>/dev/null
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox', '--disable-setuid-sandbox'] });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 720 });
              try { await page.goto('${DOCS_URL}', { waitUntil: 'networkidle2', timeout: 30000 }); }
              catch (e) { console.log('Navigation warning:', e.message); }
              await page.screenshot({ path: 'screenshot.png' });
              await browser.close();
              console.log('Screenshot captured');
            })().catch(e => { console.error('Screenshot failed:', e.message); process.exit(0); });
          "

          {
            echo "## 🔍 Smoke Test Results"
            echo ""
            echo "| Check | URL | Status |"
            echo "|-------|-----|--------|"
            echo "| Health Check | [${HEALTH_URL}](${HEALTH_URL}) | ${HEALTH_RESULT} |"
            echo "| API Docs | [${DOCS_URL}](${DOCS_URL}) | ${DOCS_RESULT} |"
            echo ""
            echo "### 📦 Version Information"
            echo ""
            echo "\`\`\`json"
            echo "${VERSION_RESPONSE}"
            echo "\`\`\`"
            echo ""
            if [ -f screenshot.png ]; then
              echo "### 📸 API Docs Screenshot"
              echo ""
              echo "Screenshot uploaded as workflow artifact: **screenshot-fast-api**"
              echo ""
            fi
            echo "🔗 **Application URL:** [${APP_URL}](${APP_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-fast-api
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 30

  teardown:
    name: Teardown Infrastructure
    needs: smoke-test
    if: ${{ inputs.teardown == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Deleting resource group ${{ env.RESOURCE_GROUP_NAME }}..."
            az group delete \
              --name ${{ env.RESOURCE_GROUP_NAME }} \
              --yes \
              --no-wait
            echo "Teardown initiated for ${{ env.RESOURCE_GROUP_NAME }}"
