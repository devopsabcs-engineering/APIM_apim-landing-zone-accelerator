parameters:
  - name: API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH
    type: string
    displayName: Folder where the artifacts reside (no clobbering will occur)
    default: "artifacts.dev-005" # CHANGE THIS TO THE FOLDER NAME WHERE THE ARTIFACTS RESIDE
    values:
      - artifacts.dev-005
      - artifacts.dev-005.api-team-001
      - artifacts.dev-005.api-team-002
      - artifacts.dev-005.merged
  - name: COMMIT_ID
    type: string
    displayName: Choose "publish-all-artifacts-in-repo" only when you want to force republishing all artifacts (e.g. after build failure). Otherwise stick with the default behavior of "publish-artifacts-in-last-commit"
    default: publish-artifacts-in-last-commit
    values:
      - publish-artifacts-in-last-commit
      - publish-all-artifacts-in-repo
  - name: AGENT_TYPE
    type: string
    displayName: Agent type
    default: "Microsoft-hosted"
    values:
      - Microsoft-hosted
      - Self-hosted
  - name: VM_IMAGE
    type: string
    displayName: VM Image (for Microsoft-hosted agents)
    default: "ubuntu-latest"
    values:
      - ubuntu-latest
      - windows-latest
      - macos-latest
  - name: POOL_NAME
    type: string
    displayName: Pool name (for self-hosted agents)
    default: "DefaultLinuxOnPremPool"

variables:
  - group: APIM_rg-apim-vnet-external-dev-005-eu2-stable # CHANGE THIS TO YOUR RESOURCE GROUP VARIABLE GROUP
  - name: System.Debug
    value: true

stages:
  - stage: push_changes_to_Dev_APIM
    displayName: Push changes to Dev APIM
    jobs:
      - job: push_changes_to_Dev_APIM
        displayName: Push changes to Dev APIM
        pool:
          ${{ if eq(parameters.AGENT_TYPE, 'Microsoft-hosted') }}:
            vmImage: "${{ parameters.VM_IMAGE }}"
          ${{ if eq(parameters.AGENT_TYPE, 'Self-hosted') }}:
            name: "${{ parameters.POOL_NAME }}"
        steps:
          - template: run-publisher-with-env.yaml
            parameters:
              API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: ${{ parameters.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}
              RESOURCE_GROUP_NAME: $(RESOURCE_GROUP_NAME)
              API_MANAGEMENT_SERVICE_NAME: $(APIM_NAME)
              ENVIRONMENT: "Dev-005-stable" # CHANGE THIS TO YOUR ENVIRONMENT NAME for display purposes ONLY
              COMMIT_ID: ${{ parameters.COMMIT_ID }}
  - stage: push_changes_to_Prod_APIM
    displayName: Push changes to Prod APIM
    jobs:
      - deployment: push_changes_to_Prod_APIM
        displayName: Push changes to Prod APIM
        variables:
          #setting the testSecretValue to the prod resource group name as an example
          testSecretValue: $(RESOURCE_GROUP_NAME_Prod)
        pool:
          ${{ if eq(parameters.AGENT_TYPE, 'Microsoft-hosted') }}:
            vmImage: "${{ parameters.VM_IMAGE }}"
          ${{ if eq(parameters.AGENT_TYPE, 'Self-hosted') }}:
            name: "${{ parameters.POOL_NAME }}"
        # creates an environment if it doesn't exist
        environment: "APIM_rg-apim-vnet-external-prod-005-eu2_apiops-stable" # CHANGE THIS TO YOUR ENVIRONMENT NAME for Production APIM
        strategy:
          # default deployment strategy, more coming...
          runOnce:
            deploy:
              steps:
                - template: run-publisher-with-env.yaml
                  parameters:
                    API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: ${{ parameters.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}
                    RESOURCE_GROUP_NAME: $(RESOURCE_GROUP_NAME_Prod)
                    CONFIGURATION_YAML_PATH: $(Build.SourcesDirectory)/configuration.prod-005.yaml # CHANGE THIS TO THE PATH OF YOUR CONFIGURATION FILE
                    ENVIRONMENT: "Prod-005-stable" # CHANGE THIS TO YOUR ENVIRONMENT NAME for display purposes ONLY
                    COMMIT_ID: ${{ parameters.COMMIT_ID }}
